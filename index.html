      if (view === "organizer") App.openEvent(row.dataset.ev, row.dataset.tab);
      else App.openPublic(row.dataset.ev);
    });
    // 開いた時点で既読にする（バッジは次の描画で消える）
    await markRead(view, me && me.id);
    App.refreshBadge();
  }

  return { render, unreadCount, markRead, forOrganizer, forParticipant };
})();


// ===== [10] 主催者：設定（S-5 / F-32, F-33） =====
const Settings = (() => {
  async function render(el) {
    el.innerHTML = `
      <div class="page-head"><h2>設定</h2></div>
      <div class="card pad">
        <h3 style="font-size:15px;margin-bottom:8px">データ</h3>
        <div class="row-actions">
          <button class="btn primary" id="seed">デモデータを投入</button>

// ===== [11] 参加者：公開ページ一覧＋公開ページ（S-6 / F-65, F-83, 4-3） =====
const Participant = (() => {
  // 参加者ビューの一覧: 一般公開かつ公開中のイベントのみ（限定公開・下書き・中止/終了は出さない）
  async function renderList(el) {
    const now = Date.now();
    const [events, apps] = await Promise.all([
      Repo.events.all(), Repo.applications.all()]);
    const appsByEv = groupBy(apps, "eventId");
    /* 出すのは「今から申込める／これから受付が始まる」ものだけ（F-83b）。
       **締切を過ぎたイベントは出さない。** 以前は開催日が未来なら出していたので、
       開いても「受付終了」のボタンしか押せないイベントが並び、探す側には区別がつかなかった。
       判定は Domain.timing に任せる——時期を保存しない方針（4-3）に揃え、ここで
       締切と現在時刻を再び比べない。held（開催済）・closed（受付終了）・cancelled（中止）は
       これで自動的に落ちる。満席は残す（申込は不可だが、開催そのものは知らせる価値がある）。 */
    const visible = events.filter(e => {
      if (e.status !== "published" || e.visibility !== "public") return false;
      const phase = Domain.timing(e, now).phase;
      return phase === "open" || phase === "before";
    }).sort((a,b)=> new Date(a.startAt||0)-new Date(b.startAt||0));

    el.innerHTML = `
      <div class="page-head"><h2>開催予定のイベント</h2>
        <span class="sub">申込を受け付けているイベントのみ</span></div>
      ${visible.length ? visible.map(e => {
        const ap = appsByEv[e.id]||[];
        const rem = Domain.remaining(e, ap);
        return `<div class="card pcard" data-ev="${e.id}">
          ${coverBand(e)}
          <div class="pb">
            <div class="pt">${Util.esc(e.title)}</div>
            <div class="pm">${Util.fmtRange(e.startAt, e.endAt)}${e.venueName?" ／ "+Util.esc(e.venueName):""}</div>
            <div class="pr">残席 ${rem>0?rem:"満席"}</div>
          </div>
        </div>`;
      }).join("")
      : `<div class="empty"><div class="big">申込を受け付けているイベントはありません</div></div>`}`;
    el.querySelectorAll("[data-ev]").forEach(c =>
      c.onclick = () => App.openPublic(c.dataset.ev));
  }

  // 公開ページ（F-83 の並び）。限定公開もURL直接指定なら閲覧可（4-3）
  async function renderPublic(el, eventId) {
    const [ev, apps] = await Promise.all([
      Repo.events.get(eventId),
      Repo.applications.byEvent(eventId)]);
    const preview = App.isPreview(eventId);   // 下書きの見え方確認（F-07）
    if (!ev || (ev.status === "draft" && !preview)) {
      el.innerHTML = `<div class="empty"><div class="big">このイベントは表示できません</div></div>`; return;
    }
    const notices = Ops.noticesOf(await Repo.messages.byEvent(eventId));
    const t = Domain.timing(ev);
    const rem = Domain.remaining(ev, apps);
    const btn = Domain.applyButtonLabel(ev, apps);
    const mapLink = ev.venueAddress
      ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.venueAddress)}" target="_blank" rel="noopener">地図を開く</a>` : "";

    el.innerHTML = `
      <div class="page-head"><button class="btn ghost" id="back">← 一覧へ</button></div>
      ${preview ? `<div class="note" style="margin-bottom:14px">これは<b>下書きのプレビュー</b>です。参加者にはまだ見えません。</div>` : ""}
      <div class="pub">
        ${coverHtml(ev)}
        <h1>${Util.esc(ev.title)}</h1>
        ${ev.status==="cancelled" ? `<div class="banner" style="position:static;border-radius:8px">このイベントは中止されました</div>`:""}
        <div class="kv">
          <div class="row"><span class="k">開催日時</span><span>${Util.fmtRange(ev.startAt, ev.endAt)}</span></div>
          <div class="row"><span class="k">開催形式</span><span>${Domain.FORMAT[ev.eventFormat||"onsite"]}${
            (ev.eventFormat && ev.eventFormat !== "onsite")
              ? '<span class="hint" style="display:inline;margin-left:8px">視聴URLは申込後にマイ申込で確認できます</span>' : ""}</span></div>
          <div class="row"><span class="k">会場</span><span>${Util.esc(ev.venueName)||"—"} ${mapLink}</span></div>
          <div class="row"><span class="k">対象者</span><span>${Util.esc(ev.targetAudience)||"—"}</span></div>
          <div class="row"><span class="k">受付</span><span>${
            ev.applyStartAt ? `${Util.fmtDate(ev.applyStartAt)} 〜 ` : ""}${
            ev.applyDeadline ? `${Util.fmtDate(ev.applyDeadline)} まで` : "—"}</span></div>
        </div>
        ${noticeBlock(notices)}
        <div style="white-space:pre-wrap;margin:14px 0">${Util.esc(ev.description)||""}</div>
        <div class="seats">残席 ${rem>0?rem:"満席"}</div>
        <button class="btn primary apply" id="apply" ${btn.disabled?"disabled style='opacity:.55;cursor:not-allowed'":""}>${btn.text}</button>
        <div class="kv" style="margin-top:16px"><div class="row"><span class="k">問い合わせ</span>
          <span>${Util.esc(ev.contactInfo)||"—"}</span></div></div>
      </div>`;
    el.querySelector("#back").onclick = () => App.go("participant");
    const applyBtn = el.querySelector("#apply");
    if (applyBtn && !btn.disabled) applyBtn.onclick = () => App.openApply(ev.id);
  }

  // 主催者からのお知らせ。公開ページとマイ申込の両方に出す（参加者向けの唯一の連絡手段）
  const noticeBlock = (notices) => !notices.length ? "" : `
    <div class="notices">
      <div class="nh">主催者からのお知らせ（${notices.length}）</div>
      ${notices.map(n => `<div class="nitem">
        <div class="nt">${Util.esc(n.title)}</div>
        <div class="nm">${Util.fmtDateTime(n.createdAt)}・${Util.esc(n.author||"運営")}</div>
        ${n.body ? `<div class="nb">${Util.esc(n.body)}</div>` : ""}
      </div>`).join("")}
    </div>`;

  /* 視聴情報（F-93）。オンライン／ハイブリッドのとき、申込者にだけ URL を見せる。
     公開ページには出さない（4-3 の「自分の申込は確認URL経由でのみ見える」に揃える）。 */
  const onlineBlock = (ev, cancelled) => {
    const f = ev.eventFormat || "onsite";
    if (f === "onsite" || !ev.onlineUrl) return "";
    if (cancelled) return "";
    return `<div class="online-box">
      <div class="oh">${Domain.FORMAT[f]}の視聴情報（申込者のみ）</div>
      <div class="copybox"><input readonly value="${Util.esc(ev.onlineUrl)}">
        <a class="btn primary" href="${Util.esc(ev.onlineUrl)}" target="_blank" rel="noopener">開く</a></div>
      ${ev.onlineNote ? `<div class="on">${Util.esc(ev.onlineNote)}</div>` : ""}
    </div>`;
  };

  /* 受付用QR（F-95）。トークンを符号化する。主催者はこれをカメラで読んでチェックインする。
     生成ライブラリは冒頭にインライン化してある。CDN から読まない理由は、
     この画面に参加者の個人情報があり、第三者スクリプトの改ざんリスクを負いたくないため
     。 */
  const qrBlock = (app) => `<div class="qr-box">
    <div class="qh">受付用QRコード</div>
    <div id="qrHost" data-token="${app.token}"><button class="btn sm" id="qrShow">QRを表示</button></div>
    <div class="hint">当日、受付でこの画面を見せてください。</div></div>`;

  async function wireQr(el) {
    const host = el.querySelector("#qrHost");
    if (!host) return;
    const btn = el.querySelector("#qrShow");
    if (!btn) return;
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        /* ライブラリは冒頭にインライン化済みなので、ネットワークに出ずに生成できる。
           DOM を使わず SVG 文字列を返すため、既存の「文字列を組み立てて innerHTML」に乗る。
           API は addData → make → createSvgTag。 */
        const qr = qrcode(0, "M");         // 0=バージョン自動選択 / M=誤り訂正レベル
        qr.addData(host.dataset.token);
        qr.make();
        host.innerHTML = qr.createSvgTag(5, 0);   // セル5px・余白0
      } catch {
        host.innerHTML = `<div class="hint">QRの生成に失敗しました。
          受付では氏名で検索してもらってください。</div>`;
      }
    };
  }

  // ---- 申込フロー S-7（入力→確認 / F-16, F-52, F-53, F-54, F-80, F-84） ----
  let flow = null; // { ev, phase:'input'|'confirm', data, host }

  async function renderApply(el, eventId) {
    const [ev, apps] = await Promise.all([
      Repo.events.get(eventId),
      Repo.applications.byEvent(eventId)]);
    if (!ev || ev.status !== "published") {
      el.innerHTML = `<div class="empty"><div class="big">申込できないイベントです</div></div>`; return;
    }
    if (Domain.remaining(ev, apps) <= 0) {
      el.innerHTML = `<div class="empty"><div class="big">満席のため申込できません</div>
        <button class="btn" id="back" style="margin-top:12px">← 戻る</button></div>`;
      el.querySelector("#back").onclick = () => App.openPublic(ev.id);
      return;
    }
    const t = Domain.timing(ev);
    if (t.phase !== "open") {
      el.innerHTML = `<div class="empty"><div class="big">${t.label}のため申込できません</div>
        <button class="btn" id="back" style="margin-top:12px">← 戻る</button></div>`;
      el.querySelector("#back").onclick = () => App.openPublic(ev.id);
      return;
    }
    flow = { ev, phase:"input", host:el,
      data:{ name:"", kana:"", email:"", consent:false, answers:{} } };
    paintFlow();
  }

  function collectFlow() {
    const el = flow.host;
    const g = id => el.querySelector(id);
    if (!g("#fName")) return;
    const answers = {};
    for (const q of (flow.ev.questions || [])) {
      const inp = el.querySelector(`[data-q="${q.id}"]`);
      if (!inp) continue;
      answers[q.id] = q.type === "checkbox" ? inp.checked : inp.value;
    }
    flow.data = { name:g("#fName").value, kana:g("#fKana").value,
      email:g("#fEmail").value, consent:g("#fConsent").checked, answers };
  }

  // カスタム質問の入力欄（F-91）
  function questionFields(ev, data, err) {
    return (ev.questions || []).map(q => {
      const v = (data.answers || {})[q.id] ?? "";
      const e = err["q_" + q.id];
      const cls = e ? "invalid" : "";
      let input;
      if (q.type === "textarea")
        input = `<textarea data-q="${q.id}" class="${cls}">${Util.esc(v)}</textarea>`;
      else if (q.type === "select")
        input = `<select data-q="${q.id}" class="${cls}"><option value="">選択してください</option>
          ${(q.options||[]).map(o => `<option ${v===o?"selected":""}>${Util.esc(o)}</option>`).join("")}</select>`;
      else if (q.type === "checkbox")
        input = `<label style="font-weight:400;display:flex;gap:8px;align-items:center">
          <input type="checkbox" data-q="${q.id}" ${v?"checked":""}>はい</label>`;
      else
        input = `<input data-q="${q.id}" value="${Util.esc(v)}" class="${cls}">`;
      return `<div class="field"><label>${Util.esc(q.label)}${
        q.required?'<span class="req">必須</span>':""}</label>${input}
        ${e?`<div class="err">${Util.esc(e)}</div>`:""}</div>`;
    }).join("");
  }

  // 検証は AppSvc と共通（主催者の修正欄でも同じ規則を使う / F-16, F-52〜F-54）。
  // カスタム質問の必須チェックだけここで足す（F-91）
  function validateApply(d, ev) {
    const e = AppSvc.validate(d);
    for (const q of (ev.questions || [])) {
      if (!q.required) continue;
      const v = (d.answers || {})[q.id];
      if (q.type === "checkbox" ? !v : !String(v ?? "").trim())
        e["q_" + q.id] = "回答してください";
    }
    return e;
  }

  function paintFlow() {
    const { ev, phase, data } = flow, el = flow.host;
    const steps = `<div class="flow-steps">
      <span class="${phase==='input'?'on':''}">1. 入力</span>›
      <span class="${phase==='confirm'?'on':''}">2. 確認</span>› <span>3. 完了</span></div>`;

    if (phase === "input") {
      const err = flow.errors || {};
      const fld = (id, label, val, opts={}) => `
        <div class="field"><label>${label}<span class="req">必須</span></label>
        <input id="${id}" type="${opts.type||'text'}" value="${Util.esc(val)}" ${opts.ph?`placeholder="${Util.esc(opts.ph)}"`:''} class="${err[opts.key]?'invalid':''}">
        ${err[opts.key]?`<div class="err">${Util.esc(err[opts.key])}</div>`:''}
        ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</div>`;
      el.innerHTML = `
        <div class="page-head"><button class="btn ghost" id="back">← ${Util.esc(ev.title)}</button></div>
        ${steps}
        <div class="card pad">
          <h3 style="font-size:16px;margin-bottom:14px">${Util.esc(ev.title)} に申込</h3>
          ${fld("fName","氏名",data.name,{key:"name",ph:"山田 太郎"})}
          ${fld("fKana","氏名（カナ）",data.kana,{key:"kana",ph:"ヤマダ タロウ",hint:"ひらがな・カタカナで入力"})}
          ${fld("fEmail","メールアドレス",data.email,{key:"email",type:"email",ph:"taro@example.com"})}
          ${questionFields(ev, data, err)}
          <div class="consent"><input type="checkbox" id="fConsent" ${data.consent?"checked":""}>
            <label for="fConsent" style="font-weight:400">今後のイベント案内の受け取りに同意する（任意）</label></div>
          <button class="btn primary" id="toConfirm" style="width:100%;justify-content:center;padding:12px">確認へ進む</button>
        </div>`;
      el.querySelector("#back").onclick = () => App.openPublic(ev.id);
      el.querySelector("#toConfirm").onclick = () => {
        collectFlow();
        const errors = validateApply(flow.data, ev);
        if (Object.keys(errors).length) {
          flow.errors = errors; paintFlow();
          const first = el.querySelector(".invalid"); if (first) first.focus(); // F-84
          return;
        }
        flow.errors = null;
        flow.data.kana = Util.toKatakana(flow.data.kana); // 保存時カタカナへ（F-52）
        flow.phase = "confirm"; paintFlow();
      };
    } else { // confirm
      const d = data;
      el.innerHTML = `
        <div class="page-head"><button class="btn ghost" id="back">← 入力へ戻る</button></div>
        ${steps}
        <div class="card pad">
          <h3 style="font-size:16px;margin-bottom:12px">この内容で申込みます</h3>
          <div class="summary">
            <div class="row"><span class="k">イベント</span><span>${Util.esc(ev.title)}</span></div>
            <div class="row"><span class="k">氏名</span><span>${Util.esc(d.name)}</span></div>
            <div class="row"><span class="k">カナ</span><span>${Util.esc(d.kana)}</span></div>
            <div class="row"><span class="k">メール</span><span>${Util.esc(d.email)}</span></div>
            ${(ev.questions||[]).map(q => {
              const v = (d.answers||{})[q.id];
              const shown = q.type === "checkbox" ? (v ? "はい" : "いいえ") : (v || "—");
              return `<div class="row"><span class="k">${Util.esc(q.label)}</span><span>${Util.esc(shown)}</span></div>`;
            }).join("")}
            <div class="row"><span class="k">案内の受取</span><span>${d.consent?"同意する":"同意しない"}</span></div>
          </div>
          <div class="row-actions" style="margin-top:16px">
            <button class="btn" id="back2">修正する</button>
            <button class="btn primary" id="submit" style="flex:1;justify-content:center">申込む</button>
          </div>
        </div>`;
      const back = () => { flow.phase = "input"; paintFlow(); };
      el.querySelector("#back").onclick = back;
      el.querySelector("#back2").onclick = back;
      const submit = el.querySelector("#submit");
      submit.onclick = async () => {
        submit.disabled = true;                       // 二重送信を防ぐ
        try {
          const { app } = await AppSvc.apply(ev.id, d);
          App.openComplete(ev.id, { ...d, token: app.token });
        } catch (e) {
          submit.disabled = false;
          FB.error(e.message);
        }
      };
    }
  }

  // ---- 申込完了 S-8（F-88） ----
  async function renderComplete(el, eventId, data) {
    if (!data) { App.go("list"); return; } // 直接遷移などでデータが無い場合は一覧へ
    const ev = await Repo.events.get(eventId);
    const url = `${location.origin}${location.pathname}?ticket=${data.token}`;
    el.innerHTML = `
      <div class="flow-steps"><span>1. 入力</span>› <span>2. 確認</span>› <span class="on">3. 完了</span></div>
      <div class="card pad" style="text-align:center">
        <div style="font-size:40px">✅</div>
        <h2 style="margin:8px 0">申込が完了しました</h2>
        <p style="color:var(--muted)">${ev?Util.esc(ev.title):""} への申込を受け付けました。</p>
        <div class="summary" style="text-align:left;margin:18px 0">
          <div class="row"><span class="k">氏名</span><span>${Util.esc(data.name)}</span></div>
          <div class="row"><span class="k">メール</span><span>${Util.esc(data.email)}</span></div>
        </div>
        <button class="btn primary" id="toTicket" style="width:100%;justify-content:center;padding:12px">マイ申込を見る</button>
        <details class="reveal"><summary>別の端末で確認する</summary>
          <div class="copybox"><input readonly value="${Util.esc(url)}">
            <button class="btn" id="copyUrl">コピー</button></div>
        </details>
      </div>`;
    el.querySelector("#toTicket").onclick = () => App.go("myticket");
    el.querySelector("#copyUrl").onclick = async () =>
      FB.toast(await Util.copy(url) ? "URLをコピーしました" : "コピーできませんでした");
  }

  /* ---- マイ申込 S-9（F-56, F-57, F-89, F-90）----
     **一覧はログインが必要（F-107）。個別の1件はトークンが認可なのでログイン不要**（4-6）。
     この2本立てを崩さないこと:
     - 確認URL（`?ticket=`）はメールで受け取った人が開く経路で、その人はパスワードを持たない。
       ここでログインを求めると F-20 が成立しなくなる。トークンを知っていること自体が認可（4-6）。
     - 一覧は「その人の申込を全部見せる」ので、本人であることの確認が要る。
     一覧の出どころも変わった: **以前は savedTokens（この端末の控え）**を読んでいたため、
     同じブラウザを使った別人の申込まで並んでいた。ログイン後は personId で引く。 */
  let selectedToken = null;

  async function renderMyTicket(el) {
    if (selectedToken) return renderTicketDetail(el, selectedToken);
    const me = Auth.person();
    if (!me) return renderLogin(el);
    return renderMyList(el, me);
  }

  function renderLogin(el, err, email = "") {
    el.innerHTML = `
      <div class="page-head"><h2>マイ申込</h2></div>
      <div class="lock">
        <div class="lk-icon">🔑</div>
        <h3>ログインしてください</h3>
        <div class="lk-form col">
          <input id="lgEmail" type="email" placeholder="メールアドレス"
                 value="${Util.esc(email)}" autocomplete="username">
          <input id="lgPw" type="password" placeholder="パスワード" autocomplete="current-password">
          <button class="btn primary" id="lgGo">ログイン</button>
        </div>
        ${err ? `<div class="lk-err">${Util.esc(err)}</div>` : ""}
      </div>`;
    const go = () => {
      const em = el.querySelector("#lgEmail").value;
      const pw = el.querySelector("#lgPw").value;
      Auth.login(em, pw)
        .then(p => { FB.toast(`${p.name} さんとしてログインしました`); renderMyTicket(el); })
        .catch(e => renderLogin(el, e.message, em));   // 入力したメールは残す
    };
    el.querySelector("#lgGo").onclick = go;
    // Enter で送信できるようにする（パスワード欄で改行して詰まるのを避ける）
    el.querySelectorAll("#lgEmail,#lgPw").forEach(i =>
      i.onkeydown = (e) => { if (e.key === "Enter") go(); });
    el.querySelector("#lgEmail").focus();
  }

  async function renderMyList(el, me) {
    // ログイン中の本人の申込を personId で引く（索引あり）。端末の控えには依存しない
    const apps = await Repo.applications.byPerson(me.id);
    const items = [];
    for (const app of apps) {
      const ev = await Repo.events.get(app.eventId);
      if (!ev) continue;
      items.push({ token:app.token, app, ev });
    }
    const head = `<div class="page-head"><h2>マイ申込</h2>
      <span class="sub">${Util.esc(me.name)} さん</span>
      <span class="toggles"><button id="lgOut">ログアウト</button></span></div>`;
    const wire = () => { el.querySelector("#lgOut").onclick = () => {
      Auth.logout(); FB.toast("ログアウトしました"); renderMyTicket(el); }; };

    if (!items.length) {
      el.innerHTML = head + `<div class="empty"><div class="big">申込はありません</div>
        イベントに申込むと、ここに一覧が出ます。</div>`;
      wire(); return;
    }
    // 並び: これから開催 → 終了済み → キャンセル済み（F-89）
    const now = Date.now();
    const rank = (it) => it.app.status === "cancelled" ? 2
      : (it.ev.endAt && new Date(it.ev.endAt).getTime() < now) ? 1 : 0;
    items.sort((a,b) => rank(a) - rank(b) || new Date(a.ev.startAt||0) - new Date(b.ev.startAt||0));

    const label = { applied:"申込済", checkedin:"チェックイン済", cancelled:"キャンセル済" };
    const cls = { applied:"phase", checkedin:"published", cancelled:"draft" };
    el.innerHTML = head +
      items.map(it => `
        <div class="card pcard ticket-item" data-token="${it.token}">
          ${coverBand(it.ev, "sm")}
          <div class="pb">
            <div class="pt">${Util.esc(it.ev.title)}</div>
            <div class="pm">${Util.fmtRange(it.ev.startAt, it.ev.endAt)}</div>
            <div class="pr"><span class="badge ${cls[it.app.status]}">${label[it.app.status]}</span></div>
          </div>
        </div>`).join("");
    wire();
    el.querySelectorAll(".ticket-item").forEach(c =>
      c.onclick = () => { selectedToken = c.dataset.token; renderMyTicket(el); });
  }

  async function renderTicketDetail(el, token) {
    const app = await Repo.applications.byToken(token);
    const ev = app ? await Repo.events.get(app.eventId) : null;
    if (!app || !ev) { selectedToken = null; return renderMyTicket(el); }
    const cancelled = app.status === "cancelled";
    const notices = Ops.noticesOf(await Repo.messages.byEvent(ev.id));
    const label = { applied:"申込済", checkedin:"チェックイン済", cancelled:"キャンセル済" };
    const mapLink = ev.venueAddress
      ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.venueAddress)}" target="_blank" rel="noopener">地図を開く</a>` : "";
    el.innerHTML = `
      <div class="page-head"><button class="btn ghost" id="back">← マイ申込</button></div>
      <div class="card pad">
        <h2 style="font-size:18px">${Util.esc(ev.title)}</h2>
        ${cancelled ? `<div class="banner" style="position:static;border-radius:8px;margin:12px 0">
          この申込はキャンセルされました（F-43）</div>` : ""}
        ${ev.status === "cancelled" ? `<div class="banner" style="position:static;border-radius:8px;margin:12px 0">
          このイベントは中止されました</div>` : ""}
        ${noticeBlock(notices)}
        ${onlineBlock(ev, cancelled)}
        <div class="summary" style="margin:14px 0">
          <div class="row"><span class="k">開催日時</span><span>${Util.fmtRange(ev.startAt, ev.endAt)}</span></div>
          <div class="row"><span class="k">開催形式</span><span>${Domain.FORMAT[ev.eventFormat||"onsite"]}</span></div>
          <div class="row"><span class="k">会場</span><span>${Util.esc(ev.venueName)||"—"} ${mapLink}</span></div>
          <div class="row"><span class="k">問い合わせ</span><span>${Util.esc(ev.contactInfo)||"—"}</span></div>
          <div class="row"><span class="k">申込状態</span><span><span class="badge ${cancelled?'draft':'phase'}">${label[app.status]}</span></span></div>
          <div class="row"><span class="k">申込日時</span><span>${Util.fmtDateTime(app.appliedAt)}</span></div>
          ${(ev.questions||[]).map(q => {
            const v = (app.answers||{})[q.id];
            const shown = q.type === "checkbox" ? (v ? "はい" : "いいえ") : (v || "—");
            return `<div class="row"><span class="k">${Util.esc(q.label)}</span><span>${Util.esc(shown)}</span></div>`;
          }).join("")}
        </div>
        ${cancelled ? "" : qrBlock(app)}
        <div class="row-actions">
          <a class="btn" id="toPublic">公開ページを開く</a>
          ${cancelled ? "" : '<button class="btn" id="cancelBtn" style="color:var(--danger)">申込をキャンセル</button>'}
        </div>
      </div>
      `;
    el.querySelector("#back").onclick = () => { selectedToken = null; renderMyTicket(el); };
    el.querySelector("#toPublic").onclick = () => App.openPublic(ev.id);
    wireQr(el);
    const cb = el.querySelector("#cancelBtn");
    if (cb) cb.onclick = () => FB.confirmModal({
      title:"申込をキャンセルしますか？", okLabel:"キャンセルする", danger:true,
      body:"キャンセルすると席が空きます。同じイベントへの再申込はできます（F-42）。",
      onOk: async () => {
        // 主催者側と同じ処理を呼ぶ（F-25）
        try { await AppSvc.cancel(app.id); FB.toast("申込をキャンセルしました"); await renderMyTicket(el); }
        catch (e) { FB.error(e.message); }
      } });
  }
  function resetMyTicket() { selectedToken = null; }

  const selectTicket = (token) => { selectedToken = token; };   // 確認URLからの復帰用（F-97）

  return { renderList, renderPublic, renderApply, renderComplete, renderMyTicket,
           resetMyTicket, selectTicket };
})();


// ===== [11b] 参加者のログイン（マイ申込の保護 / F-107） =====
/* **これは既存のトークン認可（4-6）を置き換えるものではなく、一覧を出すために足したもの。**
   確認URL（`?ticket=`）で1件を開く経路はトークンだけで通る。一覧は本人の申込を全部見せる
   ので、本人であることの確認を挟む。

   限界を正しく書いておく: サーバが無いのでパスワードは IndexedDB に平文で入り、
   DevTools から読める。**秘匿ではなく操作の抑止**で、F-101 の参加者名簿と同じ位置づけ。
   ハッシュ化しても、照合するコードごと手元にあるので強度は変わらない（書き換えれば通る）。
   だから偽の安心を与えないよう、ログイン画面にこの旨を明記している。 */
const Auth = (() => {
  /* ログイン中の参加者。**セッション内のみ保持し、保存しない。**
     再読込でログアウトする。「ログイン中かどうか」を持たせないので、状態の
     不整合が構造的に起きない（時期を保存しないのと同じ考え方 / 4-3）。 */
  let current = null;

  // 名寄せキーと同じ正規化。trim と小文字化のみ（それ以上は別人の誤統合を招く / 4-5）
  const keyOf = (email) => String(email ?? "").trim().toLowerCase();

  async function login(email, password) {
    const p = await Repo.persons.byEmailKey(keyOf(email));
    /* 「登録が無い」と「パスワードが違う」を文言で区別しない。
       どのメールアドレスが登録済みかを画面から確かめられないようにするため。 */
    if (!p || !p.password || p.password !== String(password ?? ""))
      throw new Error("メールアドレスまたはパスワードが違います");
    current = p;
    return p;
  }
  const logout = () => { current = null; };
  const person = () => current;

  return { login, logout, person };
})();


// ===== [12] 汎用ヘルパ =====

function groupBy(arr, key) {
  const m = {};
  for (const x of arr) (m[x[key]] ||= []).push(x);
  return m;
}

/* カバー画像（F-03）。IndexedDB から取り出した Blob を objectURL にして表示する。
   URL は画面が差し替わるまで保持する必要があるため、直後には revoke しない。 */
const _coverUrls = [];
function coverUrl(ev) {
  if (!ev.coverImage) return null;
  try {
    const url = URL.createObjectURL(ev.coverImage);
    _coverUrls.push(url);
    // 一覧では1画面に何枚も出るので、上限は多めに取る（超えたぶんから解放する）
    if (_coverUrls.length > 60) URL.revokeObjectURL(_coverUrls.shift());
    return url;
  } catch { return null; }
}
function coverHtml(ev) {
  const url = coverUrl(ev);
  if (!ev.coverImage) return `<div class="cover">カバー画像（未設定）</div>`;
  if (!url) return `<div class="cover">カバー画像（表示できません）</div>`;
  return `<img class="cover" src="${url}" alt="${Util.esc(ev.title)}">`;
}
/* 一覧に出す帯状のカバー（F-03b）。参加者側の一覧が文字だけで寂しかったため。
   未設定・取り出せない場合は同じ大きさの下地を出す（高さが変わって並びが崩れないように）。 */
function coverBand(ev, cls = "") {
  const url = coverUrl(ev);
  return url ? `<img class="ph ${cls}" src="${url}" alt="">` : `<div class="ph none ${cls}"></div>`;
}


// ===== [12b] 主催者：イベント作成・編集ウィザード S-3（5ステップ / F-69〜F-74） =====
const Wizard = (() => {
  const STEPS = [
    { key:"basic",   label:"1. 基本情報" },
    { key:"venue",   label:"2. 会場" },
    { key:"detail",  label:"3. 詳細" },
    { key:"apply",   label:"4. 申込" },
    { key:"setting", label:"5. 設定" },
  ];
  let form = null, step = 0, isEdit = false, el = null;
  let coverFile = null;   // 新たに選択されたカバー画像（File は Blob なのでそのまま保存できる）
  let coverKeep = null;   // 編集時に保持する既存の Blob
  let wasPublic = false;  // 編集開始時点で一般公開だったか（F-66 の判定用）
  let questions = [];     // 申込フォームのカスタム質問（F-91）

  const isoToLocalInput = (iso) => {
    if (!iso) return "";
    const d = new Date(iso), p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  async function render(host, eventId) {
    el = host; step = 0;
    isEdit = !!eventId;
    coverFile = null; coverKeep = null; wasPublic = false;
    if (isEdit) {
      const ev = await Repo.events.get(eventId);
      coverKeep = ev.coverImage || null;
      wasPublic = ev.status !== "draft" && ev.visibility === "public";
      form = { id:ev.id, title:ev.title||"", startAt:isoToLocalInput(ev.startAt), endAt:isoToLocalInput(ev.endAt),
        venueName:ev.venueName||"", venueAddress:ev.venueAddress||"", description:ev.description||"",
        targetAudience:ev.targetAudience||"",
        capacity:ev.capacity||"", applyStartAt:ev.applyStartAt||"", applyDeadline:ev.applyDeadline||"",
        visibility:ev.visibility||"public", contactInfo:ev.contactInfo||"",
        eventFormat:ev.eventFormat||"onsite", onlineUrl:ev.onlineUrl||"", onlineNote:ev.onlineNote||"",
        status:ev.status };
      questions = (ev.questions || []).map(q => ({ ...q, options:[...(q.options||[])] }));
    } else {
      form = { id:null, title:"", startAt:"", endAt:"", venueName:"", venueAddress:"", description:"",
        targetAudience:"", capacity:"", applyStartAt:"", applyDeadline:"",
        visibility:"public", contactInfo:"",
        eventFormat:"onsite", onlineUrl:"", onlineNote:"", status:"draft" };
      questions = [];
    }
    paint();
  }

  function collect() { // 現在ステップの入力を form に退避（戻る操作でも保持 / F-72）
    el.querySelectorAll("[data-f]").forEach(inp => {
      if (inp.dataset.f === "__cover") {           // ファイルは File のまま保持する
        if (inp.files && inp.files[0]) coverFile = inp.files[0];
        return;
      }
      form[inp.dataset.f] = inp.type === "checkbox" ? inp.checked : inp.value;
    });
    collectQuestions();
  }

  const toIso = (local) => local ? new Date(local).toISOString() : null;

  // form からイベントレコードを組み立てる。IndexedDB の書き込み前にすべて揃えておく（7-1）
  async function buildRecord(status) {
    const now = new Date().toISOString();
    const prev = form.id ? await Repo.events.get(form.id) : null;
    return {
      id: form.id || Util.uid(),
      title: form.title.trim(),
      description: form.description.trim(),
      targetAudience: form.targetAudience.trim(),
      startAt: toIso(form.startAt), endAt: toIso(form.endAt),
      venueName: form.venueName.trim(), venueAddress: form.venueAddress.trim(),
      contactInfo: form.contactInfo.trim(),
      coverImage: coverFile || coverKeep || null,     // File は Blob。そのまま保存できる
      capacity: form.capacity ? +form.capacity : null,
      applyStartAt: form.applyStartAt || null,
      applyDeadline: form.applyDeadline || null,
      eventFormat: form.eventFormat || "onsite",
      onlineUrl: (form.onlineUrl || "").trim() || null,
      onlineNote: (form.onlineNote || "").trim() || null,
      questions: questions.filter(q => q.label.trim()),   // ラベル未入力の行は捨てる（F-91）
      status,
      visibility: form.visibility,
      groupId: prev?.groupId ?? null,
      copiedFromId: prev?.copiedFromId ?? null,
      createdAt: prev?.createdAt || now,
      updatedAt: now,
    };
  }

  // 保存（F-01, F-70, F-72）。status は呼び出し側が決める（遷移は一方向 / F-37）
  async function persist(status) {
    const rec = await buildRecord(status);
    // F-41: 定員は有効な申込数を下回れない
    if (rec.capacity != null && form.id) {
      const apps = await Repo.applications.byEvent(form.id);
      const used = Domain.usedSeats(apps);
      if (rec.capacity < used) {
        FB.error(`定員を${rec.capacity}人にはできません。すでに${used}件の有効な申込があります（F-41）`);
        return null;
      }
    }
    await Repo.events.put(rec);
    form.id = rec.id; form.status = rec.status;
    coverKeep = rec.coverImage; coverFile = null;
    return rec;
  }

  function paint() {
    const stepsHtml = STEPS.map((s,i) => {
      const cls = i===step ? "on" : (isEdit || i<step) ? "done clickable" : "";
      return `<div class="step ${cls}" data-step="${i}">${s.label}</div>`;
    }).join("");
    el.innerHTML = `
      <div class="page-head"><button class="btn ghost" id="back">← 一覧へ</button>
        <h2>${isEdit ? "イベントを編集" : "イベントを作成"}</h2></div>
      <div class="steps">${stepsHtml}</div>
      <div class="card pad" id="stepBody">${stepBody()}</div>
      <div class="wizard-actions">
        <button class="btn" id="prev" ${step===0?'style="visibility:hidden"':''}>← 戻る</button>
        <div class="row-actions">${footerRight()}</div>
      </div>`;

    el.querySelector("#back").onclick = () => { collect(); App.go("events"); };
    el.querySelector("#prev").onclick = () => { collect(); if (step>0) { step--; paint(); } };
    // ステップ見出しでの直接移動（編集時は任意、新規は完了済みのみ / F-73）
    el.querySelectorAll(".step.clickable").forEach(s =>
      s.onclick = () => { collect(); step = +s.dataset.step; paint(); });
    // 開催形式を変えると視聴URL欄の出し入れが必要になるので、その場で描き直す（F-93）
    const fmt = el.querySelector('[data-f="eventFormat"]');
    if (fmt) fmt.onchange = () => { collect(); paint(); };
    wireQuestions();
    wireFooter();
  }

  function footerRight() {
    if (step < STEPS.length - 1)
      return `<button class="btn primary" id="next">保存して次へ →</button>`;
    // 公開済み・中止済みは下書きへ戻せないので保存のみ（F-37）
    if (form.status !== "draft")
      return `<button class="btn primary" id="saveOnly">変更を保存</button>`;
    return `<button class="btn" id="check">公開前チェック</button>
            <button class="btn" id="saveDraft">下書き保存</button>
            <button class="btn primary" id="publish">公開する</button>`;
  }

  function wireFooter() {
    const next = el.querySelector("#next");
    if (next) next.onclick = async () => {
      collect();
      if (step === 0 && !form.title.trim()) { // ステップ1はイベント名必須（F-70）
        showErr("title", "イベント名を入力してください");
        return;
      }
      if (!guardVisibility()) return;
      // ステップ1を保存した時点で下書きを新規作成する（F-70）。以降も都度保存するため、
      // 離脱しても保存済みのステップまでが下書きとして残る（F-72）
      try {
        const first = !form.id;
        if (!await persist(form.status)) return;
        FB.toast(first ? "下書きを作成しました" : "保存しました");
      } catch (e) { FB.error("保存に失敗: " + e.message); return; }
      step++; paint();
    };
    const check = el.querySelector("#check");
    if (check) check.onclick = () => { collect(); runPublishCheck(); };

    const saveOnly = el.querySelector("#saveOnly");
    if (saveOnly) saveOnly.onclick = async () => {
      collect();
      if (!guardVisibility()) return;
      try {
        if (await persist(form.status)) { FB.toast("変更を保存しました"); App.openEvent(form.id); }
      } catch (e) { FB.error("保存に失敗: " + e.message); }
    };

    const sd = el.querySelector("#saveDraft");
    if (sd) sd.onclick = async () => {
      collect();
      try {
        if (await persist("draft")) { FB.toast("下書きを保存しました"); App.go("events"); }
      } catch (e) { FB.error("保存に失敗: " + e.message); }
    };

    const pub = el.querySelector("#publish");
    if (pub) pub.onclick = () => {
      collect();
      const issues = publishIssues();
      if (issues.length) { runPublishCheck(); return; } // 不備があれば公開させない（F-06）
      FB.confirmModal({ title:"イベントを公開しますか？", okLabel:"公開する",
        body:"公開すると下書きには戻せません。この操作は取り消せません。",
        onOk: async () => {
          try {
            if (await persist("published")) { FB.toast("公開しました"); App.openEvent(form.id); }
          } catch (e) { FB.error("公開に失敗: " + e.message); }
        } });
    };
  }

  // 一般公開 → 限定公開へは戻せない（F-66）。下書きのうちは自由に変更できる
  function guardVisibility() {
    if (form.status === "draft") return true;
    if (form.visibility === "limited" && wasPublic) {
      FB.error("一般公開から限定公開へは戻せません（F-66）");
      form.visibility = "public";
      return false;
    }
    return true;
  }

  /* 申込フォームのカスタム質問（F-91）。氏名・カナ・メールは固定で、その先を主催者が定義する。
     所属区分・所属先の名称・参加方法・知ったきっかけなどを聞くことになる。
     所属は会社に限らないので、区分は「会社／学校／なし」で聞く（F-91b）。 */
  const Q_TYPES = { text:"一行", textarea:"複数行", select:"選択肢", checkbox:"チェック" };
  function questionEditor() {
    return `<div class="qedit">
      <div class="qh">申込フォームの追加質問</div>
      ${questions.length ? questions.map((q, i) => `
        <div class="qrow" data-qi="${i}">
          <input class="ql" data-qf="label" value="${Util.esc(q.label)}" placeholder="質問文（例: 所属部署）">
          <select class="qt" data-qf="type">${Object.entries(Q_TYPES).map(([k,v]) =>
            `<option value="${k}" ${q.type===k?"selected":""}>${v}</option>`).join("")}</select>
          <input class="qo" data-qf="options" value="${Util.esc((q.options||[]).join(","))}"
            placeholder="選択肢（カンマ区切り）" ${q.type==="select"?"":"disabled"}>
          <label class="qr"><input type="checkbox" data-qf="required" ${q.required?"checked":""}>必須</label>
          <button type="button" class="btn sm" data-qdel="${i}" style="color:var(--danger)">削除</button>
        </div>`).join("")
        : `<div class="hint">追加の質問はありません。</div>`}
      <button type="button" class="btn sm" id="qAdd" style="margin-top:10px">＋ 質問を追加</button>
    </div>`;
  }

  // 質問エディタの入力を questions に取り込む（collect と同じタイミングで呼ぶ）
  function collectQuestions() {
    const rows = el.querySelectorAll(".qrow");
    if (!rows.length) return;
    questions = [...rows].map((row, i) => {
      const g = (f) => row.querySelector(`[data-qf="${f}"]`);
      const type = g("type").value;
      return {
        id: questions[i]?.id || Util.uid(),
        label: g("label").value,
        type,
        required: g("required").checked,
        options: type === "select"
          ? g("options").value.split(",").map(s => s.trim()).filter(Boolean) : [],
      };
    });
  }

  function wireQuestions() {
    const add = el.querySelector("#qAdd");
    if (!add) return;
    add.onclick = () => {
      collect();
      questions.push({ id:Util.uid(), label:"", type:"text", required:false, options:[] });
      paint();
    };
    el.querySelectorAll("[data-qdel]").forEach(b => b.onclick = () => {
      collect();
      questions.splice(+b.dataset.qdel, 1);
      paint();
    });
    // 種別を選択肢に変えたら選択肢欄を使えるようにする
    el.querySelectorAll('.qrow [data-qf="type"]').forEach(s => s.onchange = () => { collect(); paint(); });
  }

  function showErr(field, msg) {
    const inp = el.querySelector(`[data-f="${field}"]`);
    if (!inp) return;
    inp.classList.add("invalid");
    let e = inp.parentElement.querySelector(".err");
    if (!e) { e = document.createElement("div"); e.className = "err"; inp.parentElement.appendChild(e); }
    e.textContent = msg;
    inp.focus(); // 最初のエラー項目へフォーカス（F-84）
  }

  // 公開前チェック（F-06 / F-50）— 読み取り専用ロジックなので実データで動作
  function publishIssues() {
    const f = form, issues = [];
    if (!f.title.trim()) issues.push("イベント名が未入力です");
    if (!f.description.trim()) issues.push("説明が未入力です");
    if (!f.startAt) issues.push("開始日時が未設定です");
    if (!f.endAt) issues.push("終了日時が未設定です");
    if (!f.venueName.trim()) issues.push("会場名が未入力です");
    if (!f.capacity || +f.capacity < 1) issues.push("定員が未設定です");
    if (f.capacity && +f.capacity > 9999) issues.push("定員は9999以下にしてください（F-55）");
    if (!f.applyDeadline) issues.push("申込締切が未設定です");
    if (f.applyStartAt && f.applyDeadline && f.applyStartAt > f.applyDeadline)
      issues.push("受付開始が申込締切より後です");
    if (f.applyStartAt && f.startAt &&
        Util.dayStart(f.applyStartAt) > new Date(f.startAt).getTime())
      issues.push("受付開始が開催日より後です");
    // 文字数上限（F-54）
    const lim = [["title","イベント名",100],["description","説明",2000],
      ["targetAudience","対象者",200],["venueName","会場名",100],
      ["venueAddress","住所",200],["contactInfo","問い合わせ先",200]];
    for (const [k, label, max] of lim)
      if ((f[k] || "").length > max) issues.push(`${label}は${max}文字以内にしてください（F-54）`);
    if (f.startAt && f.endAt && new Date(f.endAt) < new Date(f.startAt))
      issues.push("終了日時が開始日時より前です");
    if (f.applyDeadline && f.startAt &&
        Util.deadlineEnd(f.applyDeadline) > new Date(f.startAt).getTime())
      issues.push("申込締切が開催日より後です");
    if (f.startAt && new Date(f.startAt).getTime() < Date.now())
      issues.push("開催日が過去の日時です");
    // 社外の方は社内の連絡経路を使えないため、問い合わせ先は常に必須（F-98）
    if (!f.contactInfo.trim())
      issues.push("問い合わせ先が未入力です（社外の方の唯一の連絡手段になります / F-98）");
    return issues;
  }
  function runPublishCheck() {
    const issues = publishIssues();
    if (!issues.length) FB.toast("公開前チェック：不備はありません ✅");
    else FB.error("公開できません: " + issues.join(" / "));
  }

  function stepBody() {
    const f = form;
    const T = (field, label, opts={}) => `
      <div class="field"><label>${label}${opts.req?'<span class="req">必須</span>':''}</label>
      <input type="${opts.type||'text'}" data-f="${field}" value="${Util.esc(f[field])}"
        ${opts.ph?`placeholder="${Util.esc(opts.ph)}"`:''}>
      ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</div>`;
    const A = (field, label, opts={}) => `
      <div class="field"><label>${label}</label>
      <textarea data-f="${field}" ${opts.ph?`placeholder="${Util.esc(opts.ph)}"`:''}>${Util.esc(f[field])}</textarea>
      ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</div>`;

    switch (STEPS[step].key) {
      case "basic": return `
        ${T("title","イベント名",{req:true,ph:"社内技術LT大会 2026夏"})}
        <div class="form-2col">
          ${T("startAt","開始日時",{type:"datetime-local"})}
          ${T("endAt","終了日時",{type:"datetime-local"})}
        </div>`;
      case "venue": return `
        <div class="field"><label>開催形式</label>
          <select data-f="eventFormat">
            ${Object.entries(Domain.FORMAT).map(([k,v]) =>
              `<option value="${k}" ${f.eventFormat===k?"selected":""}>${v}</option>`).join("")}
          </select>
          <div class="hint">オンライン・ハイブリッドの視聴URLは<b>申込者のマイ申込にだけ</b>表示されます</div></div>
        ${T("venueName","会場名",{ph:"本社 大会議室"})}
        ${T("venueAddress","住所",{ph:"東京都千代田区1-1-1",hint:"入力すると公開ページに地図リンクを表示します"})}
        ${f.eventFormat && f.eventFormat !== "onsite" ? `
          ${T("onlineUrl","視聴URL",{ph:"https://teams.microsoft.com/...",hint:"申込者のみに表示されます"})}
          ${A("onlineNote","参加方法の補足",{ph:"開始10分前から入室できます"})}` : ""}`;
      case "detail": return `
        ${A("description","説明",{ph:"イベントの概要を入力"})}
        ${T("targetAudience","対象者",{ph:"社員全般"})}
        <div class="field"><label>カバー画像</label>
          <input type="file" accept="image/*" data-f="__cover">
          <div class="hint">任意。${
            coverFile ? `選択中: ${Util.esc(coverFile.name)}` : coverKeep ? "現在: 設定済み（変更しなければ保持されます）" : ""}</div></div>`;
      case "apply": return `
        ${T("capacity","定員",{type:"number",hint:"1〜9999"})}
        <div class="form-2col">
          ${T("applyStartAt","受付開始",{type:"date",hint:"任意。未設定なら公開と同時に受付開始"})}
          ${T("applyDeadline","申込締切",{type:"date",hint:"締切日の23:59まで受付"})}
        </div>
        ${questionEditor()}`;
      case "setting": return `
        <div class="field"><label>公開範囲</label>
          <select data-f="visibility">
            <option value="public" ${f.visibility==="public"?"selected":""}>一般公開</option>
            <option value="limited" ${f.visibility==="limited"?"selected":""}>限定公開（URLを知る人のみ）</option>
          </select>
          <div class="hint">限定公開→一般公開は変更可（逆は不可）</div></div>
        ${A("contactInfo","問い合わせ先",{ph:"◯◯事務局 event@example.com（平日9:00〜17:00）",hint:"<b>必須</b>・200文字以内"})}`;
    }
    return "";
  }
  return { render };
})();


// ===== [13] アプリシェル（ヘッダー・タブ・役割切替・ルータ） =====
const App = (() => {
  // route: {view:'organizer'|'participant', page, param}
  let route = { view:"organizer", page:"dashboard", param:null };
  let completeData = null; // S-8 へ渡す申込内容（トランジェント）

  /* 主催者は5タブ、参加者は3タブ（通知 S-11 を追加 / F-108。4-1 を改訂）。
     参加者名簿はイベント横断なので、イベントタブ配下には置けない。 */
  const ORG_TABS  = [["dashboard","ダッシュボード"],["events","イベント"],["notify","通知"],
                     ["roster","参加者"],["settings","設定"]];
  const PART_TABS = [["list","イベントを探す"],["myticket","マイ申込"],["notify","通知"]];

  function renderTabs() {
    const host = document.getElementById("tabs");
    const tabs = route.view === "organizer" ? ORG_TABS : PART_TABS;
    const active = route.view === "organizer" ? orgActive : partActive;
    host.innerHTML = tabs.map(([k,label]) =>
      `<button data-page="${k}" class="${active(k)?'on':''}">${label}</button>`).join("");
    // タブから開いたときは一覧へ戻す。確認URLからの復帰（openTicket）では選択を保持する
    host.querySelectorAll("button").forEach(b => b.onclick = () => {
      if (b.dataset.page === "myticket") Participant.resetMyTicket();
      go(b.dataset.page);
    });
    refreshBadge();
  }

  /* 通知タブの未読バッジ（F-108）。件数の算出は非同期なので、タブを描いた後から差し込む
     （S-4 の未読バッジと同じやり方 / 9-2）。**バッジ要素だけを入れ替え、タブは描き直さない。** */
  async function refreshBadge() {
    const host = document.getElementById("tabs");
    const btn = host && host.querySelector('[data-page="notify"]');
    if (!btn) return;
    let n = 0;
    try {
      const me = route.view === "organizer" ? null : Auth.person();
      if (route.view === "organizer" || me) n = await Notify.unreadCount(route.view, me && me.id);
    } catch { n = 0; }
    const old = btn.querySelector(".tabdot");
    if (old) old.remove();
    if (n) btn.insertAdjacentHTML("beforeend", `<span class="tabdot">${n > 99 ? "99+" : n}</span>`);
  }
  const orgActive = (k) =>
    route.page === k ||
    (k==="events" && (route.page==="eventDetail" || route.page==="create"));
  const partActive = (k) => k==="myticket" ? route.page==="myticket"
    : k==="notify" ? route.page==="notify"
    : ["list","public","apply","complete"].includes(route.page);

  /* 描画の直列化と世代管理。
     `renderContent` は非同期なので、**要求が重なると遅い方が後から上書きしていた**
     （`setView` の直後に `go()` を呼ぶと、先に始めた画面が後から勝つ。確認作業で実際に踏んだ）。
     やっていることは2つだけ:
       ① 直前の描画が終わるまで次を始めない（同時に走らせない）
       ② 順番が来た時点でより新しい要求があれば、自分の描画は捨てる
     結果、**最後の要求だけが画面に残る**。捨てられる描画は DOM に触らないので、
     追い越された画面が一瞬映ることもない。
     **描画関数側には手を入れていない**——各画面が `el` に直接書く作りは変えず、
     入口だけで順序を保証している。 */
  let renderSeq = 0;
  let painting = Promise.resolve();

  function renderContent() {
    const seq = ++renderSeq;
    // paint は内部で例外を捕まえるが、鎖が切れないよう失敗側も繋いでおく
    painting = painting.then(() => paint(seq), () => paint(seq));
    return painting;
  }

  async function paint(seq) {
    if (seq !== renderSeq) return;        // より新しい要求に追い越された
    const el = document.getElementById("content");
    el.innerHTML = `<div class="empty">読み込み中…</div>`;
    try {
      if (route.view === "organizer") {
        if (route.page === "dashboard") await Dashboard.render(el);
        else if (route.page === "events") await EventsList.render(el);
        else if (route.page === "eventDetail") await EventDetail.render(el, route.param, route.tab);
        else if (route.page === "notify") await Notify.render(el);
        else if (route.page === "roster") await Roster.render(el);
        else if (route.page === "settings") await Settings.render(el);
        else if (route.page === "create") await Wizard.render(el, route.param);
      } else {
        if (route.page === "notify") await Notify.render(el);
        else if (route.page === "public") await Participant.renderPublic(el, route.param);
        else if (route.page === "apply") await Participant.renderApply(el, route.param);
        else if (route.page === "complete") await Participant.renderComplete(el, route.param, completeData);
        else if (route.page === "myticket") await Participant.renderMyTicket(el);
        else await Participant.renderList(el);
      }
    } catch (e) {
      console.error(e);
      FB.error("画面の描画に失敗しました: " + e.message);
      el.innerHTML = `<div class="empty"><div class="big">読み込みに失敗しました</div>${Util.esc(e.message)}</div>`;
    }
  }

  // 公開API（各モジュールから遷移に使う）
  function go(page, param=null) { route = { ...route, page, param, tab:null }; render(); }
  // tab を渡すと詳細のサブタブを指定して開ける（通知から該当タブへ飛ぶため / F-108）
  function openEvent(id, tab=null) { route = { view:"organizer", page:"eventDetail", param:id, tab }; render(); }
  function openCreate(id=null) { route = { view:"organizer", page:"create", param:id }; render(); }
  function openPublic(id) { route = { view:"participant", page:"public", param:id }; render(); }
  function openApply(id) { route = { view:"participant", page:"apply", param:id }; render(); }
  function openComplete(id, data) { completeData = data; route = { view:"participant", page:"complete", param:id }; render(); }
  function openTicket(token) {
    Participant.selectTicket(token);
    route = { view:"participant", page:"myticket", param:null };
    render();
  }

  /* 見え方（body の属性・役割ボタン・viewport）を route.view に合わせる。
     **viewport の差し替えが要点**: 主催者側は PC幅のみなので 1024px 固定のまま（F-81）、
     参加者側は実機の幅で描く（F-81b）。

     **render() から必ず呼ぶので、route.view を変えれば見え方も追従する。**
     以前は setView / openTicket / routeFromUrl が各自で body の属性を書いていて、
     **`openPublic` など route だけ差し替える経路では属性が変わっていなかった**
     （下書きプレビュー F-07 が主催者の見え方のまま描かれていた）。
     ここを迂回して body.dataset.view を直接書かないこと。guard.js が代入箇所の数を見ている。 */
  const VIEWPORT = { organizer:"width=1024",
                     participant:"width=device-width, initial-scale=1" };
  function applyView(view) {
    document.body.dataset.view = view;
    const vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.setAttribute("content", VIEWPORT[view] || VIEWPORT.organizer);
    document.querySelectorAll("#roleSwitch button").forEach(b =>
      b.classList.toggle("on", b.dataset.role === view));
  }
  // データ変更後に現在ページを再描画する。**通知の未読バッジも数え直す**——
  // シード投入や初期化のあとバッジが古い件数のまま残るため（F-108）
  function refresh() { renderContent(); refreshBadge(); }
  function setView(view) {
    // 参加者ビューへ切り替えたら名簿は再ロックする（主催者席を離れる想定 / F-101）
    if (view !== "organizer") Roster.lock();
    // 主催者ビューへ戻ったら参加者はログアウトする（同じ端末を続けて使う想定 / F-107）
    else Auth.logout();
    route = view === "organizer"
      ? { view, page:"dashboard", param:null }
      : { view, page:"list", param:null };
    render();
  }

  function render() { applyView(route.view); renderTabs(); renderContent(); }

  function wire() {
    document.querySelectorAll("#roleSwitch button").forEach(b =>
      b.onclick = () => setView(b.dataset.role));
  }

  /* URL からの復帰（F-97 / F-65）。
     ?ticket=<token> → その申込の詳細（別端末では復帰できないが、同じ端末なら開ける）
     ?event=<id>     → 公開ページ。限定公開はこの経路でのみ閲覧できる
     ?preview=<id>   → 下書きの参加者ビュー確認（F-07）
     いずれも参加者ビューに切り替える。処理後は URL を元に戻し、再読込で再発火させない。 */
  async function routeFromUrl() {
    const q = new URLSearchParams(location.search);
    const ticket = q.get("ticket"), eventId = q.get("event"), preview = q.get("preview");
    if (!ticket && !eventId && !preview) return false;
    history.replaceState(null, "", location.pathname);

    if (ticket) {
      const app = await Repo.applications.byToken(ticket);
      if (!app) { FB.error("この確認URLに対応する申込が見つかりません"); return false; }
      // 同じ端末で開いた場合に備え、未保存なら控えを保存しておく（F-56）
      if (!await Repo.savedTokens.get(ticket))
        await Repo.savedTokens.put({ token:ticket, eventId:app.eventId, savedAt:new Date().toISOString() });
      openTicket(ticket);
      return true;
    }
    const id = eventId || preview;
    const ev = await Repo.events.get(id);
    if (!ev) { FB.error("イベントが見つかりません"); return false; }
    if (preview) previewId = id;         // 下書きでも参加者ビューで見えるようにする（F-07）
    route = { view:"participant", page:"public", param:id };
    render();
    return true;
  }
  let previewId = null;
  const isPreview = (id) => previewId === id;   // 下書きプレビュー中か（F-07）
  function openPreview(id) { previewId = id; openPublic(id); }

  const currentView = () => route.view;
  return { go, openEvent, openCreate, openPublic, openApply, openComplete, openTicket,
           currentView, refreshBadge,
           openPreview, isPreview, routeFromUrl, refresh, setView, wire, render };
})();


// ===== [14] 起動 =====
(async function boot() {
  try {
    App.wire();
    await DB.open();
    // 初回はデータが無いので、空状態の案内が出る（F-35）。設定からシード投入できる。
    const events = await Repo.events.all();
    // 確認URL・イベントURL・プレビューURLからの復帰を先に試す（F-97 / F-07）
    if (!await App.routeFromUrl()) App.render();
    if (!events.length) {
      // 起動直後に自動でシードは投入しない（初期化の確認をしやすくするため）。案内のみ。
      FB.toast("データがありません。設定 → デモデータを投入 で開始できます");
    }
  } catch (e) {
    console.error(e);
    FB.error("初期化に失敗しました: " + e.message +
      "（file:// ではなくローカルHTTPサーバ経由で開いてください）");
  }
})();
</script>
