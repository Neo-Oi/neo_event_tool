    pane.querySelector("#editBtn").onclick = () => App.openCreate(ev.id);
    // 下書きのままでも参加者ビューでの見え方を確認できる（F-07）
    pane.querySelector("#previewBtn").onclick = () => App.openPreview(ev.id);
    // 複製（F-d）。申込は複製せず、下書きとして作る。copiedFromId で元を辿れる
    pane.querySelector("#dupBtn").onclick = () => FB.confirmModal({
      title:"このイベントを複製しますか？", okLabel:"複製する",
      body:"内容をコピーした<b>下書き</b>を作ります。申込・お知らせ・運営タスクは複製されません。",
      onOk: async () => {
        try {
          const now = new Date().toISOString();
          const copy = { ...ev, id:Util.uid(), title:`${ev.title}（コピー）`,
            status:"draft", copiedFromId:ev.id, groupId:ev.groupId || ev.id,
            createdAt:now, updatedAt:now };
          await Repo.events.put(copy);
          FB.toast("複製しました。下書きとして作成されています");
          App.openEvent(copy.id);
        } catch (e) { FB.error("複製に失敗: " + e.message); }
      } });

    // 状態を1つ書き換えて詳細を再読込する。遷移は一方向（F-37）で、ここでしか変えない
    const transition = async (status, msg) => {
      try {
        await Repo.events.put({ ...ev, status, updatedAt:new Date().toISOString() });
        FB.toast(msg);
        await render(ctx.el, ev.id);
      } catch (e) { FB.error("状態の変更に失敗: " + e.message); }
    };

    const pub = pane.querySelector("#publishBtn");
    if (pub) pub.onclick = () => FB.confirmModal({
      title:"イベントを公開しますか？", okLabel:"公開する",
      body:"公開すると下書きには戻せません。この操作は取り消せません。",
      onOk:() => transition("published", "公開しました") });
    const can = pane.querySelector("#cancelBtn");
    if (can) can.onclick = () => FB.confirmModal({
      title:"イベントを中止しますか？", okLabel:"中止する", danger:true,
      body:"中止すると元に戻せません。既存の申込は変更されません（F-39）。",
      onOk:() => transition("cancelled", "中止しました") });
    const del = pane.querySelector("#deleteBtn");
    if (del) del.onclick = () => FB.confirmModal({
      title:"下書きを削除しますか？", okLabel:"削除する", danger:true,
      body:"この下書きを削除します。",
      onOk: async () => {
        try {
          await Repo.events.remove(ev.id);
          FB.toast("下書きを削除しました");
          App.go("events");
        } catch (e) { FB.error("削除に失敗: " + e.message); }
      } });
  }

  // persons をまとめて読んでおく（申込一覧の氏名・メール表示に必要）
  async function render(el, eventId) {
    const [ev, apps, personsArr, tasks, msgs, readRows] = await Promise.all([
      Repo.events.get(eventId),
      Repo.applications.byEvent(eventId),
      Repo.persons.all(),
      Repo.tasks.byEvent(eventId),
      Repo.messages.byEvent(eventId),
      Repo.readStates.all()]);
    if (!ev) { el.innerHTML = `<div class="empty"><div class="big">イベントが見つかりません</div></div>`; return; }
    const _persons = {}; personsArr.forEach(p => _persons[p.id] = p);
    const unread = Ops.unreadOf(msgs, "thread", Ops.readMap(readRows), eventId);
    ctx = { ev, apps, _persons, tasks, unread, el };
    // 別のイベントを開いたら絞り込みは解除する（操作後の再描画では保持する）
    expandedId = null; tab = "apply"; query = "";
    paint();
  }

  return { render };
})();


// ===== [9b] 主催者：運営スレッド／運営Q&A（社内・実データで永続 / messages ストア） =====
/* 設計は複数人での共有管理を想定するが、サーバなし＝単一ブラウザのため実態は一人（同一
   ブラウザ）で管理する。別端末との同期はサーバ導入時まで不可（引き継ぎ書 4-1）。 */
const Ops = (() => {
  let lastAuthor = "運営"; // 直近の投稿者名を保持（セッション内）

  /* 既読位置（v3 の readStates）。「未読かどうか」は保存せず、既読時刻と投稿時刻から
     都度算出する。時期を保存しないのと同じ考え方（4-3）。
     既読位置が無いイベントは「全部未読」になる——まだ一度も開いていない、が正しい。 */
  const readKey = (eventId, channel) => `${eventId}:${channel}`;
  const unreadOf = (msgs, channel, readStates, eventId) => {
    const r = readStates[readKey(eventId, channel)];
    const since = r ? new Date(r.lastReadAt).getTime() : 0;
    return msgs.filter(m => m.channel === channel && new Date(m.createdAt).getTime() > since).length;
  };
  async function markRead(eventId, channel) {
    await Repo.readStates.put({ key:readKey(eventId, channel), eventId, channel,
      lastReadAt:new Date().toISOString() });
  }
  // 一覧など、複数イベントぶんをまとめて扱うとき用
  const readMap = (rows) => { const m = {}; rows.forEach(r => m[r.key] = r); return m; };

  // ---- 運営スレッド（チャット） ----
  async function renderThread(pane, eventId, onRead) {
    const all = await Repo.messages.byEvent(eventId);
    const msgs = all.filter(m => m.channel === "thread")
      .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    // 開いた時点で既読にする。以降の投稿だけが未読になる
    await markRead(eventId, "thread");
    onRead && onRead();
    pane.innerHTML = `
      <div class="ops-note">運営メンバー間のチャットです。この端末内に保存されます（別端末との同期はサーバ導入まで不可 / 4-1）。</div>
      <div class="chat" id="chatList">
        ${msgs.length ? msgs.map(bubble).join("")
          : `<div class="empty">まだ投稿がありません。最初のメッセージを送ってみましょう。</div>`}
      </div>
      <div class="composer">
        <div class="crow"><input class="author" id="opAuthor" value="${Util.esc(lastAuthor)}" placeholder="名前"></div>
        <textarea id="opBody" placeholder="メッセージを入力"></textarea>
        <div><button class="btn primary" id="opSend">送信</button></div>
      </div>`;
    const list = pane.querySelector("#chatList");
    list.scrollTop = list.scrollHeight;
    pane.querySelector("#opSend").onclick = async () => {
      const author = pane.querySelector("#opAuthor").value.trim() || "運営";
      const body = pane.querySelector("#opBody").value.trim();
      if (!body) { FB.toast("メッセージを入力してください"); return; }
      lastAuthor = author;
      await Repo.messages.put({ id:Util.uid(), eventId, channel:"thread",
        author, body, createdAt:new Date().toISOString() });
      renderThread(pane, eventId, onRead);
    };
    pane.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      await Repo.messages.remove(b.dataset.del); renderThread(pane, eventId, onRead);
    });
  }
  const bubble = (m) => `<div class="bubble">
    <button class="del" data-del="${m.id}" title="削除">✕</button>
    <span class="who">${Util.esc(m.author||"運営")}</span><span class="when">${Util.fmtDateTime(m.createdAt)}</span>
    <div class="body">${Util.esc(m.body)}</div></div>`;

  // ---- 運営Q&A（疑問の登録・解消。例:「この荷物は地下か1階か」） ----
  async function renderQA(pane, eventId) {
    const all = await Repo.messages.byEvent(eventId);
    const qas = all.filter(m => m.channel === "qa")
      .sort((a,b) => (a.resolved?1:0)-(b.resolved?1:0) || new Date(b.createdAt)-new Date(a.createdAt));
    pane.innerHTML = `
      <div class="ops-note">運営内の疑問を登録して解消します。この端末内に保存されます（4-1）。</div>
      <div class="card pad" style="margin-bottom:14px">
        <div class="field"><label>新しい疑問</label>
          <textarea id="qaBody" placeholder="例: 受付の荷物は地下と1階のどちらに運ぶ？"></textarea></div>
        <div class="crow" style="display:flex;gap:8px;align-items:center">
          <input class="qa-author" id="qaAuthor" value="${Util.esc(lastAuthor)}" placeholder="名前">
          <button class="btn primary" id="qaAdd">登録</button></div>
      </div>
      <div id="qaList">${qas.length ? qas.map(qaCard).join("")
        : `<div class="empty">登録された疑問はありません。</div>`}</div>`;

    pane.querySelector("#qaAdd").onclick = async () => {
      const author = pane.querySelector("#qaAuthor").value.trim() || "運営";
      const body = pane.querySelector("#qaBody").value.trim();
      if (!body) { FB.toast("疑問の内容を入力してください"); return; }
      lastAuthor = author;
      await Repo.messages.put({ id:Util.uid(), eventId, channel:"qa", author, body,
        answer:"", resolved:false, createdAt:new Date().toISOString(), resolvedAt:null });
      renderQA(pane, eventId);
    };
    qas.forEach(q => {
      const bodyOf = () => { const ta = pane.querySelector(`[data-ansbody="${q.id}"]`); return ta ? ta.value : q.answer; };
      const ans = pane.querySelector(`[data-ans="${q.id}"]`);
      if (ans) ans.onclick = async () => { q.answer = bodyOf(); await Repo.messages.put(q); FB.toast("回答を保存しました"); renderQA(pane, eventId); };
      const tog = pane.querySelector(`[data-toggle="${q.id}"]`);
      if (tog) tog.onclick = async () => {
        q.answer = bodyOf();
        q.resolved = !q.resolved; q.resolvedAt = q.resolved ? new Date().toISOString() : null;
        await Repo.messages.put(q); renderQA(pane, eventId);
      };
      const del = pane.querySelector(`[data-qadel="${q.id}"]`);
      if (del) del.onclick = () => FB.confirmModal({ title:"この疑問を削除しますか？",
        okLabel:"削除する", danger:true, body:"登録された疑問と回答を削除します。",
        onOk: async () => { await Repo.messages.remove(q.id); renderQA(pane, eventId); } });
    });
  }
  const qaCard = (q) => `<div class="qa-item ${q.resolved?'resolved':''}">
    <div class="qa-q"><span class="badge ${q.resolved?'resolved':'open'}">${q.resolved?'解決済み':'未解決'}</span>
      <span>${Util.esc(q.body)}</span></div>
    <div class="qa-meta">${Util.esc(q.author||"運営")}・${Util.fmtDateTime(q.createdAt)}</div>
    <textarea data-ansbody="${q.id}" placeholder="回答・対応内容を入力">${Util.esc(q.answer||"")}</textarea>
    <div class="row-actions" style="margin-top:8px">
      <button class="btn sm primary" data-ans="${q.id}">回答を保存</button>
      <button class="btn sm" data-toggle="${q.id}">${q.resolved?'未解決に戻す':'解決にする'}</button>
      <button class="btn sm" data-qadel="${q.id}" style="color:var(--danger)">削除</button>
    </div></div>`;

  // ---- お知らせ（主催者→参加者への一方向の連絡。messages の channel:'notice'） ----
  /* メール送信はサーバが無いため不可能だが（4-1）、Peatix のメッセージがメール通知と
     受信箱の2層である以上、後者に相当する層はサーバ無しでも成立する。公開ページと
     マイ申込に出すことで、主催者→参加者の連絡手段を確保する。 */
  async function renderNotice(pane, eventId) {
    const all = await Repo.messages.byEvent(eventId);
    const list = noticesOf(all);
    pane.innerHTML = `
      <div class="ops-note">参加者向けのお知らせです。<b>公開ページと参加者のマイ申込に表示されます</b>。
        メール送信はできないため（サーバが必要）、参加者が見に来たときに気づく形になります。</div>
      <div class="card pad" style="margin-bottom:14px">
        <div class="field"><label>件名<span class="req">必須</span></label>
          <input id="ntTitle" placeholder="例: 開催場所を4階から6階に変更しました"></div>
        <div class="field"><label>本文</label>
          <textarea id="ntBody" placeholder="変更の理由や補足があれば記入"></textarea></div>
        <div class="crow" style="display:flex;gap:8px;align-items:center">
          <input class="qa-author" id="ntAuthor" value="${Util.esc(lastAuthor)}" placeholder="差出人">
          <button class="btn primary" id="ntAdd">お知らせを出す</button></div>
      </div>
      <div id="ntList">${list.length ? list.map(noticeCard).join("")
        : `<div class="empty">お知らせはまだありません。</div>`}</div>`;

    pane.querySelector("#ntAdd").onclick = async () => {
      const title = pane.querySelector("#ntTitle").value.trim();
      const body = pane.querySelector("#ntBody").value.trim();
      if (!title) { FB.toast("件名を入力してください"); return; }
      const author = pane.querySelector("#ntAuthor").value.trim() || "運営";
      lastAuthor = author;
      try {
        await Repo.messages.put({ id:Util.uid(), eventId, channel:"notice", author,
          title, body, createdAt:new Date().toISOString() });
        FB.toast("お知らせを公開しました");
        renderNotice(pane, eventId);
      } catch (e) { FB.error("お知らせの保存に失敗: " + e.message); }
    };
    pane.querySelectorAll("[data-ntdel]").forEach(b => b.onclick = () =>
      FB.confirmModal({ title:"このお知らせを取り下げますか？", okLabel:"取り下げる", danger:true,
        body:"参加者からも見えなくなります。",
        onOk: async () => {
          try { await Repo.messages.remove(b.dataset.ntdel); renderNotice(pane, eventId); }
          catch (e) { FB.error("取り下げに失敗: " + e.message); }
        } }));
  }
  const noticeCard = (n) => `<div class="qa-item">
    <div class="qa-q"><span class="badge phase">お知らせ</span><span>${Util.esc(n.title)}</span></div>
    <div class="qa-meta">${Util.esc(n.author||"運営")}・${Util.fmtDateTime(n.createdAt)}</div>
    ${n.body ? `<div style="white-space:pre-wrap">${Util.esc(n.body)}</div>` : ""}
    <div class="row-actions" style="margin-top:8px">
      <button class="btn sm" data-ntdel="${n.id}" style="color:var(--danger)">取り下げる</button>
    </div></div>`;

  // 参加者側に出す用（新しい順）。公開ページ・マイ申込の両方から使う
  const noticesOf = (msgs) => msgs.filter(m => m.channel === "notice")
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  return { renderThread, renderQA, renderNotice, noticesOf,
           unreadOf, markRead, readMap, readKey };
})();


// ===== [9c] 主催者：運営タスク（backlog風ボード＋タイムライン / E-2。tasks ストア） =====
/* 状態は 未対応／処理中／処理済／完了 の4段（Backlog に倣う）。ドラッグで状態と並び順が
   変わり、そのまま IndexedDB に保存される。並び順は order（10刻み）で保持。 */
const Tasks = (() => {
  let ctx = null;            // { pane, eventId, tasks, onChange }
  let view = "board";        // board | timeline（サブタブを離れても保持）
  let lastAssignee = "";     // 直近の担当者名（セッション内）

  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) ||
    new Date(a.createdAt) - new Date(b.createdAt);
  const pad2 = n => String(n).padStart(2, "0");
  // 日付は "YYYY-MM-DD" の文字列のまま扱う（Date 化による時差ずれを避ける）
  const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const fmtDay = (s) => s ? s.slice(5).replace("-", "/") : "";
  const todayKey = () => dayKey(new Date());

  async function render(pane, eventId, onChange) {
    const tasks = await Repo.tasks.byEvent(eventId);
    ctx = { pane, eventId, tasks: tasks.sort(byOrder), onChange };
    paint();
  }
  async function reload() {
    const tasks = await Repo.tasks.byEvent(ctx.eventId);
    ctx.tasks = tasks.sort(byOrder);
    paint();
    ctx.onChange && ctx.onChange();   // S-4 の固定表示（タスク進捗）を追随させる
  }

  function paint() {
    const { pane, tasks } = ctx;
    const s = Domain.taskSummary(tasks);
    pane.innerHTML = `
      <div class="ops-note">イベント運営のタスクを管理します。この端末内に保存されます（別端末との同期はサーバ導入まで不可 / 4-1）。</div>
      <div class="tk-head">
        <div class="tk-progress">
          <div class="tk-stat">進捗 <b>${s.done}/${s.total}</b>（${s.rate}%）${
            s.overdue ? ` ・ <span class="over">期限超過 ${s.overdue}件</span>` : ""}</div>
          <div class="tk-bar"><span style="width:${s.rate}%"></span></div>
        </div>
        <div class="toggles">
          <button data-view="board" class="${view==="board"?"on":""}">ボード</button>
          <button data-view="timeline" class="${view==="timeline"?"on":""}">タイムライン</button>
        </div>
        <button class="btn primary" id="tkAdd">＋ タスクを追加</button>
      </div>
      <div id="tkBody"></div>`;

    pane.querySelectorAll(".tk-head [data-view]").forEach(b =>
      b.onclick = () => { view = b.dataset.view; paint(); });
    pane.querySelector("#tkAdd").onclick = () => openEditor(null);

    const body = pane.querySelector("#tkBody");
    if (!tasks.length) {
      body.innerHTML = `<div class="empty"><div class="big">タスクがありません</div>
        「＋ タスクを追加」から、備品手配・会場設営などの準備タスクを登録できます。</div>`;
      return;
    }
    if (view === "board") renderBoard(body); else renderTimeline(body);
  }

  // ---- ボード（カンバン。ドラッグで状態変更・並べ替え） ----
  function renderBoard(host) {
    const { tasks } = ctx;
    host.innerHTML = `
      <div class="board">${Domain.TASK_FLOW.map(st => {
        const list = tasks.filter(t => t.status === st);
        return `<div class="col" data-col="${st}">
          <div class="ch"><span class="dot ${st}"></span>${Domain.TASK_STATUS[st]}
            <span class="cnt">${list.length}</span></div>
          <div class="drop" data-drop="${st}">${list.map(card).join("")}</div>
        </div>`;
      }).join("")}</div>
      <div class="ops-note" style="margin:14px 0 0">カードをドラッグすると状態と並び順が変わり、そのまま保存されます。カードをクリックすると編集できます。</div>`;
    wireBoard(host);
  }

  const card = (t) => {
    const over = Domain.taskOverdue(t);
    return `<div class="tcard p-${t.priority || "normal"}" draggable="true" data-id="${t.id}">
      <div class="t">${Util.esc(t.title)}</div>
      <div class="m">
        ${t.assignee ? `<span class="who">${Util.esc(t.assignee)}</span>` : ""}
        ${t.dueDate ? `<span class="due ${over?"over":""}">${over?"⚠":"🗓"} ${fmtDay(t.dueDate)}</span>` : ""}
        ${t.priority === "high" ? `<span class="pri">優先度 高</span>` : ""}
      </div></div>`;
  };

  function wireBoard(host) {
    host.querySelectorAll(".tcard").forEach(c => {
      c.ondragstart = (e) => {
        c.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", c.dataset.id);
      };
      c.ondragend = () => {
        c.classList.remove("dragging");
        host.querySelectorAll(".col").forEach(x => x.classList.remove("over"));
      };
      c.onclick = () => openEditor(ctx.tasks.find(t => t.id === c.dataset.id));
    });
    host.querySelectorAll("[data-drop]").forEach(zone => {
      zone.ondragover = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        zone.closest(".col").classList.add("over");
        // ドラッグ中は「掴んでいる要素そのもの」を移動する。innerHTML の全置換は行わない
        // （置換すると掴んだ参照が親を失い、以後の操作が画面に反映されなくなる）
        const dragging = host.querySelector(".tcard.dragging");
        if (!dragging) return;
        const after = afterElement(zone, e.clientY);
        if (after == null) zone.appendChild(dragging);
        else if (after !== dragging) zone.insertBefore(dragging, after);
      };
      zone.ondragleave = (e) => {
        if (!zone.contains(e.relatedTarget)) zone.closest(".col").classList.remove("over");
      };
      zone.ondrop = (e) => { e.preventDefault(); commit(host); };
    });
  }

  // カーソル位置より下にある最初のカード（そこへ挿入する）
  const afterElement = (zone, y) =>
    [...zone.querySelectorAll(".tcard:not(.dragging)")].find(el => {
      const r = el.getBoundingClientRect();
      return y < r.top + r.height / 2;
    }) || null;

  // DOM の並びを読み取り、変化したレコードだけを1トランザクションで保存（7-1）
  async function commit(host) {
    const map = {}; ctx.tasks.forEach(t => map[t.id] = t);
    const now = new Date().toISOString();
    const entries = [];
    let statusChanged = false;
    host.querySelectorAll("[data-drop]").forEach(zone => {
      const status = zone.dataset.drop;
      [...zone.querySelectorAll(".tcard")].forEach((el, i) => {
        const t = map[el.dataset.id];
        if (!t) return;
        const order = i * 10;
        if (t.status === status && t.order === order) return;
        if (t.status !== status) statusChanged = true;
        entries.push({ store:"tasks", record: { ...t, status, order, updatedAt: now,
          doneAt: status === "done" ? (t.doneAt || now) : null } });
      });
    });
    if (!entries.length) return;
    try {
      await Repo.bulkPut(entries);
      await reload();
      if (statusChanged) FB.toast("タスクの状態を更新しました");
    } catch (e) { FB.error("タスクの保存に失敗: " + e.message); }
  }

  // ---- タイムライン（ガント風。今日線・週末シェード） ----
  function renderTimeline(host) {
    const { tasks } = ctx;
    const dated = tasks.filter(t => t.startDate || t.dueDate);
    const undated = tasks.filter(t => !t.startDate && !t.dueDate);
    if (!dated.length) {
      host.innerHTML = `<div class="empty"><div class="big">日付が設定されたタスクがありません</div>
        タスクに開始日・期限日を設定すると、ここに表示されます。</div>` + undatedHtml(undated);
      wireRows(host);
      return;
    }
    // 範囲は「全タスクの最小開始日〜最大期限日」に今日を含め、前後1日の余白を付ける
    const spans = dated.map(t => {
      const a = t.startDate || t.dueDate, b = t.dueDate || t.startDate;
      return { t, s: a <= b ? a : b, e: a <= b ? b : a };
    });
    const tk = todayKey();
    const minKey = spans.map(x => x.s).concat(tk).sort()[0];
    const maxKey = spans.map(x => x.e).concat(tk).sort().pop();
    const first = shiftDay(minKey, -1);
    const total = Math.min(diffDays(first, maxKey) + 2, 180);  // 上限180日

    const cells = [];
    const index = {};
    for (let i = 0, k = first; i < total; i++, k = shiftDay(k, 1)) {
      const d = new Date(k + "T00:00:00");
      cells.push({ key:k, d, we: d.getDay() === 0 || d.getDay() === 6, now: k === tk });
      index[k] = i;
    }
    // 範囲外（180日超）に落ちたぶんは端に寄せる
    const at = (k) => index[k] != null ? index[k] : (k < first ? 0 : total - 1);

    const WD = ["日","月","火","水","木","金","土"];
    const months = [];
    cells.forEach(c => {
      const label = `${c.d.getFullYear()}年${c.d.getMonth()+1}月`;
      const last = months[months.length-1];
      if (last && last.label === label) last.n++; else months.push({ label, n:1 });
    });
    const nowLeft = index[tk] != null
      ? `<div class="tl-today" style="left:calc(var(--dw) * ${index[tk] + 0.5})"></div>` : "";
    const dayCells = cells.map(c =>
      `<div class="tl-c ${c.we?"we":""} ${c.now?"now":""}"></div>`).join("");

    host.innerHTML = `
      <div class="tl"><div class="tl-inner">
        <div class="tl-month">
          <div class="mlabel" style="width:var(--nw)">期間</div>
          ${months.map(m => `<div class="mlabel" style="width:calc(var(--dw) * ${m.n})">${m.label}</div>`).join("")}
        </div>
        <div class="tl-row head">
          <div class="tl-name">タスク（${dated.length}件）</div>
          <div class="tl-track">${cells.map(c =>
            `<div class="tl-d ${c.we?"we":""} ${c.now?"now":""}"><b>${c.d.getDate()}</b>${WD[c.d.getDay()]}</div>`).join("")}</div>
        </div>
        ${spans.map(({ t, s, e }) => {
          const i0 = at(s), i1 = at(e), over = Domain.taskOverdue(t);
          const len = Math.max(i1 - i0 + 1, 1);
          const label = len >= 3 ? `${fmtDay(s)}〜${fmtDay(e)}` : "";
          return `<div class="tl-row clickable" data-id="${t.id}">
            <div class="tl-name"><span class="dot ${t.status}"></span>
              <span class="nm" title="${Util.esc(t.title)}">${Util.esc(t.title)}</span>
              ${t.assignee ? `<span class="who">${Util.esc(t.assignee)}</span>` : ""}</div>
            <div class="tl-track">${dayCells}${nowLeft}
              <div class="tl-bar s-${t.status} ${over?"over":""}"
                style="left:calc(var(--dw) * ${i0});width:calc(var(--dw) * ${len} - 3px)"
                title="${Util.esc(t.title)} / ${Domain.TASK_STATUS[t.status]} / ${s}〜${e}">${label}</div>
            </div></div>`;
        }).join("")}
      </div></div>
      ${undatedHtml(undated)}`;
    wireRows(host);
  }

  const undatedHtml = (list) => !list.length ? "" :
    `<div class="tl-undated">日付未設定（${list.length}件）:
      ${list.map(t => `<span class="chip" data-id="${t.id}">
        <span class="dot ${t.status}"></span>${Util.esc(t.title)}</span>`).join("")}</div>`;

  function wireRows(host) {
    host.querySelectorAll("[data-id]").forEach(el =>
      el.onclick = () => openEditor(ctx.tasks.find(t => t.id === el.dataset.id)));
  }

  // 日付文字列の加減算（Date のローカル日付で行い、時差・夏時間の影響を受けない）
  function shiftDay(key, n) {
    const d = new Date(key + "T00:00:00");
    d.setDate(d.getDate() + n);
    return dayKey(d);
  }
  const diffDays = (a, b) =>
    Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

  // ---- 追加・編集モーダル ----
  function openEditor(task) {
    const isNew = !task;
    const t = task || { title:"", detail:"", assignee:lastAssignee, status:"todo",
      priority:"normal", startDate:"", dueDate:"" };
    const opts = (obj, cur) => Object.entries(obj).map(([k, v]) =>
      `<option value="${k}"${cur === k ? " selected" : ""}>${v}</option>`).join("");

    const host = document.getElementById("modalHost");
    host.innerHTML = `<div class="modal wide">
      <h3>${isNew ? "タスクを追加" : "タスクを編集"}</h3>
      <div class="field" style="margin-top:14px"><label>タイトル<span class="req">必須</span></label>
        <input id="tkTitle" value="${Util.esc(t.title)}" placeholder="例: 会場の備品を手配する"></div>
      <div class="form-2col">
        <div class="field"><label>状態</label>
          <select id="tkStatus">${opts(Domain.TASK_STATUS, t.status)}</select></div>
        <div class="field"><label>優先度</label>
          <select id="tkPriority">${opts(Domain.PRIORITY, t.priority || "normal")}</select></div>
        <div class="field"><label>開始日</label>
          <input type="date" id="tkStart" value="${t.startDate || ""}"></div>
        <div class="field"><label>期限日</label>
          <input type="date" id="tkDue" value="${t.dueDate || ""}"></div>
      </div>
      <div class="field"><label>担当者</label>
        <input id="tkAssignee" value="${Util.esc(t.assignee || "")}" placeholder="例: 運営A"></div>
      <div class="field"><label>メモ</label>
        <textarea id="tkDetail" placeholder="補足・手順など">${Util.esc(t.detail || "")}</textarea></div>
      <div class="err" id="tkErr" style="color:var(--danger);font-size:12px;min-height:18px"></div>
      <div class="modal-actions">
        ${isNew ? "" : '<button class="btn" id="tkDel" style="color:var(--danger)">削除</button>'}
        <div class="spacer"></div>
        <button class="btn" id="tkCancel">キャンセル</button>
        <button class="btn primary" id="tkSave">保存</button>
      </div></div>`;
    host.classList.add("on");

    const q = (sel) => host.querySelector(sel);
    const close = () => { host.classList.remove("on"); host.innerHTML = ""; };
    q("#tkCancel").onclick = close;
    q("#tkTitle").focus();

    q("#tkSave").onclick = async () => {
      const title = q("#tkTitle").value.trim();
      const start = q("#tkStart").value, due = q("#tkDue").value;
      if (!title) { q("#tkErr").textContent = "タイトルを入力してください"; return; }
      if (start && due && start > due) {
        q("#tkErr").textContent = "開始日は期限日より後にできません"; return;
      }
      const status = q("#tkStatus").value;
      const assignee = q("#tkAssignee").value.trim();
      const now = new Date().toISOString();
      const fields = { title, detail:q("#tkDetail").value.trim(), assignee, status,
        priority:q("#tkPriority").value, startDate:start || null, dueDate:due || null,
        updatedAt:now, doneAt: status === "done" ? (t.doneAt || now) : null };
      const rec = isNew
        ? { id:Util.uid(), eventId:ctx.eventId, order:nextOrder(status), createdAt:now, ...fields }
        : { ...t, ...fields };
      lastAssignee = assignee;
      try {
        await Repo.tasks.put(rec);
        close();
        await reload();
        FB.toast(isNew ? "タスクを追加しました" : "タスクを保存しました");
      } catch (e) { FB.error("タスクの保存に失敗: " + e.message); }
    };

    const del = q("#tkDel");
    if (del) del.onclick = () => {
      close();   // confirmModal がホストを全置換するため、先に閉じる
      FB.confirmModal({ title:"このタスクを削除しますか？", okLabel:"削除する", danger:true,
        body:`「${Util.esc(t.title)}」を削除します。`,
        onOk: async () => {
          try { await Repo.tasks.remove(t.id); await reload(); FB.toast("タスクを削除しました"); }
          catch (e) { FB.error("タスクの削除に失敗: " + e.message); }
        } });
    };
  }

  // 追加先の列の末尾に置く
  const nextOrder = (status) => {
    const inCol = ctx.tasks.filter(t => t.status === status);
    return inCol.length ? Math.max(...inCol.map(t => t.order ?? 0)) + 10 : 0;
  };

  return { render };
})();


// ===== [9e] 主催者：イベントマニュアル（Markdown / F-99。manuals ストア） =====
/* 当日の進行・搬入・受付手順など、運営が見る手順書をイベントごとに持つ。
   ビューは 編集 / 分割 / プレビュー の3つ。**書き終えた後は読む回数の方が圧倒的に多い**ので、
   本文があるときはプレビューで開き、「編集」で書き換えに入る。初回（空）だけ編集で開く。 */
const Manual = (() => {
  let ctx = null;   // { pane, eventId, body, saved, mode }

  const TEMPLATE = `# 当日マニュアル

## タイムテーブル

| 時刻 | 内容 | 担当 |
|---|---|---|
| 17:00 | 会場設営・受付準備 | 運営A |
| 18:00 | 受付開始 | 運営B |
| 18:30 | 開会 | 運営A |

## 受付の手順

1. 参加者に氏名を伺う
2. 申込タブで検索、または **QRで受付** から読み取り
3. 名札をお渡しする

> 名簿に無い方は、その場で申込を作らず運営リーダーへ連絡すること。

## 持ち物チェック

- [ ] 名札・名簿の印刷
- [ ] 延長コード・電源タップ
- [ ] 受付用のノートPC

## 連絡先

- 運営リーダー: 内線 1234
- 会場管理: 内線 5678
`;

  async function render(pane, eventId) {
    const rec = await Repo.manuals.get(eventId);
    const body = rec ? rec.body : "";
    // 初回（本文が空）は編集から。以降はプレビューで開く
    ctx = { pane, eventId, body, saved: body, mode: body.trim() ? "preview" : "edit",
            updatedAt: rec ? rec.updatedAt : null };
    paint();
  }

  const dirty = () => ctx.body !== ctx.saved;

  function paint() {
    const { pane, mode } = ctx;
    const empty = !ctx.body.trim();
    pane.innerHTML = `
      <div class="ops-note">運営が当日に見る手順書です。Markdown で書けます。参加者には表示されません。</div>
      <div class="mn-bar">
        <div class="toggles" style="margin-left:0">
          <button data-mode="edit" class="${mode==="edit"?"on":""}">編集</button>
          <button data-mode="split" class="${mode==="split"?"on":""}">分割</button>
          <button data-mode="preview" class="${mode==="preview"?"on":""}">プレビュー</button>
        </div>
        <span class="mn-state">${dirty() ? '<span class="dirty">未保存の変更があります</span>'
          : ctx.updatedAt ? `最終更新 ${Util.fmtDateTime(ctx.updatedAt)}` : ""}</span>
        ${empty ? `<button class="btn" id="mnTmpl">ひな形を挿入</button>` : ""}
        <button class="btn ${dirty()?"primary":""}" id="mnSave" ${dirty()?"":"disabled style=opacity:.5"}>保存</button>
      </div>
      <div class="mn-body ${mode}">
        ${mode !== "preview" ? `<textarea id="mnEdit" spellcheck="false"
          placeholder="# 当日マニュアル&#10;&#10;Markdown で書けます。">${Util.esc(ctx.body)}</textarea>` : ""}
        ${mode !== "edit" ? `<div class="mn-prev md" id="mnPrev">${
          empty ? `<div class="empty"><div class="big">マニュアルがありません</div>
            「編集」タブから書けます。「ひな形を挿入」で雛形から始められます。</div>`
          : Util.markdown(ctx.body)}</div>` : ""}
      </div>`;

    pane.querySelectorAll(".mn-bar [data-mode]").forEach(b =>
      b.onclick = () => { ctx.mode = b.dataset.mode; paint(); });

    const ta = pane.querySelector("#mnEdit");
    if (ta) {
      ta.oninput = () => {
        ctx.body = ta.value;
        // 分割ビューは打つそばから反映する。textarea は作り直さない（カーソルが飛ぶため）
        const prev = pane.querySelector("#mnPrev");
        if (prev) prev.innerHTML = Util.markdown(ctx.body);
        refreshBar();
      };
      if (ctx.mode === "edit") ta.focus();
    }
    const tmpl = pane.querySelector("#mnTmpl");
    if (tmpl) tmpl.onclick = () => {
      ctx.body = TEMPLATE; ctx.mode = "split"; paint();
    };
    pane.querySelector("#mnSave").onclick = save;
  }

  // 保存ボタンと状態表示だけ差し替える（入力中に全体を描き直さない）
  function refreshBar() {
    const btn = ctx.pane.querySelector("#mnSave");
    const st = ctx.pane.querySelector(".mn-state");
    if (btn) {
      btn.disabled = !dirty();
      btn.style.opacity = dirty() ? "" : ".5";
      btn.classList.toggle("primary", dirty());
    }
    if (st) st.innerHTML = dirty() ? '<span class="dirty">未保存の変更があります</span>'
      : ctx.updatedAt ? `最終更新 ${Util.fmtDateTime(ctx.updatedAt)}` : "";
  }

  async function save() {
    if (!dirty()) return;
    const now = new Date().toISOString();
    try {
      await Repo.manuals.put({ eventId: ctx.eventId, body: ctx.body, updatedAt: now });
      ctx.saved = ctx.body; ctx.updatedAt = now;
      FB.toast("マニュアルを保存しました");
      // 保存したら読む状態に戻す（書き終えた後は読む方が多い）
      ctx.mode = ctx.body.trim() ? "preview" : "edit";
      paint();
    } catch (e) { FB.error("マニュアルの保存に失敗: " + e.message); }
  }

  return { render };
})();


// ===== [9d] 主催者：参加者名簿 S-10（横断 / F-b） =====
/* 「データ蓄積が価値」の証明にあたる画面。persons を横断で一覧し、同一人物の参加履歴を
   まとめて見る。Peatix はイベント終了30日後にフォームデータを削除するため、ここが差になる。
   persons を後から足すと全 applications の付け替えが要る（4-5）ので当初から持っていた。 */
const Roster = (() => {
  let query = "";
  let openId = null;

  /* 参加者名簿はイベントを横断した個人情報の集積なので、開く前にパスワードを求める。
     **これは秘匿ではなく操作の抑止である。** 単一HTML・サーバなしという構成上、
     パスワードはソースに書かれており、DevTools から IndexedDB を直接見ることもできる。
     したがって守れるのは「肩越しの覗き見」と「誤って開く」ところまで。
     実効的な保護にはサーバ側の認証が要る（引き継ぎ書 4-1 / F-101）。
     解除はセッション内のみ保持する。再読込で再びロックされる。 */
  const PASSWORD = "admin";
  let unlocked = false;

  function lockHtml(err) {
    return `
      <div class="page-head"><h2>参加者</h2></div>
      <div class="card pad lock">
        <div class="lk-icon">🔒</div>
        <h3>参加者名簿はパスワードで保護されています</h3>
        <p>イベントを横断した個人情報を表示します。閲覧にはパスワードが必要です。</p>
        <div class="lk-form">
          <input type="password" id="lkPw" placeholder="パスワード" autocomplete="off">
          <button class="btn primary" id="lkGo">解除</button>
        </div>
        ${err ? `<div class="lk-err">${Util.esc(err)}</div>` : ""}
        <div class="note" style="margin-top:18px;text-align:left">
          <b>この保護の限界。</b>サーバが無いため、パスワードは HTML 内に書かれており、
          開発者ツールから IndexedDB を直接開くこともできます。防げるのは
          <b>肩越しの覗き見と誤操作まで</b>で、意図的な閲覧は防げません。
          実効的な保護にはサーバ側の認証が必要です（引き継ぎ書 4-1）。
        </div>
      </div>`;
  }

  function renderLock(el, err) {
    el.innerHTML = lockHtml(err);
    const go = () => {
      const v = el.querySelector("#lkPw").value;
      if (v === PASSWORD) { unlocked = true; render(el); }
      else renderLock(el, "パスワードが違います");
    };
    el.querySelector("#lkGo").onclick = go;
    const pw = el.querySelector("#lkPw");
    pw.onkeydown = (e) => { if (e.key === "Enter") go(); };
    pw.focus();
  }

  const lock = () => { unlocked = false; };   // 明示的に再ロックする

  async function render(el) {
    if (!unlocked) { renderLock(el, null); return; }
    const [persons, apps, events] = await Promise.all([
      Repo.persons.all(), Repo.applications.all(), Repo.events.all()]);
    const evById = {}; events.forEach(e => evById[e.id] = e);
    const byPerson = groupBy(apps, "personId");

    const rows = persons.map(p => {
      const mine = (byPerson[p.id] || [])
        .sort((a,b) => new Date(b.appliedAt) - new Date(a.appliedAt));
      const valid = mine.filter(Domain.isValidApp);
      return { p, mine,
        total: valid.length,
        attended: mine.filter(a => a.status === "checkedin").length,
        cancelled: mine.filter(a => a.status === "cancelled").length,
        last: mine[0] ? mine[0].appliedAt : null,
        text: Util.normalize(p.name + p.nameKana + p.email) };
    }).sort((a,b) => b.total - a.total || new Date(b.last||0) - new Date(a.last||0));

    const q = Util.normalize(query);
    const shown = rows.filter(r => !q || r.text.includes(q));

    el.innerHTML = `
      <div class="page-head"><h2>参加者</h2>
        <span class="sub">${persons.length}人・のべ${apps.length}件の申込</span>
        <button class="btn sm" id="rLock" style="margin-left:auto">🔒 ロックする</button></div>
      <div class="ops-note">申込のたびにメールアドレスで名寄せして蓄積しています（4-5）。
        イベントをまたいだ参加履歴を、期限なく保持します。</div>
      <div style="display:flex;gap:10px;margin:12px 0">
        <input id="rSearch" value="${Util.esc(query)}" placeholder="氏名・カナ・メールで絞り込み"
          style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit">
        <button class="btn" id="rCsv">CSV出力</button>
      </div>
      <div class="card">${shown.length ? `<table class="list">
        <thead><tr><th>氏名</th><th>カナ</th><th>メールアドレス</th>
          <th style="width:80px">参加</th><th style="width:90px">来場</th><th style="width:140px">最終申込</th></tr></thead>
        <tbody>${shown.map(r => rowHtml(r, evById)).join("")}</tbody></table>`
        : `<div class="empty"><div class="big">${persons.length ? "一致する参加者がいません" : "参加者がいません"}</div>
           ${persons.length ? "" : "申込が入ると、ここに蓄積されます。"}</div>`}</div>`;

    const box = el.querySelector("#rSearch");
    box.oninput = () => { query = box.value; render(el); };
    el.querySelector("#rCsv").onclick = () => exportCsv(shown);
    el.querySelector("#rLock").onclick = () => { unlocked = false; query = ""; openId = null; render(el); };
    el.querySelectorAll("tr[data-p]").forEach(tr =>
      tr.onclick = () => { openId = openId === tr.dataset.p ? null : tr.dataset.p; render(el); });
    el.querySelectorAll("[data-goev]").forEach(a =>
      a.onclick = (e) => { e.stopPropagation(); App.openEvent(a.dataset.goev); });
  }

  function rowHtml(r, evById) {
    const { p } = r;
    const main = `<tr class="clickable" data-p="${p.id}">
      <td>${Util.esc(p.name)}</td><td>${Util.esc(p.nameKana)}</td><td>${Util.esc(p.email)}</td>
      <td><b>${r.total}</b></td><td>${r.attended}</td>
      <td>${r.last ? Util.fmtDate(r.last) : "—"}</td></tr>`;
    if (openId !== p.id) return main;
    const label = { applied:"申込済", checkedin:"来場", cancelled:"キャンセル" };
    return main + `<tr class="expand-row"><td colspan="6"><div class="expand-inner">
      <div class="k" style="color:var(--muted);font-size:12px;margin-bottom:8px">参加履歴（${r.mine.length}件）</div>
      ${r.mine.map(a => {
        const ev = evById[a.eventId];
        return `<div class="hist">
          <span class="badge ${a.status==='cancelled'?'draft':a.status==='checkedin'?'published':'phase'}">${label[a.status]}</span>
          <a data-goev="${a.eventId}">${Util.esc(ev ? ev.title : "（削除されたイベント）")}</a>
          <span class="d">${ev && ev.startAt ? Util.fmtDate(ev.startAt) : "日程未定"}</span>
          <span class="d">申込 ${Util.fmtDate(a.appliedAt)}</span></div>`;
      }).join("")}
      ${p.contactConsent ? `<div class="hint" style="margin-top:8px">案内の受け取りに同意済み（${
        p.consentAt ? Util.fmtDate(p.consentAt) : "日時不明"}）。※メール送信機能は持ちません（4-7）</div>` : ""}
    </div></td></tr>`;
  }

  function exportCsv(rows) {
    const header = ["氏名","氏名（カナ）","メールアドレス","有効な申込数","来場回数","キャンセル数","最終申込日","案内の受取同意"];
    const body = rows.map(r => [r.p.name, r.p.nameKana, r.p.email,
      r.total, r.attended, r.cancelled, r.last ? Util.fmtDate(r.last) : "",
      r.p.contactConsent ? "同意" : "未同意"]);
    Util.downloadText("participants.csv", Util.buildCsv([header, ...body]));
    FB.toast("参加者名簿を出力しました");
  }

  return { render, lock };
})();
