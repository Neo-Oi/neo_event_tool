<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>イベント管理システム</title>
<style>
/* ===== [0] スタイル（インライン。青基調・濃紺ヘッダー） ===== */
:root{
  --navy:#12294d; --navy-2:#1b3a6b; --blue:#2563eb; --blue-weak:#e8f0fe;
  --ink:#1f2733; --muted:#6b7686; --line:#e2e6ee; --bg:#f4f6fb; --card:#fff;
  --ok:#137a4b; --warn:#b26a00; --danger:#c02828; --draft:#6b7280;
  --radius:10px; --shadow:0 1px 3px rgba(20,40,80,.08),0 4px 16px rgba(20,40,80,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  color:var(--ink);background:var(--bg);font-size:14px;line-height:1.6;min-width:1024px}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
h1,h2,h3{margin:0}

/* ヘッダー */
header.appbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;
  padding:0 20px;height:56px;position:sticky;top:0;z-index:20}
header.appbar .brand{font-weight:700;font-size:16px;letter-spacing:.02em}
header.appbar .spacer{flex:1}
header.appbar .role{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
header.appbar .role button{background:transparent;border:0;color:#cdd7ea;padding:5px 14px;border-radius:999px;font-size:13px}
header.appbar .role button.on{background:#fff;color:var(--navy);font-weight:600}
header.appbar .user{font-size:13px;color:#cdd7ea;display:flex;align-items:center;gap:8px}
header.appbar .user .avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}

/* タブ */
nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 20px;position:sticky;top:56px;z-index:15}
nav.tabs button{background:transparent;border:0;padding:14px 16px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
body[data-view="participant"] nav.tabs{background:#fbfcff}

/* コンテンツ */
main{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
body[data-view="participant"] main{max-width:640px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-head h2{font-size:20px}
.page-head .sub{color:var(--muted);font-size:13px}

/* カード */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}

/* 指標カード */
.metric{padding:16px 18px}
.metric .label{color:var(--muted);font-size:12px;font-weight:600}
.metric .value{font-size:30px;font-weight:800;line-height:1.2;margin-top:4px}
.metric .value small{font-size:14px;font-weight:600;color:var(--muted)}
.metric.attn .value{color:var(--warn)}

/* テーブル */
table.list{width:100%;border-collapse:collapse;background:#fff}
table.list th,table.list td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.list th{color:var(--muted);font-size:12px;font-weight:700;background:#fafbfe}
table.list tr.grouprow td{background:#f1f4fb;color:var(--muted);font-weight:700;font-size:12px}
table.list tbody tr.clickable:hover{background:#f7f9ff;cursor:pointer}

/* バッジ */
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.7}
.badge.draft{background:#eef0f3;color:var(--draft)}
.badge.published{background:#e6f5ec;color:var(--ok)}
.badge.cancelled{background:#fbe9e9;color:var(--danger)}
.badge.limited{background:#fff2df;color:var(--warn)}
.badge.phase{background:var(--blue-weak);color:var(--blue)}
.badge.phase.ended{background:#eef0f3;color:var(--draft)}
.badge.phase.full{background:#fbe9e9;color:var(--danger)}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--ink);
  padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{border-color:#c7cfdd}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1d54cf}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn.sm{padding:5px 10px;font-size:12px}

/* トグル */
.toggles{display:flex;gap:8px;margin-left:auto}
.toggles button{background:#fff;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:600;font-size:12px}
.toggles button.on{background:var(--blue-weak);border-color:#bcd0fb;color:var(--blue)}

/* 空状態 */
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}

/* 参加者：公開ページ */
.pub .cover{height:200px;border-radius:var(--radius);background:linear-gradient(120deg,#2a4b86,#4f74c0);display:grid;place-items:center;color:#dbe6ff;font-weight:600}
.pub h1{font-size:24px;margin:18px 0 6px}
.pub .kv{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.pub .kv .row{display:flex;gap:10px;padding:5px 0}
.pub .kv .row .k{width:96px;color:var(--muted);flex:none}
.pub .seats{font-size:15px;font-weight:700;margin:10px 0 6px;text-align:center}
.pub .apply{width:100%;justify-content:center;padding:14px;font-size:15px}

/* フィードバック：トースト（右下） */
#toastHost{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{background:#12241f;color:#eafaf0;padding:12px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;
  border-left:3px solid var(--ok);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* フィードバック：エラーバナー（上部・自動で消えない） */
#bannerHost{position:sticky;top:56px;z-index:18}
.banner{background:#fbe9e9;color:var(--danger);border-bottom:1px solid #f0c9c9;padding:10px 20px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
.banner button{margin-left:auto;background:transparent;border:0;color:var(--danger);font-weight:700}

/* 実装区分（設定） */
.impl td .st{font-weight:700}
.impl .done{color:var(--ok)} .impl .partial{color:var(--warn)} .impl .out{color:var(--muted)}

.note{background:#fffbea;border:1px solid #f0e3a8;border-radius:var(--radius);padding:14px 16px;font-size:13px;color:#6a5a12}
.mock-flag{background:#eef2ff;border:1px dashed #b9c6f5;color:#3550b0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;margin-top:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row-actions{display:flex;gap:8px}

/* サブタブ（S-4） */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0}
.subtabs button{background:transparent;border:0;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.subtabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

/* 状況固定表示（F-76） */
.statusbar h2{font-size:19px;margin-bottom:4px}
.statusbar .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.statusbar .meta b{color:var(--ink)}

/* フォーム */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .req{color:var(--danger);font-size:11px;margin-left:4px}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.field input[type=checkbox]{width:auto}
.field textarea{min-height:82px;resize:vertical}
.field .err{color:var(--danger);font-size:12px;margin-top:4px}
.field .invalid{border-color:var(--danger)}
.field .hint{color:var(--muted);font-size:12px;margin-top:4px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ウィザード（S-3） */
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps .step{flex:1;text-align:center;padding:9px 6px;border-radius:8px;background:#eef1f7;color:var(--muted);font-size:12px;font-weight:700;border:1px solid transparent;cursor:default}
.steps .step.clickable{cursor:pointer}
.steps .step.on{background:var(--blue-weak);color:var(--blue);border-color:#bcd0fb}
.steps .step.done{background:#e6f5ec;color:var(--ok)}
.wizard-actions{display:flex;justify-content:space-between;margin-top:22px}

/* 行展開（S-4 申込一覧） */
tr.expand-row td{background:#f7f9ff;padding:0}
.expand-inner{padding:14px 16px}
.expand-inner .kv2{display:flex;gap:28px;margin-bottom:12px;flex-wrap:wrap}
.expand-inner .kv2 .k{color:var(--muted);font-size:12px}

/* モーダル（F-87） */
#modalHost{position:fixed;inset:0;background:rgba(15,25,45,.42);display:none;place-items:center;z-index:50}
#modalHost.on{display:grid}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow);width:420px;max-width:90vw;padding:22px}
.modal h3{font-size:17px;margin-bottom:8px}
.modal p{color:var(--muted);margin:0}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* 申込フロー（S-7/8/9） */
.flow-steps{display:flex;gap:10px;justify-content:center;margin-bottom:20px;color:var(--muted);font-size:13px;font-weight:600}
.flow-steps .on{color:var(--blue)}
.summary{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fafbfe}
.summary .row{display:flex;padding:4px 0}
.summary .row .k{width:120px;color:var(--muted);flex:none}
.consent{display:flex;gap:8px;align-items:flex-start;margin:14px 0}
.copybox{display:flex;gap:8px;margin-top:8px}
.copybox input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit}
details.reveal summary{cursor:pointer;color:var(--blue);font-weight:600;margin-top:14px}
.ticket-item{cursor:pointer}

/* 運営スレッド／Q&A（社内） */
.ops-note{font-size:12px;color:var(--muted);background:#f4f6fb;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;padding:2px}
.bubble{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bubble .who{font-size:12px;color:var(--blue);font-weight:700}
.bubble .when{font-size:11px;color:var(--muted);margin-left:8px}
.bubble .body{white-space:pre-wrap;margin-top:3px}
.bubble .del{float:right;color:var(--muted);border:0;background:transparent;font-size:12px;cursor:pointer;line-height:1}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.composer .crow{display:flex;gap:8px;align-items:center}
.composer .author,.qa-author{width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.composer textarea{min-height:56px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;resize:vertical}
.qa-item{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.qa-item.resolved{background:#f6faf7}
.qa-q{font-weight:600;display:flex;gap:8px;align-items:flex-start}
.qa-meta{font-size:12px;color:var(--muted);margin:4px 0 10px}
.qa-item textarea{width:100%;min-height:56px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;resize:vertical}
.badge.open{background:#fff2df;color:var(--warn)}
.badge.resolved{background:#e6f5ec;color:var(--ok)}

/* 運営タスク（backlog風ボード＋タイムライン / E-2） */
.tk-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.tk-progress{flex:1;min-width:240px}
.tk-stat{font-size:12px;color:var(--muted);margin-bottom:5px}
.tk-stat b{color:var(--ink);font-size:13px}
.tk-stat .over{color:var(--danger);font-weight:700}
.tk-bar{height:8px;background:#e9edf5;border-radius:999px;overflow:hidden}
.tk-bar>span{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .2s}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.todo{background:#9aa4b5} .dot.doing{background:var(--blue)}
.dot.review{background:#0d9488} .dot.done{background:var(--ok)}

/* ボード（カンバン） */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.col{background:#f4f6fb;border:1px solid var(--line);border-radius:10px;padding:8px}
.col.over{background:var(--blue-weak);border-color:#bcd0fb}
.col .ch{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);padding:4px 6px 9px}
.col .ch .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.col .drop{display:flex;flex-direction:column;gap:8px;min-height:64px}
.tcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;
  padding:9px 10px;cursor:grab;box-shadow:0 1px 2px rgba(20,40,80,.05)}
.tcard:hover{border-color:#c7cfdd}
.tcard.dragging{opacity:.4}
.tcard.p-high{border-left-color:var(--danger)}
.tcard.p-normal{border-left-color:var(--blue)}
.tcard.p-low{border-left-color:#c3cbd8}
.tcard .t{font-weight:600;font-size:13px;line-height:1.45;word-break:break-word}
.tcard .m{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted)}
.tcard .who{background:#eef2ff;color:#3550b0;border-radius:999px;padding:1px 8px;font-weight:700}
.tcard .due.over{color:var(--danger);font-weight:700}
.tcard .pri{color:var(--danger);font-weight:700}

/* タイムライン（ガント風。今日線・週末シェード） */
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tl-inner{--dw:28px;--nw:220px;min-width:max-content}
.tl-row{display:flex;background:#fff;border-bottom:1px solid #eef1f7}
.tl-row:last-child{border-bottom:0}
.tl-row.clickable:hover{background:#f7f9ff;cursor:pointer}
.tl-name{width:var(--nw);flex:none;padding:7px 10px;font-size:12px;display:flex;align-items:center;gap:7px;
  border-right:1px solid var(--line);position:sticky;left:0;background:inherit;z-index:2;overflow:hidden}
.tl-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-name .who{margin-left:auto;flex:none;background:#eef2ff;color:#3550b0;border-radius:999px;padding:0 7px;font-size:10px;font-weight:700}
.tl-track{position:relative;display:flex;flex:none}
.tl-c,.tl-d{width:var(--dw);flex:none;border-right:1px solid #f1f4f9}
.tl-c{height:34px}
.tl-c.we,.tl-d.we{background:#f7f9fc}
.tl-c.now,.tl-d.now{background:#fff6e8}
.tl-row.head{background:#fafbfe;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.tl-row.head .tl-name{font-weight:700;color:var(--muted)}
.tl-d{font-size:10px;text-align:center;padding:3px 0;color:var(--muted);line-height:1.3}
.tl-d b{display:block;color:var(--ink);font-size:11px}
.tl-d.now b{color:var(--warn)}
.tl-month{display:flex;background:#f4f6fb;border-bottom:1px solid var(--line)}
.tl-month .mlabel{flex:none;font-size:11px;font-weight:700;color:var(--muted);padding:3px 8px;border-right:1px solid var(--line)}
.tl-bar{position:absolute;top:6px;height:22px;border-radius:5px;font-size:10px;font-weight:700;
  display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap}
.tl-bar.s-todo{background:#ccd4e0;color:#41506a}
.tl-bar.s-doing{background:var(--blue);color:#fff}
.tl-bar.s-review{background:#0d9488;color:#fff}
.tl-bar.s-done{background:var(--ok);color:#fff}
.tl-bar.over{box-shadow:inset 0 0 0 2px var(--danger)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);opacity:.55;z-index:1}
.tl-undated{margin-top:12px;font-size:12px;color:var(--muted)}
.tl-undated .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:3px 11px;margin:4px 6px 0 0;cursor:pointer;font-size:12px;color:var(--ink)}
.tl-undated .chip:hover{border-color:#c7cfdd}

/* タスク編集モーダル */
.modal.wide{width:560px}
.modal.wide .field{margin-bottom:12px;text-align:left}
.modal .modal-actions .spacer{flex:1}
</style>
</head>
<body data-view="organizer">

<header class="appbar">
  <div class="brand">📋 イベント管理システム</div>
  <div class="spacer"></div>
  <div class="role" id="roleSwitch">
    <button data-role="organizer" class="on">主催者ビュー</button>
    <button data-role="participant">参加者ビュー</button>
  </div>
  <div class="user"><span class="avatar">運</span><span>運営担当</span></div>
</header>

<div id="bannerHost"></div>

<nav class="tabs" id="tabs"></nav>

<main id="content"></main>

<div id="toastHost"></div>
<div id="modalHost"></div>

<script>
"use strict";

// ===== [1] ユーティリティ =====
const Util = (() => {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ID・トークンは crypto。Math.random() は使用しない（禁止事項）
  const randHex = (bytes) => {
    const a = new Uint8Array(bytes);
    crypto.getRandomValues(a);
    return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
  };
  const uid = () => randHex(8);
  const newToken = () => randHex(16);

  // 検索用正規化（F-47 / 7-5）: NFKC → 小文字 → カタカナ→ひらがな → 空白除去
  const normalize = (s) => {
    let t = String(s ?? "").normalize("NFKC").toLowerCase();
    t = t.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
    return t.replace(/\s+/g, "");
  };
  // カナ欄の保存: ひらがな→カタカナ（F-52）
  const toKatakana = (s) => String(s ?? "").replace(/[ぁ-ゖ]/g,
    ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));

  // 日時（すべて端末ローカル時刻 / F-46）
  const pad = n => String(n).padStart(2, "0");
  const fmtDateTime = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  };
  // 申込締切は日付のみ。当日 23:59:59 まで受付（F-45）
  const deadlineEnd = (dateStr) => {
    if (!dateStr) return null;
    const d = new Date(dateStr + "T23:59:59");
    return d.getTime();
  };
  // 「今週」は月曜起点（F-60）
  const weekStartMonday = (now) => {
    const d = new Date(now); d.setHours(0,0,0,0);
    const dow = (d.getDay() + 6) % 7; // 月=0
    d.setDate(d.getDate() - dow);
    return d.getTime();
  };
  const daysBetween = (a, b) => Math.floor((b - a) / 86400000);

  // CSV（BOM付きUTF-8・CRLF・値のエスケープ / F-48, F-49）
  const csvCell = (v) => {
    const s = String(v ?? "");
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const buildCsv = (rows) => "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const downloadText = (filename, text, mime = "text/csv") => {
    const blob = new Blob([text], { type: mime + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  };
  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); return true; }
    catch { return false; }
  };

  return { esc, randHex, uid, newToken, normalize, toKatakana,
           fmtDateTime, fmtDate, deadlineEnd, weekStartMonday, daysBetween,
           csvCell, buildCsv, downloadText, copy };
})();


// ===== [2] DB（IndexedDB / Promise ラップ / onupgradeneeded） =====
const DB = (() => {
  const NAME = "neo_event_tool";
  const VERSION = 2; // v2: チケット廃止（ticketTypes除去・定員はevents）＋運営用 messages/tasks 追加
  let _db = null;

  function open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(NAME, VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        // create-if-missing 方式（既存データを保持したままストアを追加できる / 3-5）
        if (!db.objectStoreNames.contains("events")) {
          const s = db.createObjectStore("events", { keyPath: "id" });
          s.createIndex("status", "status");
          s.createIndex("startAt", "startAt");
        }
        // チケット制の廃止: 申込は「申込」に一本化し、定員は events.capacity が持つ（旧 F-61/4-8 を反転）
        if (db.objectStoreNames.contains("ticketTypes")) db.deleteObjectStore("ticketTypes");
        if (!db.objectStoreNames.contains("persons")) {
          const s = db.createObjectStore("persons", { keyPath: "id" });
          s.createIndex("emailKey", "emailKey", { unique: true });
        }
        if (!db.objectStoreNames.contains("applications")) {
          const s = db.createObjectStore("applications", { keyPath: "id" });
          s.createIndex("eventId", "eventId");
          s.createIndex("personId", "personId");
          s.createIndex("token", "token", { unique: true });
          s.createIndex("eventId_status", ["eventId", "status"]);
          // 注意: [eventId, personId] に unique を張らない（キャンセル後の再申込を許可 / 禁止事項）
        }
        if (!db.objectStoreNames.contains("savedTokens")) {
          const s = db.createObjectStore("savedTokens", { keyPath: "token" });
          s.createIndex("savedAt", "savedAt");
        }
        // 運営（社内）向け。同一ブラウザ内で永続。別端末との同期はサーバ導入時まで不可（4-1）
        if (!db.objectStoreNames.contains("messages")) {
          const s = db.createObjectStore("messages", { keyPath: "id" }); // スレッド＋Q&A兼用
          s.createIndex("eventId", "eventId");
          s.createIndex("eventId_channel", ["eventId", "channel"]);
        }
        if (!db.objectStoreNames.contains("tasks")) {
          const s = db.createObjectStore("tasks", { keyPath: "id" }); // 運営タスク（次スライスで可視化）
          s.createIndex("eventId", "eventId");
        }
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }

  const db = () => _db;

  // 単一レコード操作（各呼び出しが独立したトランザクション）
  function _tx(store, mode) { return _db.transaction(store, mode).objectStore(store); }
  function _wrap(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  const put    = (store, rec) => _wrap(_tx(store, "readwrite").put(rec));
  const get    = (store, key) => _wrap(_tx(store, "readonly").get(key));
  const getAll = (store)      => _wrap(_tx(store, "readonly").getAll());
  const remove = (store, key) => _wrap(_tx(store, "readwrite").delete(key));
  const getAllByIndex = (store, index, value) =>
    _wrap(_tx(store, "readonly").index(index).getAll(value));

  // 複数ストアを1トランザクションで原子的に投入（3-5 / 7-1）。
  // トランザクション内では IndexedDB 以外の await を挟まない。
  function bulkPut(entries) {
    return new Promise((resolve, reject) => {
      const stores = [...new Set(entries.map(e => e.store))];
      const tx = _db.transaction(stores, "readwrite");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
      for (const { store, record } of entries) tx.objectStore(store).put(record);
    });
  }

  // DB全削除→再作成（F-32 / A-1 の確認項目4）
  function reset() {
    return new Promise((resolve, reject) => {
      if (_db) { _db.close(); _db = null; }
      const del = indexedDB.deleteDatabase(NAME);
      del.onsuccess = () => open().then(resolve, reject);
      del.onerror = () => reject(del.error);
      del.onblocked = () => reject(new Error("削除がブロックされました（他タブで開いている可能性）"));
    });
  }

  return { open, db, put, get, getAll, remove, getAllByIndex, bulkPut, reset };
})();

// ===== [4] ドメインロジック（時期の都度算出・残席・要対応判定） =====
const Domain = (() => {
  // 明示状態（保存する）
  const STATUS = { draft:"下書き", published:"公開中", cancelled:"中止" };

  // 時期（保存しない。締切日時と現在時刻から都度算出 / F-05）
  // 戻り値: {phase, label} phase ∈ before|open|closed|held|cancelled
  function timing(ev, now = Date.now()) {
    if (ev.status === "cancelled") return { phase:"cancelled", label:"中止" };
    if (ev.endAt && new Date(ev.endAt).getTime() < now) return { phase:"held", label:"開催済" };
    const dl = Util.deadlineEnd(ev.applyDeadline);
    if (dl != null && now > dl) return { phase:"closed", label:"受付終了" };
    return { phase:"open", label:"受付中" };
  }

  // 定員・残席はイベントが持つ（チケット廃止に伴い定員を events.capacity へ集約）
  function capacity(ev) { return ev.capacity || 0; }
  // 有効な申込 = キャンセル済みを除き、チェックイン済みを含む（F-18）
  const isValidApp = a => a.status === "applied" || a.status === "checkedin";
  function usedSeats(apps) { return apps.filter(isValidApp).length; }
  function remaining(ev, apps) { return capacity(ev) - usedSeats(apps); }

  // 申込ボタンの文言（F-08）
  function applyButtonLabel(ev, apps) {
    const t = timing(ev);
    if (t.phase === "cancelled") return { text:"中止されました", disabled:true };
    if (t.phase === "held")      return { text:"終了しました",   disabled:true };
    if (t.phase === "closed")    return { text:"受付終了",       disabled:true };
    if (remaining(ev, apps) <= 0) return { text:"満席",     disabled:true };
    return { text:"申込む", disabled:false };
  }

  // 「定員間近」= 残席3以下 または 定員の10%以下（F-58）
  function nearlyFull(ev, apps) {
    const cap = capacity(ev); if (cap <= 0) return false;
    const rem = remaining(ev, apps);
    return rem > 0 && (rem <= 3 || rem <= cap * 0.1);
  }
  // 「下書き放置」= 下書きで7日以上更新なし（F-59）
  function staleDraft(ev, now = Date.now()) {
    return ev.status === "draft" && ev.updatedAt &&
      Util.daysBetween(new Date(ev.updatedAt).getTime(), now) >= 7;
  }

  // ---- 運営タスク（backlog風 / E-2） ----
  // タスクの状態は「進捗そのもの」なので保存する。イベントの時期（都度算出 / 4-3）とは別軸。
  const TASK_STATUS = { todo:"未対応", doing:"処理中", review:"処理済", done:"完了" };
  const TASK_FLOW = ["todo", "doing", "review", "done"];
  const PRIORITY = { high:"高", normal:"中", low:"低" };

  // 期限超過 = 期限日の 23:59:59 を過ぎ、かつ未着手・対応中（申込締切と同じ扱い / F-45）。
  // 「処理済」は作業自体は終わって確認待ちの状態なので、超過としては数えない。
  function taskOverdue(t, now = Date.now()) {
    if (!t.dueDate || t.status === "done" || t.status === "review") return false;
    return Util.deadlineEnd(t.dueDate) < now;
  }
  function taskSummary(tasks, now = Date.now()) {
    const by = { todo:0, doing:0, review:0, done:0 };
    tasks.forEach(t => { if (by[t.status] != null) by[t.status]++; });
    const total = tasks.length;
    return { by, total, done: by.done,
      rate: total ? Math.round(by.done / total * 100) : 0,
      overdue: tasks.filter(t => taskOverdue(t, now)).length };
  }

  return { STATUS, timing, capacity, isValidApp, usedSeats, remaining,
           applyButtonLabel, nearlyFull, staleDraft,
           TASK_STATUS, TASK_FLOW, PRIORITY, taskOverdue, taskSummary };
})();

const FB = (() => {
  // 完了はトースト、数秒で自動消滅（F-85）
  function toast(msg) {
    const host = document.getElementById("toastHost");
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }
  // システムエラーは上部バナー、閉じるまで残す（F-86）
  function error(msg) {
    const host = document.getElementById("bannerHost");
    host.innerHTML = `<div class="banner"><span>⚠ ${Util.esc(msg)}</span>
      <button id="bannerClose">閉じる</button></div>`;
    document.getElementById("bannerClose").onclick = () => host.innerHTML = "";
  }
  // 取り消せない操作の確認モーダル（F-87）。呼び出しごとにホストの中身を全置換
  function confirmModal({ title, body, okLabel = "実行", danger = false, onOk }) {
    const host = document.getElementById("modalHost");
    host.innerHTML = `<div class="modal">
      <h3>${Util.esc(title)}</h3>
      <p>${body}</p>
      <div class="modal-actions">
        <button class="btn" id="mCancel">キャンセル</button>
        <button class="btn ${danger ? "" : "primary"}" id="mOk"
          ${danger ? 'style="background:var(--danger);border-color:var(--danger);color:#fff"' : ""}>${Util.esc(okLabel)}</button>
      </div></div>`;
    host.classList.add("on");
    const close = () => { host.classList.remove("on"); host.innerHTML = ""; };
    host.querySelector("#mCancel").onclick = close;
    host.querySelector("#mOk").onclick = () => { close(); onOk && onOk(); };
  }
  return { toast, error, confirmModal };
})();

// ===== [7] 主催者：ダッシュボード（S-1 / F-30, F-31） =====
const Dashboard = (() => {
  async function render(el) {
    const now = Date.now();
    const [events, apps] = await Promise.all([
      Repo.events.all(), Repo.applications.all()]);
    const appsByEv = groupBy(apps, "eventId");

    // 指標
    const ongoing = events.filter(e => e.status==="published" &&
      (!e.endAt || new Date(e.endAt).getTime() >= now)).length;
    const drafts = events.filter(e => e.status==="draft").length;
    // 今週の申込数（月曜起点 / 中止イベントの申込は除外 F-40）
    const wk = Util.weekStartMonday(now);
    const cancelledIds = new Set(events.filter(e=>e.status==="cancelled").map(e=>e.id));
    const weekApps = apps.filter(a => Domain.isValidApp(a) && !cancelledIds.has(a.eventId) &&
      new Date(a.appliedAt).getTime() >= wk).length;

    // 要対応リスト（F-31）
    const attn = [];
    for (const e of events) {
      const ap = appsByEv[e.id]||[];
      if (e.status==="published" && e.startAt) {
        const d = Util.daysBetween(now, new Date(e.startAt).getTime());
        if (d===0 || d===1) attn.push({ ev:e, reason:d===0?"本日開催":"明日開催", kind:"date" });
      }
      if (e.status==="published") {
        if (Domain.remaining(e,ap) <= 0) attn.push({ ev:e, reason:"満席", kind:"full" });
        else if (Domain.nearlyFull(e,ap)) attn.push({ ev:e, reason:"定員間近", kind:"full" });
      }
      if (Domain.staleDraft(e, now)) attn.push({ ev:e, reason:"下書きのまま放置", kind:"draft" });
    }

    el.innerHTML = `
      <div class="page-head"><h2>ダッシュボード</h2>
        <span class="sub">運営の全体状況</span></div>
      <div class="grid cols-4">
        ${metric("進行中のイベント", ongoing)}
        ${metric("今週の申込数", weekApps)}
        ${metric("要対応", attn.length, "attn")}
        ${metric("下書き", drafts)}
      </div>
      <h3 style="margin:26px 0 10px;font-size:15px">要対応リスト</h3>
      <div class="card">
        ${attn.length ? `<table class="list"><tbody>${attn.map(a=>`
          <tr class="clickable" data-ev="${a.ev.id}">
            <td style="width:70%">${Util.esc(a.ev.title)}</td>
            <td><span class="badge ${a.kind==='draft'?'draft':a.kind==='full'?'cancelled':'phase'}">${a.reason}</span></td>
            <td style="text-align:right;color:var(--muted)">${a.ev.startAt?Util.fmtDateTime(a.ev.startAt):"日程未定"}</td>
          </tr>`).join("")}</tbody></table>`
          : `<div class="empty"><div class="big">対応が必要な項目はありません</div>
             すべて順調です。</div>`}
      </div>`;

    el.querySelectorAll("tr[data-ev]").forEach(tr =>
      tr.onclick = () => App.openEvent(tr.dataset.ev));
  }
  const metric = (label, value, cls="") =>
    `<div class="card metric ${cls}"><div class="label">${label}</div>
      <div class="value">${value}<small> 件</small></div></div>`;
  return { render };
})();


// ===== [8] 主催者：イベント一覧（S-2 / F-44, F-79） =====
const EventsList = (() => {
  // 時期トグル。初期は 未定+これから ON、終了・中止 OFF（F-44）
  const state = { undated:true, upcoming:true, past:false };

  async function render(el) {
    const now = Date.now();
    const [events, apps] = await Promise.all([
      Repo.events.all(), Repo.applications.all()]);
    const appsByEv = groupBy(apps, "eventId");

    // 区分（F-44 表）
    const groups = { undated:[], upcoming:[], past:[] };
    for (const e of events) {
      const started = e.startAt ? new Date(e.startAt).getTime() : null;
      if (started == null && e.status !== "cancelled") groups.undated.push(e);
      else if (e.status === "cancelled") groups.past.push(e);
      else if (started < now) groups.past.push(e);
      else groups.upcoming.push(e); // 開催日 ≧ 今日（中止を除く）
    }
    groups.undated.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)); // 作成日降順
    groups.upcoming.sort((a,b)=> new Date(a.startAt)-new Date(b.startAt));    // 開催日昇順
    groups.past.sort((a,b)=> new Date(b.startAt||b.createdAt)-new Date(a.startAt||a.createdAt)); // 降順

    const order = [
      ["undated","日程未定"], ["upcoming","これから"], ["past","終了・中止"]
    ].filter(([k]) => state[k]);

    const rowsHtml = order.map(([k,label]) => {
      const arr = groups[k];
      if (!arr.length) return "";
      return `<tr class="grouprow"><td colspan="5">${label}（${arr.length}）</td></tr>` +
        arr.map(e => rowFor(e, appsByEv[e.id]||[])).join("");
    }).join("");

    const anyOn = order.length > 0;
    el.innerHTML = `
      <div class="page-head"><h2>イベント</h2>
        <button class="btn primary" id="newEvent">＋ 新規作成</button>
        <div class="toggles">
          ${toggleBtn("undated","日程未定")}
          ${toggleBtn("upcoming","これから")}
          ${toggleBtn("past","終了・中止")}
        </div></div>
      <div class="card">
        ${anyOn && rowsHtml ? `<table class="list">
          <thead><tr><th>イベント名</th><th>状態</th><th>開催日時</th><th>会場</th><th>申込／定員</th></tr></thead>
          <tbody>${rowsHtml}</tbody></table>`
          : `<div class="empty"><div class="big">表示するイベントがありません</div>
             ${!anyOn?"時期トグルをONにしてください。":"設定画面からシードデータを投入できます。"}</div>`}
      </div>`;

    el.querySelector("#newEvent").onclick = () => App.openCreate();
    el.querySelectorAll(".toggles button").forEach(b =>
      b.onclick = () => { state[b.dataset.k] = !state[b.dataset.k]; render(el); });
    el.querySelectorAll("tr[data-ev]").forEach(tr =>
      tr.onclick = () => App.openEvent(tr.dataset.ev));
  }

  const toggleBtn = (k,label) =>
    `<button class="${state[k]?'on':''}" data-k="${k}">${label}</button>`;

  function rowFor(e, apps) {
    const cap = Domain.capacity(e), used = Domain.usedSeats(apps);
    const badges = [`<span class="badge ${e.status}">${Domain.STATUS[e.status]}</span>`];
    if (e.visibility === "limited" && e.status !== "cancelled")
      badges.push(`<span class="badge limited">限定公開</span>`);
    return `<tr class="clickable" data-ev="${e.id}">
      <td>${Util.esc(e.title)}</td>
      <td>${badges.join(" ")}</td>
      <td>${e.startAt ? Util.fmtDateTime(e.startAt) : '<span style="color:var(--muted)">日程未定</span>'}</td>
      <td>${Util.esc(e.venueName) || '<span style="color:var(--muted)">—</span>'}</td>
      <td>${used}／${cap||"—"}</td>
    </tr>`;
  }
  return { render };
})();


// ===== [9] 主催者：イベント詳細 S-4（固定表示＋サブタブ 申込/告知/概要編集） =====
const EventDetail = (() => {
  const STATUS_LABEL = { applied:"申込済", checkedin:"チェックイン済", cancelled:"キャンセル" };
  const STATUS_CLASS = { applied:"phase", checkedin:"published", cancelled:"draft" };
  let ctx = null;      // { ev, apps, _persons, tasks, el }
  let tab = "apply";   // 初期タブは申込（F-75）
  let expandedId = null;

  function paint() {
    const { ev, apps, el } = ctx;
    const t = Domain.timing(ev);
    const cap = Domain.capacity(ev), used = Domain.usedSeats(apps), rem = Domain.remaining(ev, apps);
    el.innerHTML = `
      <div class="page-head"><button class="btn ghost" id="back">← 一覧へ</button></div>
      <div class="card pad statusbar">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
          <h2>${Util.esc(ev.title)}</h2>
          <span class="badge ${ev.status}">${Domain.STATUS[ev.status]}</span>
          <span class="badge phase ${t.phase==='held'?'ended':''}">${t.label}</span>
          ${ev.visibility==="limited"&&ev.status!=="cancelled"?'<span class="badge limited">限定公開</span>':""}
        </div>
        <div class="meta">
          <span>🗓 <b>${ev.startAt?Util.fmtDateTime(ev.startAt):"日程未定"}</b></span>
          <span>📍 <b>${Util.esc(ev.venueName)||"—"}</b></span>
          <span>👥 申込 <b>${used}</b>／${cap||"—"}</span>
          <span>🪑 残席 <b>${cap?rem:"—"}</b></span>
          <span id="taskChip">${taskChip()}</span>
        </div>
      </div>
      <div class="subtabs" id="subtabs">
        <button data-tab="apply" class="${tab==='apply'?'on':''}">申込</button>
        <button data-tab="thread" class="${tab==='thread'?'on':''}">運営スレッド</button>
        <button data-tab="qa" class="${tab==='qa'?'on':''}">運営Q&amp;A</button>
        <button data-tab="tasks" class="${tab==='tasks'?'on':''}">運営タスク</button>
        <button data-tab="promo" class="${tab==='promo'?'on':''}">告知</button>
        <button data-tab="edit" class="${tab==='edit'?'on':''}">概要・編集</button>
      </div>
      <div id="subpane"></div>`;

    el.querySelector("#back").onclick = () => App.go("events");
    el.querySelectorAll("#subtabs button").forEach(b =>
      b.onclick = () => { tab = b.dataset.tab; expandedId = null; paint(); });

    const pane = el.querySelector("#subpane");
    if (tab === "apply") renderApply(pane);
    else if (tab === "thread") Ops.renderThread(pane, ev.id);
    else if (tab === "qa") Ops.renderQA(pane, ev.id);
    else if (tab === "tasks") Tasks.render(pane, ev.id, refreshTaskChip);
    else if (tab === "promo") renderPromo(pane);
    else renderEdit(pane);
  }

  // タスク進捗は固定表示にも出す（F-76 の状況表示にタスクを1件加える）
  function taskChip() {
    const s = Domain.taskSummary(ctx.tasks || []);
    if (!s.total) return "";
    return `✅ タスク <b>${s.done}/${s.total}</b>` +
      (s.overdue ? ` <span style="color:var(--danger);font-weight:700">超過${s.overdue}</span>` : "");
  }
  // Tasks 側の更新後に固定表示だけを差し替える（サブペインは再描画しない）
  async function refreshTaskChip() {
    ctx.tasks = await Repo.tasks.byEvent(ctx.ev.id);
    const chip = ctx.el.querySelector("#taskChip");
    if (chip) chip.innerHTML = taskChip();
  }

  // ---- 申込タブ（一覧・検索・チェックイン・CSV / F-22〜F-28, F-77, F-78） ----
  function renderApply(pane) {
    pane.innerHTML = `
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <input id="searchBox" placeholder="氏名・カナ・メールで絞り込み" style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit">
        <button class="btn" id="csvBtn">CSV出力</button>
      </div>
      <div class="card"><table class="list">
        <thead><tr><th>氏名</th><th>カナ</th><th>状態</th><th style="width:120px">操作</th></tr></thead>
        <tbody id="appRows"></tbody>
      </table></div>
      <div class="mock-flag">チェックイン／取消・内容修正・キャンセルは表示のみのモック（保存は C-3 で実装）。検索・CSV出力は実データで動作します。</div>`;

    const box = pane.querySelector("#searchBox");
    box.oninput = () => paintRows(pane, box.value);
    paintRows(pane, "");

    pane.querySelector("#csvBtn").onclick = () => exportCsv();
  }

  function paintRows(pane, query) {
    const { apps } = ctx;
    const q = Util.normalize(query);
    const rows = apps.filter(a => !q || a.searchText.includes(q));
    const persons = ctx._persons || {};
    const tbody = pane.querySelector("#appRows");
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty">${apps.length ? "一致する申込がありません" : "申込がありません"}</div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(a => {
      const p = persons[a.personId] || {};
      const checkedin = a.status === "checkedin";
      const opBtn = a.status === "cancelled" ? "—"
        : `<button class="btn sm ${checkedin?'':'primary'}" data-checkin="${a.id}">${checkedin?"受付取消":"チェックイン"}</button>`;
      const main = `<tr class="clickable" data-row="${a.id}">
        <td>${Util.esc(p.name||"—")}</td>
        <td>${Util.esc(p.nameKana||"—")}</td>
        <td><span class="badge ${STATUS_CLASS[a.status]}">${STATUS_LABEL[a.status]}</span></td>
        <td>${opBtn}</td></tr>`;
      const exp = expandedId === a.id ? `<tr class="expand-row"><td colspan="4"><div class="expand-inner">
        <div class="kv2">
          <div><div class="k">メールアドレス</div>${Util.esc(p.email||"—")}</div>
          <div><div class="k">申込日時</div>${Util.fmtDateTime(a.appliedAt)}</div>
          <div><div class="k">チェックイン時刻</div>${a.checkinAt?Util.fmtDateTime(a.checkinAt):"—"}</div>
        </div>
        <div class="row-actions">
          <button class="btn sm" data-edit="${a.id}">内容を修正</button>
          <button class="btn sm" data-cancel="${a.id}" style="color:var(--danger)">申込をキャンセル</button>
        </div></div></td></tr>` : "";
      return main + exp;
    }).join("");

    // 行クリックで展開（操作ボタンのクリックは伝播させない）
    tbody.querySelectorAll("tr[data-row]").forEach(tr =>
      tr.onclick = () => { expandedId = expandedId === tr.dataset.row ? null : tr.dataset.row; paintRows(pane, query); });
    tbody.querySelectorAll("[data-checkin]").forEach(b =>
      b.onclick = (e) => { e.stopPropagation(); FB.toast("チェックインはモックです（保存は C-3 で実装）"); });
    tbody.querySelectorAll("[data-edit]").forEach(b =>
      b.onclick = (e) => { e.stopPropagation(); FB.toast("内容修正はモックです（保存は C-3 で実装）"); });
    tbody.querySelectorAll("[data-cancel]").forEach(b =>
      b.onclick = (e) => { e.stopPropagation(); FB.toast("キャンセルはモックです（保存は C-3 で実装）"); });
  }

  function exportCsv() {
    const { ev, apps } = ctx;
    const persons = ctx._persons || {};
    const header = ["申込番号","氏名","氏名（カナ）","メールアドレス","状態","申込日時","チェックイン時刻"];
    const body = apps.map(a => {
      const p = persons[a.personId] || {};
      return [a.id, p.name||"", p.nameKana||"", p.email||"",
        STATUS_LABEL[a.status], Util.fmtDateTime(a.appliedAt), a.checkinAt?Util.fmtDateTime(a.checkinAt):""];
    });
    Util.downloadText(`applications_${ev.id}.csv`, Util.buildCsv([header, ...body]));
    FB.toast("CSVを出力しました");
  }

  // ---- 告知タブ（共有URL・投稿文・X/LINE / F-10〜F-15） ----
  function renderPromo(pane) {
    const { ev } = ctx;
    const url = shareUrl(ev);
    const text = postText(ev, url);
    pane.innerHTML = `
      <div class="card pad">
        <h3 style="font-size:15px;margin-bottom:8px">共有URL</h3>
        <div class="copybox"><input id="urlBox" readonly value="${Util.esc(url)}">
          <button class="btn" id="copyUrl">コピー</button></div>
      </div>
      <div class="card pad" style="margin-top:14px">
        <h3 style="font-size:15px;margin-bottom:8px">投稿文</h3>
        <div class="field"><textarea id="postBox" style="min-height:120px">${Util.esc(text)}</textarea></div>
        <div class="row-actions">
          <button class="btn primary" id="copyPost">投稿文をコピー</button>
          <a class="btn" id="xShare" target="_blank" rel="noopener">Xで共有</a>
          <a class="btn" id="lineShare" target="_blank" rel="noopener">LINEで共有</a>

      </div>`;
    pane.querySelector("#copyUrl").onclick = async () =>
      FB.toast(await Util.copy(url) ? "URLをコピーしました" : "コピーできませんでした");
    pane.querySelector("#copyPost").onclick = async () =>
      FB.toast(await Util.copy(pane.querySelector("#postBox").value) ? "投稿文をコピーしました" : "コピーできませんでした");
    const setLinks = () => {
      const body = pane.querySelector("#postBox").value;
      pane.querySelector("#xShare").href =
        `https://twitter.com/intent/tweet?text=${encodeURIComponent(body)}&url=${encodeURIComponent(url)}&hashtags=${encodeURIComponent("社内イベント")}`;
      pane.querySelector("#lineShare").href =
        `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}`; // URLのみ（F-15）
    };

    setLinks();
  }
  const shareUrl = (ev) => `${location.origin}${location.pathname}?event=${ev.id}`;
  const postText = (ev, url) =>
`【${ev.title}】を開催します！
🗓 ${ev.startAt ? Util.fmtDateTime(ev.startAt) : "日程調整中"}
📍 ${ev.venueName || "会場調整中"}
参加申込はこちら👇
${url}`;

  // ---- 概要・編集タブ（編集導線＋状態遷移 / F-04, F-37, F-38, F-87） ----
  function renderEdit(pane) {
    const { ev } = ctx;
    const canPublish = ev.status === "draft";
    const canCancel = ev.status === "published";
    const canDelete = ev.status === "draft"; // 削除は下書きのみ（F-01）
    pane.innerHTML = `
      <div class="card pad">
        <div class="summary">
          <div class="row"><span class="k">説明</span><span style="white-space:pre-wrap">${Util.esc(ev.description)||"—"}</span></div>
          <div class="row"><span class="k">対象者</span><span>${Util.esc(ev.targetAudience)||"—"}</span></div>
          <div class="row"><span class="k">住所</span><span>${Util.esc(ev.venueAddress)||"—"}</span></div>
          <div class="row"><span class="k">申込締切</span><span>${ev.applyDeadline?Util.fmtDate(ev.applyDeadline):"—"}</span></div>
          <div class="row"><span class="k">公開範囲</span><span>${ev.visibility==="limited"?"限定公開":"一般公開"}</span></div>
          <div class="row"><span class="k">問い合わせ先</span><span>${Util.esc(ev.contactInfo)||"—"}</span></div>
        </div>
        <div class="row-actions" style="margin-top:16px">
          <button class="btn" id="editBtn">✎ 編集する</button>
          ${canPublish?'<button class="btn primary" id="publishBtn">公開する</button>':""}
          ${canCancel?'<button class="btn" id="cancelBtn" style="color:var(--danger)">中止する</button>':""}
          ${canDelete?'<button class="btn" id="deleteBtn" style="color:var(--danger)">削除</button>':""}
        </div>
      </div>
      <div class="mock-flag">編集の保存・公開・中止・削除はモックです（状態遷移の永続化は C-1 で実装）。一方向遷移（下書き→公開→中止）と確認モーダルは実装済み。</div>`;
    pane.querySelector("#editBtn").onclick = () => App.openCreate(ev.id);
    const pub = pane.querySelector("#publishBtn");
    if (pub) pub.onclick = () => FB.confirmModal({
      title:"イベントを公開しますか？", okLabel:"公開する",
      body:"公開すると下書きには戻せません。この操作は取り消せません。",
      onOk:() => FB.toast("公開はモックです（保存は C-1 で実装）") });
    const can = pane.querySelector("#cancelBtn");
    if (can) can.onclick = () => FB.confirmModal({
      title:"イベントを中止しますか？", okLabel:"中止する", danger:true,

      onOk:() => FB.toast("中止はモックです（保存は C-1 で実装）") });
    const del = pane.querySelector("#deleteBtn");
    if (del) del.onclick = () => FB.confirmModal({

      body:"この下書きを削除します。",
      onOk:() => FB.toast("削除はモックです（保存は C-1 で実装）") });

  // persons をまとめて読んでおく（申込一覧の氏名・メール表示に必要）
  async function render(el, eventId) {
    const [ev, apps, personsArr, tasks] = await Promise.all([
      Repo.events.get(eventId),
      Repo.applications.byEvent(eventId),
      Repo.persons.all(),
      Repo.tasks.byEvent(eventId)]);
    if (!ev) { el.innerHTML = `<div class="empty"><div class="big">イベントが見つかりません</div></div>`; return; }

    ctx = { ev, apps, _persons, tasks, el };
    expandedId = null; tab = "apply";
    paint();

  return { render };
})();


// ===== [9b] 主催者：運営スレッド／運営Q&A（社内・実データで永続 / messages ストア） =====
/* 設計は複数人での共有管理を想定するが、サーバなし＝単一ブラウザのため実態は一人（同一
   ブラウザ）で管理する。別端末との同期はサーバ導入時まで不可（引き継ぎ書 4-1）。 */
const Ops = (() => {
  let lastAuthor = "運営"; // 直近の投稿者名を保持（セッション内）

  // ---- 運営スレッド（チャット） ----
  async function renderThread(pane, eventId) {
    const all = await Repo.messages.byEvent(eventId);
    const msgs = all.filter(m => m.channel === "thread")
      .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    pane.innerHTML = `
      <div class="ops-note">運営メンバー間のチャットです。この端末内に保存されます（別端末との同期はサーバ導入まで不可 / 4-1）。</div>
      <div class="chat" id="chatList">
        ${msgs.length ? msgs.map(bubble).join("")
          : `<div class="empty">まだ投稿がありません。最初のメッセージを送ってみましょう。</div>`}
      </div>
      <div class="composer">
        <div class="crow"><input class="author" id="opAuthor" value="${Util.esc(lastAuthor)}" placeholder="名前"></div>
        <textarea id="opBody" placeholder="メッセージを入力"></textarea>
        <div><button class="btn primary" id="opSend">送信</button></div>
      </div>`;
    const list = pane.querySelector("#chatList");
    list.scrollTop = list.scrollHeight;
    pane.querySelector("#opSend").onclick = async () => {
      const author = pane.querySelector("#opAuthor").value.trim() || "運営";
      const body = pane.querySelector("#opBody").value.trim();
      if (!body) { FB.toast("メッセージを入力してください"); return; }
      lastAuthor = author;
      await Repo.messages.put({ id:Util.uid(), eventId, channel:"thread",
        author, body, createdAt:new Date().toISOString() });
      renderThread(pane, eventId);
    };
    pane.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      await Repo.messages.remove(b.dataset.del); renderThread(pane, eventId);
    });
  }
  const bubble = (m) => `<div class="bubble">
    <button class="del" data-del="${m.id}" title="削除">✕</button>
    <span class="who">${Util.esc(m.author||"運営")}</span><span class="when">${Util.fmtDateTime(m.createdAt)}</span>
    <div class="body">${Util.esc(m.body)}</div></div>`;

  // ---- 運営Q&A（疑問の登録・解消。例:「この荷物は地下か1階か」） ----
  async function renderQA(pane, eventId) {
    const all = await Repo.messages.byEvent(eventId);
    const qas = all.filter(m => m.channel === "qa")
      .sort((a,b) => (a.resolved?1:0)-(b.resolved?1:0) || new Date(b.createdAt)-new Date(a.createdAt));
    pane.innerHTML = `
      <div class="ops-note">運営内の疑問を登録して解消します。この端末内に保存されます（4-1）。</div>
      <div class="card pad" style="margin-bottom:14px">
        <div class="field"><label>新しい疑問</label>
          <textarea id="qaBody" placeholder="例: 受付の荷物は地下と1階のどちらに運ぶ？"></textarea></div>
        <div class="crow" style="display:flex;gap:8px;align-items:center">
          <input class="qa-author" id="qaAuthor" value="${Util.esc(lastAuthor)}" placeholder="名前">
          <button class="btn primary" id="qaAdd">登録</button></div>
      </div>
      <div id="qaList">${qas.length ? qas.map(qaCard).join("")
        : `<div class="empty">登録された疑問はありません。</div>`}</div>`;

    pane.querySelector("#qaAdd").onclick = async () => {
      const author = pane.querySelector("#qaAuthor").value.trim() || "運営";
      const body = pane.querySelector("#qaBody").value.trim();
      if (!body) { FB.toast("疑問の内容を入力してください"); return; }
      lastAuthor = author;
      await Repo.messages.put({ id:Util.uid(), eventId, channel:"qa", author, body,
        answer:"", resolved:false, createdAt:new Date().toISOString(), resolvedAt:null });
      renderQA(pane, eventId);
    };
    qas.forEach(q => {
      const bodyOf = () => { const ta = pane.querySelector(`[data-ansbody="${q.id}"]`); return ta ? ta.value : q.answer; };
      const ans = pane.querySelector(`[data-ans="${q.id}"]`);
      if (ans) ans.onclick = async () => { q.answer = bodyOf(); await Repo.messages.put(q); FB.toast("回答を保存しました"); renderQA(pane, eventId); };
      const tog = pane.querySelector(`[data-toggle="${q.id}"]`);
      if (tog) tog.onclick = async () => {
        q.answer = bodyOf();
        q.resolved = !q.resolved; q.resolvedAt = q.resolved ? new Date().toISOString() : null;
        await Repo.messages.put(q); renderQA(pane, eventId);
      };
      const del = pane.querySelector(`[data-qadel="${q.id}"]`);
      if (del) del.onclick = () => FB.confirmModal({ title:"この疑問を削除しますか？",
        okLabel:"削除する", danger:true, body:"登録された疑問と回答を削除します。",
        onOk: async () => { await Repo.messages.remove(q.id); renderQA(pane, eventId); } });
    });
  }
  const qaCard = (q) => `<div class="qa-item ${q.resolved?'resolved':''}">
    <div class="qa-q"><span class="badge ${q.resolved?'resolved':'open'}">${q.resolved?'解決済み':'未解決'}</span>
      <span>${Util.esc(q.body)}</span></div>
    <div class="qa-meta">${Util.esc(q.author||"運営")}・${Util.fmtDateTime(q.createdAt)}</div>
    <textarea data-ansbody="${q.id}" placeholder="回答・対応内容を入力">${Util.esc(q.answer||"")}</textarea>
    <div class="row-actions" style="margin-top:8px">
      <button class="btn sm primary" data-ans="${q.id}">回答を保存</button>
      <button class="btn sm" data-toggle="${q.id}">${q.resolved?'未解決に戻す':'解決にする'}</button>
      <button class="btn sm" data-qadel="${q.id}" style="color:var(--danger)">削除</button>
    </div></div>`;

  return { renderThread, renderQA };
})();


// ===== [9c] 主催者：運営タスク（backlog風ボード＋タイムライン / E-2。tasks ストア） =====
/* 状態は 未対応／処理中／処理済／完了 の4段（Backlog に倣う）。ドラッグで状態と並び順が
   変わり、そのまま IndexedDB に保存される。並び順は order（10刻み）で保持。 */
const Tasks = (() => {
  let ctx = null;            // { pane, eventId, tasks, onChange }
  let view = "board";        // board | timeline（サブタブを離れても保持）
  let lastAssignee = "";     // 直近の担当者名（セッション内）

  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) ||
    new Date(a.createdAt) - new Date(b.createdAt);
  const pad2 = n => String(n).padStart(2, "0");
  // 日付は "YYYY-MM-DD" の文字列のまま扱う（Date 化による時差ずれを避ける）
  const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const fmtDay = (s) => s ? s.slice(5).replace("-", "/") : "";
  const todayKey = () => dayKey(new Date());

  async function render(pane, eventId, onChange) {
    const tasks = await Repo.tasks.byEvent(eventId);
    ctx = { pane, eventId, tasks: tasks.sort(byOrder), onChange };
    paint();
  }
  async function reload() {
    const tasks = await Repo.tasks.byEvent(ctx.eventId);
    ctx.tasks = tasks.sort(byOrder);
    paint();
    ctx.onChange && ctx.onChange();   // S-4 の固定表示（タスク進捗）を追随させる
  }

  function paint() {
    const { pane, tasks } = ctx;
    const s = Domain.taskSummary(tasks);
    pane.innerHTML = `
      <div class="ops-note">イベント運営のタスクを管理します。この端末内に保存されます（別端末との同期はサーバ導入まで不可 / 4-1）。</div>
      <div class="tk-head">
        <div class="tk-progress">
          <div class="tk-stat">進捗 <b>${s.done}/${s.total}</b>（${s.rate}%）${
            s.overdue ? ` ・ <span class="over">期限超過 ${s.overdue}件</span>` : ""}</div>
          <div class="tk-bar"><span style="width:${s.rate}%"></span></div>
        </div>
        <div class="toggles">
          <button data-view="board" class="${view==="board"?"on":""}">ボード</button>
          <button data-view="timeline" class="${view==="timeline"?"on":""}">タイムライン</button>
        </div>
        <button class="btn primary" id="tkAdd">＋ タスクを追加</button>
      </div>
      <div id="tkBody"></div>`;

    pane.querySelectorAll(".tk-head [data-view]").forEach(b =>
      b.onclick = () => { view = b.dataset.view; paint(); });
    pane.querySelector("#tkAdd").onclick = () => openEditor(null);

    const body = pane.querySelector("#tkBody");
    if (!tasks.length) {
      body.innerHTML = `<div class="empty"><div class="big">タスクがありません</div>
        「＋ タスクを追加」から、備品手配・会場設営などの準備タスクを登録できます。</div>`;
      return;
    }
    if (view === "board") renderBoard(body); else renderTimeline(body);
  }

  // ---- ボード（カンバン。ドラッグで状態変更・並べ替え） ----
  function renderBoard(host) {
    const { tasks } = ctx;
    host.innerHTML = `
      <div class="board">${Domain.TASK_FLOW.map(st => {
        const list = tasks.filter(t => t.status === st);
        return `<div class="col" data-col="${st}">
          <div class="ch"><span class="dot ${st}"></span>${Domain.TASK_STATUS[st]}
            <span class="cnt">${list.length}</span></div>
          <div class="drop" data-drop="${st}">${list.map(card).join("")}</div>
        </div>`;
      }).join("")}</div>
      <div class="ops-note" style="margin:14px 0 0">カードをドラッグすると状態と並び順が変わり、そのまま保存されます。カードをクリックすると編集できます。</div>`;
    wireBoard(host);
  }

  const card = (t) => {
    const over = Domain.taskOverdue(t);
    return `<div class="tcard p-${t.priority || "normal"}" draggable="true" data-id="${t.id}">
      <div class="t">${Util.esc(t.title)}</div>
      <div class="m">
        ${t.assignee ? `<span class="who">${Util.esc(t.assignee)}</span>` : ""}
        ${t.dueDate ? `<span class="due ${over?"over":""}">${over?"⚠":"🗓"} ${fmtDay(t.dueDate)}</span>` : ""}
        ${t.priority === "high" ? `<span class="pri">優先度 高</span>` : ""}
      </div></div>`;
  };

  function wireBoard(host) {
    host.querySelectorAll(".tcard").forEach(c => {
      c.ondragstart = (e) => {
        c.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", c.dataset.id);
      };
      c.ondragend = () => {
        c.classList.remove("dragging");
        host.querySelectorAll(".col").forEach(x => x.classList.remove("over"));
      };
      c.onclick = () => openEditor(ctx.tasks.find(t => t.id === c.dataset.id));
    });
    host.querySelectorAll("[data-drop]").forEach(zone => {
      zone.ondragover = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        zone.closest(".col").classList.add("over");
        // ドラッグ中は「掴んでいる要素そのもの」を移動する。innerHTML の全置換は行わない
        // （置換すると掴んだ参照が親を失い、以後の操作が画面に反映されなくなる）
        const dragging = host.querySelector(".tcard.dragging");
        if (!dragging) return;
        const after = afterElement(zone, e.clientY);
        if (after == null) zone.appendChild(dragging);
        else if (after !== dragging) zone.insertBefore(dragging, after);
      };
      zone.ondragleave = (e) => {
        if (!zone.contains(e.relatedTarget)) zone.closest(".col").classList.remove("over");
      };
      zone.ondrop = (e) => { e.preventDefault(); commit(host); };
    });
  }

  // カーソル位置より下にある最初のカード（そこへ挿入する）
  const afterElement = (zone, y) =>
    [...zone.querySelectorAll(".tcard:not(.dragging)")].find(el => {
      const r = el.getBoundingClientRect();
      return y < r.top + r.height / 2;
    }) || null;

  // DOM の並びを読み取り、変化したレコードだけを1トランザクションで保存（7-1）
  async function commit(host) {
    const map = {}; ctx.tasks.forEach(t => map[t.id] = t);
    const now = new Date().toISOString();
    const entries = [];
    let statusChanged = false;
    host.querySelectorAll("[data-drop]").forEach(zone => {
      const status = zone.dataset.drop;
      [...zone.querySelectorAll(".tcard")].forEach((el, i) => {
        const t = map[el.dataset.id];
        if (!t) return;
        const order = i * 10;
        if (t.status === status && t.order === order) return;
        if (t.status !== status) statusChanged = true;
        entries.push({ store:"tasks", record: { ...t, status, order, updatedAt: now,
          doneAt: status === "done" ? (t.doneAt || now) : null } });
      });
    });
    if (!entries.length) return;
    try {
      await Repo.bulkPut(entries);
      await reload();
      if (statusChanged) FB.toast("タスクの状態を更新しました");
    } catch (e) { FB.error("タスクの保存に失敗: " + e.message); }
  }

  // ---- タイムライン（ガント風。今日線・週末シェード） ----
  function renderTimeline(host) {
    const { tasks } = ctx;
    const dated = tasks.filter(t => t.startDate || t.dueDate);
    const undated = tasks.filter(t => !t.startDate && !t.dueDate);
    if (!dated.length) {
      host.innerHTML = `<div class="empty"><div class="big">日付が設定されたタスクがありません</div>
        タスクに開始日・期限日を設定すると、ここに表示されます。</div>` + undatedHtml(undated);
      wireRows(host);
      return;
    }
    // 範囲は「全タスクの最小開始日〜最大期限日」に今日を含め、前後1日の余白を付ける
    const spans = dated.map(t => {
      const a = t.startDate || t.dueDate, b = t.dueDate || t.startDate;
      return { t, s: a <= b ? a : b, e: a <= b ? b : a };
    });
    const tk = todayKey();
    const minKey = spans.map(x => x.s).concat(tk).sort()[0];
    const maxKey = spans.map(x => x.e).concat(tk).sort().pop();
    const first = shiftDay(minKey, -1);
    const total = Math.min(diffDays(first, maxKey) + 2, 180);  // 上限180日

    const cells = [];
    const index = {};
    for (let i = 0, k = first; i < total; i++, k = shiftDay(k, 1)) {
      const d = new Date(k + "T00:00:00");
      cells.push({ key:k, d, we: d.getDay() === 0 || d.getDay() === 6, now: k === tk });
      index[k] = i;
    }
    // 範囲外（180日超）に落ちたぶんは端に寄せる
    const at = (k) => index[k] != null ? index[k] : (k < first ? 0 : total - 1);

    const WD = ["日","月","火","水","木","金","土"];
    const months = [];
    cells.forEach(c => {
      const label = `${c.d.getFullYear()}年${c.d.getMonth()+1}月`;
      const last = months[months.length-1];
      if (last && last.label === label) last.n++; else months.push({ label, n:1 });
    });
    const nowLeft = index[tk] != null
      ? `<div class="tl-today" style="left:calc(var(--dw) * ${index[tk] + 0.5})"></div>` : "";
    const dayCells = cells.map(c =>
      `<div class="tl-c ${c.we?"we":""} ${c.now?"now":""}"></div>`).join("");

    host.innerHTML = `
      <div class="tl"><div class="tl-inner">
        <div class="tl-month">
          <div class="mlabel" style="width:var(--nw)">期間</div>
          ${months.map(m => `<div class="mlabel" style="width:calc(var(--dw) * ${m.n})">${m.label}</div>`).join("")}
        </div>
        <div class="tl-row head">
          <div class="tl-name">タスク（${dated.length}件）</div>
          <div class="tl-track">${cells.map(c =>
            `<div class="tl-d ${c.we?"we":""} ${c.now?"now":""}"><b>${c.d.getDate()}</b>${WD[c.d.getDay()]}</div>`).join("")}</div>
        </div>
        ${spans.map(({ t, s, e }) => {
          const i0 = at(s), i1 = at(e), over = Domain.taskOverdue(t);
          const len = Math.max(i1 - i0 + 1, 1);
          const label = len >= 3 ? `${fmtDay(s)}〜${fmtDay(e)}` : "";
          return `<div class="tl-row clickable" data-id="${t.id}">
            <div class="tl-name"><span class="dot ${t.status}"></span>
              <span class="nm" title="${Util.esc(t.title)}">${Util.esc(t.title)}</span>
              ${t.assignee ? `<span class="who">${Util.esc(t.assignee)}</span>` : ""}</div>
            <div class="tl-track">${dayCells}${nowLeft}
              <div class="tl-bar s-${t.status} ${over?"over":""}"
                style="left:calc(var(--dw) * ${i0});width:calc(var(--dw) * ${len} - 3px)"
                title="${Util.esc(t.title)} / ${Domain.TASK_STATUS[t.status]} / ${s}〜${e}">${label}</div>
            </div></div>`;
        }).join("")}
      </div></div>
      ${undatedHtml(undated)}`;
    wireRows(host);
  }

  const undatedHtml = (list) => !list.length ? "" :
    `<div class="tl-undated">日付未設定（${list.length}件）:
      ${list.map(t => `<span class="chip" data-id="${t.id}">
        <span class="dot ${t.status}"></span>${Util.esc(t.title)}</span>`).join("")}</div>`;

  function wireRows(host) {
    host.querySelectorAll("[data-id]").forEach(el =>
      el.onclick = () => openEditor(ctx.tasks.find(t => t.id === el.dataset.id)));
  }

  // 日付文字列の加減算（Date のローカル日付で行い、時差・夏時間の影響を受けない）
  function shiftDay(key, n) {
    const d = new Date(key + "T00:00:00");
    d.setDate(d.getDate() + n);
    return dayKey(d);
  }
  const diffDays = (a, b) =>
    Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

  // ---- 追加・編集モーダル ----
  function openEditor(task) {
    const isNew = !task;
    const t = task || { title:"", detail:"", assignee:lastAssignee, status:"todo",
      priority:"normal", startDate:"", dueDate:"" };
    const opts = (obj, cur) => Object.entries(obj).map(([k, v]) =>
      `<option value="${k}"${cur === k ? " selected" : ""}>${v}</option>`).join("");

    const host = document.getElementById("modalHost");
    host.innerHTML = `<div class="modal wide">
      <h3>${isNew ? "タスクを追加" : "タスクを編集"}</h3>
      <div class="field" style="margin-top:14px"><label>タイトル<span class="req">必須</span></label>
        <input id="tkTitle" value="${Util.esc(t.title)}" placeholder="例: 会場の備品を手配する"></div>
      <div class="form-2col">
        <div class="field"><label>状態</label>
          <select id="tkStatus">${opts(Domain.TASK_STATUS, t.status)}</select></div>
        <div class="field"><label>優先度</label>
          <select id="tkPriority">${opts(Domain.PRIORITY, t.priority || "normal")}</select></div>
        <div class="field"><label>開始日</label>
          <input type="date" id="tkStart" value="${t.startDate || ""}"></div>
        <div class="field"><label>期限日</label>
          <input type="date" id="tkDue" value="${t.dueDate || ""}"></div>
      </div>
      <div class="field"><label>担当者</label>
        <input id="tkAssignee" value="${Util.esc(t.assignee || "")}" placeholder="例: 運営A"></div>
      <div class="field"><label>メモ</label>
        <textarea id="tkDetail" placeholder="補足・手順など">${Util.esc(t.detail || "")}</textarea></div>
      <div class="err" id="tkErr" style="color:var(--danger);font-size:12px;min-height:18px"></div>
      <div class="modal-actions">
        ${isNew ? "" : '<button class="btn" id="tkDel" style="color:var(--danger)">削除</button>'}
        <div class="spacer"></div>
        <button class="btn" id="tkCancel">キャンセル</button>
        <button class="btn primary" id="tkSave">保存</button>
      </div></div>`;
    host.classList.add("on");

    const q = (sel) => host.querySelector(sel);
    const close = () => { host.classList.remove("on"); host.innerHTML = ""; };
    q("#tkCancel").onclick = close;
    q("#tkTitle").focus();

    q("#tkSave").onclick = async () => {
      const title = q("#tkTitle").value.trim();
      const start = q("#tkStart").value, due = q("#tkDue").value;
      if (!title) { q("#tkErr").textContent = "タイトルを入力してください"; return; }
      if (start && due && start > due) {
        q("#tkErr").textContent = "開始日は期限日より後にできません"; return;
      }
      const status = q("#tkStatus").value;
      const assignee = q("#tkAssignee").value.trim();
      const now = new Date().toISOString();
      const fields = { title, detail:q("#tkDetail").value.trim(), assignee, status,
        priority:q("#tkPriority").value, startDate:start || null, dueDate:due || null,
        updatedAt:now, doneAt: status === "done" ? (t.doneAt || now) : null };
      const rec = isNew
        ? { id:Util.uid(), eventId:ctx.eventId, order:nextOrder(status), createdAt:now, ...fields }
        : { ...t, ...fields };
      lastAssignee = assignee;
      try {
        await Repo.tasks.put(rec);
        close();
        await reload();
        FB.toast(isNew ? "タスクを追加しました" : "タスクを保存しました");
      } catch (e) { FB.error("タスクの保存に失敗: " + e.message); }
    };

    const del = q("#tkDel");
    if (del) del.onclick = () => {
      close();   // confirmModal がホストを全置換するため、先に閉じる
      FB.confirmModal({ title:"このタスクを削除しますか？", okLabel:"削除する", danger:true,
        body:`「${Util.esc(t.title)}」を削除します。`,
        onOk: async () => {
          try { await Repo.tasks.remove(t.id); await reload(); FB.toast("タスクを削除しました"); }
          catch (e) { FB.error("タスクの削除に失敗: " + e.message); }
        } });
    };
  }

  // 追加先の列の末尾に置く
  const nextOrder = (status) => {
    const inCol = ctx.tasks.filter(t => t.status === status);
    return inCol.length ? Math.max(...inCol.map(t => t.order ?? 0)) + 10 : 0;
  };

  return { render };
})();


// ===== [10] 主催者：設定（S-5 / F-32, F-33, F-36） =====
