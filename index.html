<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- viewport はビューごとに切り替える（F-81 / F-81b）。ここは主催者ビューの初期値。
     主催者側は PC幅のみなので 1024px 固定、参加者側は App.applyView() が
     width=device-width に差し替える。**参加者ビューは実機の幅で描く。** -->
<meta name="viewport" content="width=1024">
<title>イベント管理システム</title>
<style>
/* ===== [0] スタイル（インライン。青基調・濃紺ヘッダー） ===== */

/* 書体（サイトと同じ Jost を英数字に使う）。
   **`<link>` で外部CSSを読むのは技術方針に反する**（「JS と CSS はインラインに置く」）ため、
   @font-face を自分で書き、フォント実体だけを配布元から取る。
   条文はアイコンや画像をCDNで解決することを許可しており、フォント実体も同じアセット扱い。

   日本語の Zen Kaku Gothic New は入れていない。サブセットが約470件・449KB あり、
   インライン化すると成果物が倍以上になるため（要件定義書 3-1）。日本語はシステムフォント。

   URL にはバージョン（v20 など）が入っており、将来失効しうる。
   その場合も font-display:swap によりフォールバックが使われ、表示は壊れない。 */
/* Jost latin-ext */ @font-face {font-family: 'Jost';font-style: normal;font-weight: 400;font-display: swap;src: url(https://fonts.gstatic.com/s/jost/v20/92zatBhPNqw73ord4iYl.woff2) format('woff2');unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;}
/* Jost latin */ @font-face {font-family: 'Jost';font-style: normal;font-weight: 400;font-display: swap;src: url(https://fonts.gstatic.com/s/jost/v20/92zatBhPNqw73oTd4g.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
/* Jost latin-ext */ @font-face {font-family: 'Jost';font-style: normal;font-weight: 500;font-display: swap;src: url(https://fonts.gstatic.com/s/jost/v20/92zatBhPNqw73ord4iYl.woff2) format('woff2');unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;}
/* Jost latin */ @font-face {font-family: 'Jost';font-style: normal;font-weight: 500;font-display: swap;src: url(https://fonts.gstatic.com/s/jost/v20/92zatBhPNqw73oTd4g.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
/* Jost latin-ext */ @font-face {font-family: 'Jost';font-style: normal;font-weight: 700;font-display: swap;src: url(https://fonts.gstatic.com/s/jost/v20/92zatBhPNqw73ord4iYl.woff2) format('woff2');unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;}
/* Jost latin */ @font-face {font-family: 'Jost';font-style: normal;font-weight: 700;font-display: swap;src: url(https://fonts.gstatic.com/s/jost/v20/92zatBhPNqw73oTd4g.woff2) format('woff2');unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
/* 配色は日本コムシンク株式会社サイト（https://comthink.co.jp/）から採った。
   実際に使われている色: 本文 #20272e / アクセント #194bf4 / 罫線 #dee5ed /
   淡い青 #eff2ff / グレー #949494・#727272。
   状態を表す色（--ok / --warn / --danger）は意味を持つので変えていない。
   ヒートマップの5段階は #dee5ed → #194bf4 の補間で算出した。

   **--muted と --draft はサイトのグレー（#727272 / #949494）をそのまま使うと
   文字色として薄すぎる**（下書きバッジで 2.66:1、WCAG AA の 4.5 に届かない）。
   文字として読ませる色なので、彩りより可読性を優先して暗くした。 */
:root{
  --navy:#20272e; --navy-2:#3b4147; --blue:#194bf4; --blue-weak:#eff2ff;
  --ink:#20272e; --muted:#6b6b6b; --line:#dee5ed; --bg:#f4f6fa; --card:#fff;
  --ok:#137a4b; --warn:#b26a00; --danger:#c02828; --draft:#5f5f5f;
  --radius:10px; --shadow:0 1px 3px rgba(32,39,46,.08),0 4px 16px rgba(32,39,46,.06);
  /* 申込ヒートマップの5段階（F-103）。--blue に向けた補間 */
  --hm-0:#dee5ed; --hm-1:#b3c3ef; --hm-2:#7f9bf0; --hm-3:#4c73f2; --hm-4:#194bf4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* サイトと同じ書体。本文は Zen Kaku Gothic New、英数字の見出しは Jost。
   読み込めなかった場合は従来のシステムフォントに落ちる */
body{font-family:"Jost",system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  color:var(--ink);background:var(--bg);font-size:14px;line-height:1.6;min-width:1024px;
  -webkit-font-smoothing:antialiased}
/* 参加者ビューだけ下限を外す（F-81b）。主催者ビューは PC幅のみなので 1024px を残す */
body[data-view="participant"]{min-width:0}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
h1,h2,h3{margin:0}

/* ヘッダー */
header.appbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;
  padding:0 20px;height:56px;position:sticky;top:0;z-index:20}
/* 会社ロゴ（データURIで埋め込み）。
   **このロゴは社名部分が白なので、濃色の地に直接置く。**
   白地チップに載せると社名が消えて「NCT」だけになる（実際に一度そうなった）。 */
header.appbar .logo{display:flex;align-items:center;flex:none;line-height:0;
  padding:4px 6px;border-radius:6px;transition:background-color .12s}
header.appbar .logo:hover{background:rgba(255,255,255,.12)}
header.appbar .logo img{height:22px;width:auto;display:block}
header.appbar .brand{font-weight:700;font-size:16px;letter-spacing:.02em}
header.appbar .spacer{flex:1}
header.appbar .role{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
header.appbar .role button{background:transparent;border:0;color:#cdd7ea;padding:5px 14px;border-radius:999px;font-size:13px}
header.appbar .role button.on{background:#fff;color:var(--navy);font-weight:600}
header.appbar .user{font-size:13px;color:#cdd7ea;display:flex;align-items:center;gap:8px}
header.appbar .user .avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}

/* タブ */
/* タブは1つずつを大きく取り、ナビバーの余白を詰める */
nav.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:0;padding:0 12px;position:sticky;top:56px;z-index:15}
nav.tabs button{background:transparent;border:0;padding:16px 40px;min-width:170px;font-size:15px;
  color:var(--muted);font-weight:700;border-bottom:3px solid transparent;transition:background .12s}
nav.tabs button:hover{background:#f7f9ff;color:var(--ink)}
nav.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);background:#f5f8ff}
body[data-view="participant"] nav.tabs{background:#fbfcff}

/* コンテンツ */
main{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
body[data-view="participant"] main{max-width:640px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-head h2{font-size:20px}
.page-head .sub{color:var(--muted);font-size:13px}

/* カード */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}

/* 指標カード */
.metric{padding:16px 18px}
.metric .label{color:var(--muted);font-size:12px;font-weight:600}
.metric .value{font-size:30px;font-weight:700;line-height:1.2;margin-top:4px;
  font-family:"Jost",system-ui,sans-serif;letter-spacing:.01em}
.metric .value small{font-size:14px;font-weight:600;color:var(--muted)}
.metric.attn .value{color:var(--warn)}

/* テーブル */
table.list{width:100%;border-collapse:collapse;background:#fff}
table.list th,table.list td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.list th{color:var(--muted);font-size:12px;font-weight:700;background:#fafbfe}
table.list tr.grouprow td{background:#f1f4fb;color:var(--muted);font-weight:700;font-size:12px}
table.list tbody tr.clickable:hover{background:#f7f9ff;cursor:pointer}

/* バッジ */
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.7}
.badge.draft{background:#eef0f3;color:var(--draft)}
.badge.published{background:#e6f5ec;color:var(--ok)}
.badge.cancelled{background:#fbe9e9;color:var(--danger)}
.badge.limited{background:#fff2df;color:var(--warn)}
.badge.phase{background:var(--blue-weak);color:var(--blue)}
.badge.phase.ended{background:#eef0f3;color:var(--draft)}
.badge.phase.full{background:#fbe9e9;color:var(--danger)}
.badge.phase.before{background:#fff2df;color:var(--warn)}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--ink);
  padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{border-color:#c7cfdd}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1d54cf}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn.sm{padding:5px 10px;font-size:12px}

/* トグル */
.toggles{display:flex;gap:8px;margin-left:auto}
.toggles button{background:#fff;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:600;font-size:12px}
.toggles button.on{background:var(--blue-weak);border-color:#bcd0fb;color:var(--blue)}

/* 空状態 */
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}

/* 参加者：公開ページ */
.pub .cover{height:200px;border-radius:var(--radius);background:linear-gradient(120deg,#2a4b86,#4f74c0);display:grid;place-items:center;color:#dbe6ff;font-weight:600}
.pub img.cover{width:100%;object-fit:cover;display:block}
/* 参加者側の一覧カード（F-03b）。カバー画像を帯で見せる。文字だけの一覧は寂しく、
   どのイベントかを見分けるのにも画像が効く。高さを固定して並びが崩れないようにする */
.pcard{overflow:hidden;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.pcard:hover{box-shadow:0 6px 18px rgba(32,39,46,.12);transform:translateY(-1px)}
.pcard .ph{display:block;width:100%;height:132px;object-fit:cover;background:#e9eef7}
.pcard .ph.none{background:linear-gradient(120deg,#2a4b86,#4f74c0)}
.pcard .ph.sm{height:96px}
.pcard .pb{padding:12px 14px}
.pcard .pt{font-weight:700;font-size:16px;line-height:1.4}
.pcard .pm{color:var(--muted);margin-top:4px;font-size:13px}
.pcard .pr{margin-top:6px;font-size:13px}
.pub h1{font-size:24px;margin:18px 0 6px}
.pub .kv{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.pub .kv .row{display:flex;gap:10px;padding:5px 0}
.pub .kv .row .k{width:96px;color:var(--muted);flex:none}
.pub .seats{font-size:15px;font-weight:700;margin:10px 0 6px;text-align:center}
.pub .apply{width:100%;justify-content:center;padding:14px;font-size:15px}

/* フィードバック：トースト（右下） */
#toastHost{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{background:#12241f;color:#eafaf0;padding:12px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;
  border-left:3px solid var(--ok);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* フィードバック：エラーバナー（上部・自動で消えない） */
#bannerHost{position:sticky;top:56px;z-index:18}
.banner{background:#fbe9e9;color:var(--danger);border-bottom:1px solid #f0c9c9;padding:10px 20px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
.banner button{margin-left:auto;background:transparent;border:0;color:var(--danger);font-weight:700}


.note{background:#fffbea;border:1px solid #f0e3a8;border-radius:var(--radius);padding:14px 16px;font-size:13px;color:#6a5a12}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row-actions{display:flex;gap:8px}

/* サブタブ（S-4） */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0}
.subtabs button{background:transparent;border:0;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.subtabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
/* 通知一覧（S-11 / F-108）。新しい順に並べ、未読は左に印を出す */
.nt-list{display:flex;flex-direction:column;gap:8px}
.nt-item{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;cursor:pointer;border-left:3px solid transparent}
.nt-item:hover{box-shadow:0 4px 14px rgba(32,39,46,.10)}
.nt-item.new{border-left-color:var(--blue);background:#f7faff}
.nt-when{color:var(--muted);font-size:12px;min-width:112px;padding-top:2px}
.nt-main{flex:1;min-width:0}
.nt-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nt-ev{font-weight:700;font-size:14px}
.nt-text{color:var(--muted);font-size:13px;margin-top:4px;overflow-wrap:break-word}
.nt-go{color:var(--blue);font-size:12px;white-space:nowrap;padding-top:2px}
nav.tabs .tabdot{display:inline-block;margin-left:8px;background:var(--danger);color:#fff;
  border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;vertical-align:middle}
.subtabs .tabdot{display:inline-block;margin-left:6px;background:var(--blue);color:#fff;
  border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;line-height:1.5;vertical-align:middle}

/* 状況固定表示（F-76） */
.statusbar h2{font-size:19px;margin-bottom:4px}
.statusbar .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.statusbar .meta b{color:var(--ink)}

/* フォーム */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .req{color:var(--danger);font-size:11px;margin-left:4px}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.field input[type=checkbox]{width:auto}
.field textarea{min-height:82px;resize:vertical}
.field .err{color:var(--danger);font-size:12px;margin-top:4px}
.field .invalid{border-color:var(--danger)}
.field .hint{color:var(--muted);font-size:12px;margin-top:4px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ウィザード（S-3） */
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps .step{flex:1;text-align:center;padding:9px 6px;border-radius:8px;background:#eef1f7;color:var(--muted);font-size:12px;font-weight:700;border:1px solid transparent;cursor:default}
.steps .step.clickable{cursor:pointer}
.steps .step.on{background:var(--blue-weak);color:var(--blue);border-color:#bcd0fb}
.steps .step.done{background:#e6f5ec;color:var(--ok)}
.wizard-actions{display:flex;justify-content:space-between;margin-top:22px}

/* 行展開（S-4 申込一覧） */
tr.expand-row td{background:#f7f9ff;padding:0}
.expand-inner{padding:14px 16px}
.expand-inner .kv2{display:flex;gap:28px;margin-bottom:12px;flex-wrap:wrap}
.expand-inner .kv2 .k{color:var(--muted);font-size:12px}

/* モーダル（F-87） */
#modalHost{position:fixed;inset:0;background:rgba(15,25,45,.42);display:none;place-items:center;z-index:50}
#modalHost.on{display:grid}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow);width:420px;max-width:90vw;padding:22px}
.modal h3{font-size:17px;margin-bottom:8px}
.modal p{color:var(--muted);margin:0}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* 申込フロー（S-7/8/9） */
.flow-steps{display:flex;gap:10px;justify-content:center;margin-bottom:20px;color:var(--muted);font-size:13px;font-weight:600}
.flow-steps .on{color:var(--blue)}
.summary{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fafbfe}
.summary .row{display:flex;padding:4px 0}
.summary .row .k{width:120px;color:var(--muted);flex:none}
.consent{display:flex;gap:8px;align-items:flex-start;margin:14px 0}
.copybox{display:flex;gap:8px;margin-top:8px}
.copybox input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit}
details.reveal summary{cursor:pointer;color:var(--blue);font-weight:600;margin-top:14px}
.ticket-item{cursor:pointer}

/* 要対応リスト（S-1 / F-31b）。条件だけでなく「何をするか」を出すので高さを取る */
.attn-list{display:flex;flex-direction:column;gap:10px}
.attn-item{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.attn-item:hover{border-color:#c7cfdd;box-shadow:0 2px 6px rgba(20,40,80,.12)}
.attn-item .ai-bar{width:4px;flex:none}
.attn-item.danger .ai-bar{background:var(--danger)}
.attn-item.warn .ai-bar{background:var(--warn)}
.attn-item.mute .ai-bar{background:var(--draft)}
.attn-item .ai-main{flex:1;padding:13px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.attn-item .ai-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.attn-item .ai-title{font-size:15px;font-weight:700}
.attn-item .ai-act{font-size:13.5px;line-height:1.6}
.attn-item.danger .ai-act{color:var(--danger);font-weight:600}
.attn-item.warn .ai-act{color:#8a5200;font-weight:600}
.attn-item.mute .ai-act{color:var(--muted)}
.attn-item .ai-facts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.attn-item .ai-rest{display:flex;gap:6px;flex-wrap:wrap}
.attn-item .ai-rest .r{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.attn-item .ai-rest .r.danger{background:#fbe9e9;color:var(--danger)}
.attn-item .ai-rest .r.warn{background:#fff2df;color:var(--warn)}
.attn-item .ai-rest .r.ok{background:#e6f5ec;color:var(--ok)}
.attn-item .ai-rest .r.mute{background:#eef0f3;color:var(--draft)}
.attn-item .ai-go{display:flex;align-items:center;padding:0 16px;color:var(--blue);
  font-size:12px;font-weight:700;white-space:nowrap;border-left:1px solid var(--line);background:#fafbfe}

/* 開催カレンダー（S-1 / F-100） */
.cal{padding:14px 16px 16px}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head .cal-title{font-size:15px;font-weight:700;min-width:120px;text-align:center}
.cal-head #calToday{margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal-wd{background:#fafbfe;text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.cal-wd.sun{color:var(--danger)} .cal-wd.sat{color:#1c5f8a}
.cal-cell{background:#fff;min-height:92px;padding:5px 6px;display:flex;flex-direction:column;gap:3px}
.cal-cell.out{background:#fafbfd}
.cal-cell.out .cal-d{color:#c3cbd8}
.cal-cell.sun{background:#fffafa} .cal-cell.sat{background:#fafcff}
.cal-cell.out.sun,.cal-cell.out.sat{background:#fafbfd}
.cal-cell.today{background:#fff6e8;box-shadow:inset 0 0 0 2px var(--warn)}
.cal-d{font-size:12px;font-weight:700;color:var(--ink);line-height:1.4}
.cal-cell.today .cal-d{color:var(--warn)}
.cal-chip{font-size:10.5px;line-height:1.45;border-radius:4px;padding:2px 5px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-chip b{font-weight:700}
.cal-chip:hover{filter:brightness(.94)}
.cal-chip.open{background:var(--blue-weak);color:#1b3a6b}
.cal-chip.draft{background:#eef0f3;color:var(--draft)}
.cal-chip.held{background:#eef0f3;color:#8a93a3}
.cal-chip.cancelled{background:#fbe9e9;color:var(--danger);text-decoration:line-through}
.cal-more{font-size:10px;color:var(--muted);padding-left:5px}
.cal-undated{margin-top:10px;font-size:12px;color:var(--muted)}
.cal-undated .chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;margin:4px 6px 0 0;cursor:pointer;color:var(--ink)}
.cal-undated .chip:hover{border-color:#c7cfdd}

/* イベント一覧のカード（S-2 / F-79） */
.grouphead{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 8px}
.grouphead:first-of-type{margin-top:0}
.evgrid{display:flex;flex-direction:column;gap:10px}
.evcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:9px}
.evcard:hover{border-color:#bcd0fb;box-shadow:0 2px 6px rgba(20,40,80,.12)}
.evcard.done{opacity:.72;background:#fbfcfe}
.evcard .badges{display:flex;gap:6px;flex-wrap:wrap}
.evcard .ttl{font-size:15px;font-weight:700;line-height:1.4;word-break:break-word}
.evcard .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.evcard .bars{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:2px}
.evcard .bl{display:flex;align-items:baseline;gap:7px;font-size:12px;margin-bottom:3px}
.evcard .bl>span:first-child{color:var(--muted);font-weight:600;width:30px;flex:none}
.evcard .bl b{font-size:13px}
.evcard .bl .sub{color:var(--muted);margin-left:auto}
.evcard .track{height:6px;background:#e9edf5;border-radius:999px;overflow:hidden}
.evcard .fill{display:block;height:100%;border-radius:999px}
.evcard .fill.seats{background:var(--blue)}
.evcard .fill.seats.full{background:var(--danger)}
.evcard .fill.prep{background:var(--ok)}
.evcard .flags{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:9px;margin-top:1px}
.evcard .fl{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.evcard .fl.danger{background:#fbe9e9;color:var(--danger)}
.evcard .fl.warn{background:#fff2df;color:var(--warn)}
.evcard .fl.ok{background:#e6f5ec;color:var(--ok)}
.evcard .fl.mute{background:#eef0f3;color:var(--draft)}
.evcard .fl.new{background:var(--blue);color:#fff}
.evcard.unread{border-left:3px solid var(--blue)}

/* ファイル共有（E-3 / F-102） */
.fl-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fl-bar label.btn{cursor:pointer}
.fl-sum{font-size:12px;color:var(--muted)}
.fl-list{display:flex;flex-direction:column;gap:8px}
.fl-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 14px}
.fl-item .fi{font-size:22px;flex:none}
.fl-item .fm{flex:1;min-width:0}
.fl-item .fn{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-item .fd{font-size:11.5px;color:var(--muted);margin-top:2px}

/* イベントマニュアル（Markdown / F-99） */
.mn-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mn-state{font-size:12px;color:var(--muted);margin-left:auto}
.mn-state .dirty{color:var(--warn);font-weight:700}
.mn-body{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;min-height:420px;display:flex}
.mn-body.split{display:grid;grid-template-columns:1fr 1fr}
.mn-body.split .mn-prev{border-left:1px solid var(--line)}
.mn-body textarea{width:100%;min-height:420px;border:0;padding:16px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;outline:none}
.mn-prev{padding:8px 20px 20px;overflow:auto;min-height:420px;flex:1}

/* Markdown の描画 */
.md{font-size:14px;line-height:1.8;word-break:break-word}
.md h1,.md h2,.md h3,.md h4{margin:20px 0 8px;line-height:1.4}
.md h1{font-size:21px;border-bottom:2px solid var(--line);padding-bottom:6px}
.md h2{font-size:17px;border-bottom:1px solid var(--line);padding-bottom:5px}
.md h3{font-size:15px} .md h4{font-size:14px;color:var(--muted)}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:24px}
.md li{margin:3px 0}
.md li.task{list-style:none;margin-left:-20px}
.md li.task input{margin-right:6px}
.md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid #bcd0fb;background:#f5f8ff;color:#33477a}
.md blockquote p{margin:0}
.md code{background:#f1f4f9;border-radius:4px;padding:1px 5px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.md pre{background:#1e2733;color:#e6edf6;border-radius:8px;padding:12px 14px;overflow-x:auto;margin:10px 0}
.md pre code{background:transparent;color:inherit;padding:0;font-size:12.5px}
.md table{border-collapse:collapse;margin:10px 0;width:100%}
.md th,.md td{border:1px solid var(--line);padding:7px 10px;text-align:left;font-size:13px}
.md th{background:#fafbfe;font-weight:700;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.md a{text-decoration:underline}

/* 参加者名簿のロック（F-101） */
.lock{text-align:center;max-width:560px;margin:40px auto}
.lock .lk-icon{font-size:36px}
.lock h3{font-size:16px;margin:10px 0 6px}
.lock p{color:var(--muted);margin:0 0 16px;font-size:13px}
.lock .lk-form{display:flex;gap:8px;justify-content:center}
.lock .lk-form input{width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
/* 参加者のログイン（F-107）は入力欄が2つあるので縦積みにする */
.lock .lk-form.col{flex-direction:column;align-items:center}
.lock .lk-form.col input{width:100%;max-width:260px}
.lock .lk-form.col .btn{margin-top:2px}
.lock .lk-err{color:var(--danger);font-size:13px;font-weight:700;margin-top:10px}

/* 参加者名簿（横断 / F-92） */
.hist{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13px;flex-wrap:wrap}
.hist a{cursor:pointer;font-weight:600}
.hist .d{color:var(--muted);font-size:12px}

/* QR受付（F-95） */
.scan{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:#fff;text-align:center}
.scan .sh{font-size:12px;color:var(--muted);margin-bottom:10px}
.scan video{width:100%;max-width:360px;border-radius:8px;background:#000}
.scan .row-actions{justify-content:center;margin-top:10px}
.scan .sr{margin-top:10px;font-size:14px;font-weight:700;min-height:22px}
.scan .sr .ok{color:var(--ok)} .scan .sr .ng{color:var(--danger)}

/* 申込推移（F-96） */
.trend{margin-bottom:12px;overflow-x:auto}
/* 見出しは申込推移とヒートマップで共用する（宣言は変更せず、セレクタだけ拡張） */
.trend .th,.hm .th{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.trend .th span,.hm .th span{font-weight:400;margin-left:8px}

/* 申込ヒートマップ（S-1 / F-103） */
.hm-body{display:flex;gap:6px;align-items:flex-start;overflow-x:auto;padding-bottom:2px}
.hm-side{display:grid;grid-template-rows:repeat(7,11px);gap:3px;flex:none;
  font-size:9px;line-height:11px;color:var(--muted);text-align:right;width:16px}
.hm-cols{display:flex;flex-direction:column;gap:3px;flex:none}
.hm-months{display:grid;grid-template-columns:repeat(26,11px);gap:3px;
  font-size:9px;line-height:11px;height:11px;color:var(--muted)}
.hm-months span{white-space:nowrap}
.hm-grid{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;
  grid-auto-columns:11px;gap:3px}
.hm-grid>div{width:11px;height:11px;border-radius:2px;background:var(--hm-0)}
.hm-grid>div.l1{background:var(--hm-1)}
.hm-grid>div.l2{background:var(--hm-2)}
.hm-grid>div.l3{background:var(--hm-3)}
.hm-grid>div.l4{background:var(--hm-4)}
.hm-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;
  margin-top:10px;font-size:10px;color:var(--muted)}
.hm-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.trend svg{display:block}
.trend .tl2{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* 申込フォームのカスタム質問エディタ（F-91） */
.qedit{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:#fafbfe;margin-top:6px}
.qedit .qh{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qrow input,.qrow select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.qrow .ql{flex:2;min-width:0} .qrow .qo{flex:2;min-width:0} .qrow .qt{flex:none;width:96px}
.qrow .qo:disabled{background:#f1f4f9;color:var(--muted)}
.qrow .qr{display:flex;gap:4px;align-items:center;font-size:12px;white-space:nowrap}
.qrow .qr input{width:auto}

/* 視聴情報（オンライン／ハイブリッド。申込者のみ） */
.online-box{border:1px solid #bcd0fb;background:var(--blue-weak);border-radius:var(--radius);padding:12px 14px;margin:14px 0}
.online-box .oh{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px}
.online-box .on{font-size:12px;color:var(--ink);margin-top:6px;white-space:pre-wrap}

/* 受付用QR */
.qr-box{border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;margin:14px 0}
.qr-box .qh{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.qr-box canvas{display:block;margin:0 auto}

/* 主催者からのお知らせ（参加者向け） */
.notices{border:1px solid #f0e3a8;background:#fffbea;border-radius:var(--radius);padding:12px 14px;margin:14px 0}
.notices .nh{font-size:12px;font-weight:700;color:#6a5a12;margin-bottom:8px}
.notices .nitem{padding:8px 0;border-top:1px solid #f0e3a8}
.notices .nitem:first-of-type{border-top:0;padding-top:0}
.notices .nt{font-weight:700;font-size:13px}
.notices .nm{font-size:11px;color:var(--muted);margin-top:2px}
.notices .nb{white-space:pre-wrap;font-size:13px;margin-top:5px}

/* 運営スレッド／Q&A（社内） */
.ops-note{font-size:12px;color:var(--muted);background:#f4f6fb;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;padding:2px}
.bubble{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bubble .who{font-size:12px;color:var(--blue);font-weight:700}
.bubble .when{font-size:11px;color:var(--muted);margin-left:8px}
.bubble .body{white-space:pre-wrap;margin-top:3px}
.bubble .del{float:right;color:var(--muted);border:0;background:transparent;font-size:12px;cursor:pointer;line-height:1}
.composer{display:flex;flex-direction:column;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.composer .crow{display:flex;gap:8px;align-items:center}
.composer .author,.qa-author{width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.composer textarea{min-height:56px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;resize:vertical}
.qa-item{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.qa-item.resolved{background:#f6faf7}
.qa-q{font-weight:600;display:flex;gap:8px;align-items:flex-start}
.qa-meta{font-size:12px;color:var(--muted);margin:4px 0 10px}
.qa-item textarea{width:100%;min-height:56px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;resize:vertical}
.badge.open{background:#fff2df;color:var(--warn)}
.badge.resolved{background:#e6f5ec;color:var(--ok)}

/* 運営タスク（backlog風ボード＋タイムライン / E-2） */
.tk-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.tk-progress{flex:1;min-width:240px}
.tk-stat{font-size:12px;color:var(--muted);margin-bottom:5px}
.tk-stat b{color:var(--ink);font-size:13px}
.tk-stat .over{color:var(--danger);font-weight:700}
.tk-bar{height:8px;background:#e9edf5;border-radius:999px;overflow:hidden}
.tk-bar>span{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .2s}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.todo{background:#9aa4b5} .dot.doing{background:var(--blue)}
.dot.review{background:#0d9488} .dot.done{background:var(--ok)}

/* ボード（カンバン） */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.col{background:#f4f6fb;border:1px solid var(--line);border-radius:10px;padding:8px}
.col.over{background:var(--blue-weak);border-color:#bcd0fb}
.col .ch{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);padding:4px 6px 9px}
.col .ch .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.col .drop{display:flex;flex-direction:column;gap:8px;min-height:64px}
.tcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;
  padding:9px 10px;cursor:grab;box-shadow:0 1px 2px rgba(20,40,80,.05)}
.tcard:hover{border-color:#c7cfdd}
.tcard.dragging{opacity:.4}
.tcard.p-high{border-left-color:var(--danger)}
.tcard.p-normal{border-left-color:var(--blue)}
.tcard.p-low{border-left-color:#c3cbd8}
.tcard .t{font-weight:600;font-size:13px;line-height:1.45;word-break:break-word}
.tcard .m{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted)}
.tcard .who{background:#eef2ff;color:#3550b0;border-radius:999px;padding:1px 8px;font-weight:700}
.tcard .due.over{color:var(--danger);font-weight:700}
.tcard .pri{color:var(--danger);font-weight:700}

/* タイムライン（ガント風。今日線・週末シェード） */
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tl-inner{--dw:28px;--nw:220px;min-width:max-content}
.tl-row{display:flex;background:#fff;border-bottom:1px solid #eef1f7}
.tl-row:last-child{border-bottom:0}
.tl-row.clickable:hover{background:#f7f9ff;cursor:pointer}
.tl-name{width:var(--nw);flex:none;padding:7px 10px;font-size:12px;display:flex;align-items:center;gap:7px;
  border-right:1px solid var(--line);position:sticky;left:0;background:inherit;z-index:2;overflow:hidden}
.tl-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-name .who{margin-left:auto;flex:none;background:#eef2ff;color:#3550b0;border-radius:999px;padding:0 7px;font-size:10px;font-weight:700}
.tl-track{position:relative;display:flex;flex:none}
.tl-c,.tl-d{width:var(--dw);flex:none;border-right:1px solid #f1f4f9}
.tl-c{height:34px}
.tl-c.we,.tl-d.we{background:#f7f9fc}
.tl-c.now,.tl-d.now{background:#fff6e8}
.tl-row.head{background:#fafbfe;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.tl-row.head .tl-name{font-weight:700;color:var(--muted)}
.tl-d{font-size:10px;text-align:center;padding:3px 0;color:var(--muted);line-height:1.3}
.tl-d b{display:block;color:var(--ink);font-size:11px}
.tl-d.now b{color:var(--warn)}
.tl-month{display:flex;background:#f4f6fb;border-bottom:1px solid var(--line)}
.tl-month .mlabel{flex:none;font-size:11px;font-weight:700;color:var(--muted);padding:3px 8px;border-right:1px solid var(--line)}
.tl-bar{position:absolute;top:6px;height:22px;border-radius:5px;font-size:10px;font-weight:700;
  display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap}
.tl-bar.s-todo{background:#ccd4e0;color:#41506a}
.tl-bar.s-doing{background:var(--blue);color:#fff}
.tl-bar.s-review{background:#0d9488;color:#fff}
.tl-bar.s-done{background:var(--ok);color:#fff}
.tl-bar.over{box-shadow:inset 0 0 0 2px var(--danger)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);opacity:.55;z-index:1}
.tl-undated{margin-top:12px;font-size:12px;color:var(--muted)}
.tl-undated .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:3px 11px;margin:4px 6px 0 0;cursor:pointer;font-size:12px;color:var(--ink)}
.tl-undated .chip:hover{border-color:#c7cfdd}

/* タスク編集モーダル */
.modal.wide{width:560px}
.modal.wide .field{margin-bottom:12px;text-align:left}
.modal .modal-actions .spacer{flex:1}

/* ===== 参加者ビューのスマホ表示（F-81b） =====
   主催者側は PC幅のみのまま（F-81）。**社外の参加者の端末は選べない**ので、
   参加者側だけを実機の幅で描く。

   すべてのルールを `body[data-view="participant"]` にスコープしている理由:
   参加者ビューでは viewport を width=device-width に切り替えるが、
   **PC のブラウザ幅を縮めた場合は viewport の指定が無視される**ため、
   スコープを外すと主催者ビューにもこのブロックが当たってしまう。

   境界は 640px。`main` の max-width が参加者ビューで 640px なので、
   それ以下ではもともと横幅いっぱいに使っている＝そこから下だけを組み替える。 */
@media (max-width:640px) {
  /* ヘッダー: ロゴ・アプリ名・役割切替・ユーザーの4つは並ばない。
     ロゴ（会社の署名。社外の方への信頼の手がかり）と役割切替を残し、
     アプリ名とユーザー表示を落とす。ユーザー表示「運営担当」は主催者側の概念で、
     参加者の画面には元から意味が無い。 */
  body[data-view="participant"] header.appbar{padding:0 12px;gap:8px;overflow:hidden}
  /* ロゴは 483x37 の横長で、height:22px だと約287px を占める。14px まで落とす。
     さらに狭い端末では縮小して収める（潰さずに比率を保つため object-fit） */
  body[data-view="participant"] header.appbar .logo{flex:0 1 auto;min-width:0}
  body[data-view="participant"] header.appbar .logo img{height:14px;max-width:100%;
    object-fit:contain;object-position:left}
  body[data-view="participant"] header.appbar .brand{display:none}
  body[data-view="participant"] header.appbar .user{display:none}
  body[data-view="participant"] header.appbar .role{flex:none}
  body[data-view="participant"] header.appbar .role button{padding:5px 11px;font-size:12px}
  body[data-view="participant"] header.appbar .role .vw{display:none}

  /* タブは2つ。幅を等分し、指で押せる高さ（約46px）を確保する */
  body[data-view="participant"] nav.tabs{padding:0}
  body[data-view="participant"] nav.tabs button{flex:1;min-width:0;padding:14px 6px;font-size:14px}

  /* 本文。長いトークンやURLが載るので折り返しを許す */
  body[data-view="participant"] main{padding:16px 14px 60px;overflow-wrap:break-word}
  body[data-view="participant"] .page-head{flex-wrap:wrap;gap:8px;margin-bottom:14px}
  body[data-view="participant"] .page-head h2{font-size:18px}
  body[data-view="participant"] .card.pad{padding:14px}
  body[data-view="participant"] .empty{padding:32px 12px}

  /* 公開ページ */
  body[data-view="participant"] .pub .cover{height:150px}
  /* 通知はスマホでは日時を上に積む（横に3列並べると読めなくなる） */
  body[data-view="participant"] .nt-item{flex-wrap:wrap;gap:6px}
  body[data-view="participant"] .nt-when{min-width:0;width:100%;order:-1}
  body[data-view="participant"] .nt-go{display:none}
  body[data-view="participant"] .pcard .ph{height:108px}
  body[data-view="participant"] .pcard .ph.sm{height:84px}
  body[data-view="participant"] .pub h1{font-size:20px;margin:14px 0 6px}
  body[data-view="participant"] .pub .kv{padding:12px}
  body[data-view="participant"] .pub .apply{padding:16px;font-size:16px}

  /* 定義リストは横並びを解いて縦に積む。`.k` の固定幅（96px / 120px）を
     狭い画面に残すと、値の側が数文字ぶんしか残らない */
  body[data-view="participant"] .pub .kv .row,
  body[data-view="participant"] .summary .row{flex-direction:column;gap:2px;padding:6px 0}
  body[data-view="participant"] .pub .kv .row .k,
  body[data-view="participant"] .summary .row .k{width:auto;font-size:12px;font-weight:600}

  /* 入力欄。**font-size は 16px 以上にする。**
     iOS Safari は 16px 未満の入力欄にフォーカスすると自動でズームし、
     戻らないまま横スクロールが残る。申込フォームは参加者が必ず通る画面なので、
     ここだけは見た目より挙動を優先する。 */
  body[data-view="participant"] .field input,
  body[data-view="participant"] .field textarea,
  body[data-view="participant"] .field select,
  body[data-view="participant"] .lock .lk-form input{font-size:16px;padding:11px 12px}
  body[data-view="participant"] .flow-steps{gap:6px;font-size:12px}

  /* ボタンは指で押せる大きさに（縦 約42px） */
  body[data-view="participant"] .btn{padding:11px 16px;font-size:14px}
  body[data-view="participant"] .btn.sm{padding:8px 12px;font-size:13px}
  body[data-view="participant"] .row-actions{flex-wrap:wrap}

  /* 確認URL・視聴URLの入力欄は1行を占め、ボタンは下へ回す */
  body[data-view="participant"] .copybox{flex-wrap:wrap}
  body[data-view="participant"] .copybox input{flex:1 1 100%}

  /* 受付用QR。既定は 5px セル（約145px）で、他人の端末のカメラには小さい。
     SVG は viewBox を持つので幅で拡大できる */
  body[data-view="participant"] .qr-box svg{width:100%;max-width:240px;height:auto;
    display:block;margin:0 auto}

  /* トーストは画面幅に収める（右下 20px 固定だと溢れる） */
  body[data-view="participant"] #toastHost{left:12px;right:12px;bottom:12px}

  body[data-view="participant"] .modal{padding:18px}
  body[data-view="participant"] .modal .modal-actions{flex-wrap:wrap}
}
</style>

<!-- ===== 外部ライブラリ（インライン化） =====
     QR生成に qrcode-generator v1.4.4 を使う。**CDN から読まずに埋め込んでいる。**
     理由は、この機能が参加者の個人情報がある画面で動くため、第三者スクリプトの
     改ざんリスクを負いたくないこと。埋め込めば改ざん検知（SRI）も不要になる。
     あわせて、テストで本物のライブラリを検証できる。

     ライセンス表記は下の原文ヘッダをそのまま残している（MIT）。
     このブロックは自前のコードではないので、技術方針の検査対象から外している
     （本体は次の <script> 以降。"use strict" もそちらだけに掛けている）。
     差し替えるときは https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js を取得し直すこと。 -->

//
// QR Code Generator for JavaScript

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];

<script>
"use strict";

// ===== [1] ユーティリティ =====
/* CDN の URL はここに集約する。**必ず実在を確認してから書くこと。**
   過去に存在しないパスを書いて QR 生成が動かなかったことがある。
   CI がこの行を読み取って到達確認するので、書式（QR_READ_LIB = "…"）を変えない。

   QR **生成**の側は CDN を使わない。ライブラリを冒頭にインライン化してあるので、
   グローバルの `qrcode` をそのまま呼ぶ。 */
const QR_READ_LIB = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";

const Util = (() => {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ID・トークンは crypto。Math.random() は使用しない（禁止事項）
  const randHex = (bytes) => {
    const a = new Uint8Array(bytes);
    crypto.getRandomValues(a);
    return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
  };
  const uid = () => randHex(8);
  const newToken = () => randHex(16);

  // 検索用正規化（F-47 / 7-5）: NFKC → 小文字 → カタカナ→ひらがな → 空白除去
  const normalize = (s) => {
    let t = String(s ?? "").normalize("NFKC").toLowerCase();
    t = t.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
    return t.replace(/\s+/g, "");

  const pad = n => String(n).padStart(2, "0");
  const fmtDateTime = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const fmtDate = (iso) => {
    if (!iso) return "";
    // "YYYY-MM-DD" は new Date() が UTC 解釈するため、時差のある環境で前日にずれる。
    // 日付のみの文字列はローカル日付として組み立てる。
    const d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso + "T00:00:00") : new Date(iso);
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
  };
  /* 開催日時は開始と終了の両方を出す。同じ日なら終了は時刻だけにする（F-46b）。
     主催者側・参加者側で同じ表記にするため、ここに集約する。 */
  const fmtRange = (startAt, endAt) => {
    if (!startAt) return "日程未定";
    const s = fmtDateTime(startAt);
    if (!endAt) return s;
    const a = new Date(startAt), b = new Date(endAt);
    const sameDay = a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    return sameDay ? `${s} 〜 ${pad(b.getHours())}:${pad(b.getMinutes())}`
                   : `${s} 〜 ${fmtDateTime(endAt)}`;
  };

  // 申込締切は日付のみ。当日 23:59:59 まで受付（F-45）
  const deadlineEnd = (dateStr) => {
    if (!dateStr) return null;
    const d = new Date(dateStr + "T23:59:59");
    return d.getTime();
  };
  // 受付開始も日付のみ。当日 00:00:00 から受付（F-45b）
  const dayStart = (dateStr) => {
    if (!dateStr) return null;
    return new Date(dateStr + "T00:00:00").getTime();
  };
  // 「今週」は月曜起点（F-60）
  const weekStartMonday = (now) => {
    const d = new Date(now); d.setHours(0,0,0,0);
    const dow = (d.getDay() + 6) % 7; // 月=0
    d.setDate(d.getDate() - dow);
    return d.getTime();
  };
  const daysBetween = (a, b) => Math.floor((b - a) / 86400000);

  const csvCell = (v) => {

       = + - @ タブ CR で始まるセルを数式として解釈する。参加者が氏名欄に
       `=HYPERLINK(...)` のような値を入れると、名簿を開いた運営側で実行されうる。
       先頭に `'` を足して文字列として扱わせる。

    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;

  const downloadText = (filename, text, mime = "text/csv") => {
    const blob = new Blob([text], { type: mime + ";charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);

    try { await navigator.clipboard.writeText(text); return true; }
    catch { return false; }

  /* Markdown（マニュアル用の最小サブセット / F-99）。外部ライブラリを使わない——
     プレビューが既定ビューなので、CDN に繋がらないとマニュアルが読めない、という状態を
     作りたくない。**先に全体をエスケープしてから組み立てる**ので、本文中の HTML は
     タグとして解釈されない（マニュアルは運営が書くが、貼り付けた内容が混ざりうるため）。
     対応: 見出し / 箇条書き（チェックボックス含む） / 番号付き / 引用 / 水平線 /

  function markdown(src) {
    const lines = esc(src).replace(/\r\n?/g, "\n").split("\n");
    const inline = (t) => t
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")

    const cells = (l) => l.replace(/^\s*\|?/, "").replace(/\|?\s*$/, "").split("|").map(c => c.trim());

    const out = [];

    while (i < lines.length) {
      const l = lines[i];

      // 表: 1行目がヘッダ、2行目が区切り（|---|---|）

        const head = cells(l); i += 2;
        const body = [];
        while (i < lines.length && lines[i].includes("|") && !/^\s*$/.test(lines[i])) body.push(cells(lines[i++]));
        out.push(`<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>` +
          `<tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
        continue;
      }
      // 引用。先に esc() しているので行頭の ">" は "&gt;" になっている点に注意
      if (/^\s*&gt;\s?/.test(l)) {
        const buf = [];
        while (i < lines.length && /^\s*&gt;\s?/.test(lines[i]))
          buf.push(lines[i++].replace(/^\s*&gt;\s?/, ""));
        out.push(`<blockquote>${inline(buf.join("<br>"))}</blockquote>`);
        continue;
      }
      if (/^\s*([-*+])\s+/.test(l)) {                            // 箇条書き（チェックボックス対応）
        const buf = [];
        while (i < lines.length && /^\s*([-*+])\s+/.test(lines[i])) {
          let t = lines[i++].replace(/^\s*([-*+])\s+/, "");
          const box = t.match(/^\[( |x|X)\]\s*(.*)$/);
          buf.push(box
            ? `<li class="task"><input type="checkbox" disabled ${/x/i.test(box[1])?"checked":""}> ${inline(box[2])}</li>`
            : `<li>${inline(t)}</li>`);
        }
        out.push(`<ul>${buf.join("")}</ul>`);
        continue;
      }
      if (/^\s*\d+\.\s+/.test(l)) {                              // 番号付き
        const buf = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i]))
          buf.push(`<li>${inline(lines[i++].replace(/^\s*\d+\.\s+/, ""))}</li>`);
        out.push(`<ol>${buf.join("")}</ol>`);
        continue;
      }
      const buf = [];                                            // 段落
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6})\s+/.test(lines[i]) &&
             !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) && !/^\s*&gt;/.test(lines[i]) &&
             !/^\s*```/.test(lines[i]) && !isRule(lines[i])) buf.push(lines[i++]);
      out.push(`<p>${inline(buf.join("<br>"))}</p>`);
    }
    return out.join("\n");
  }

     実行時に組み立てて Blob にする（データURIも使わない）。呼び出し側で Blob 化して保存する。
     乱数は使わず ID から決定的に色を決める（`Math.random()` は禁止。同じイベントは常に同じ絵になる）。
     配色は会社サイト由来（アクセント #194bf4）。**文字は入れない**——`img` で描くため書体が

    const c1 = `hsl(${hue},52%,26%)`, c2 = `hsl(${(hue + 24) % 360},62%,46%)`;

      `<circle cx="${232 + i * 52}" cy="${y}" r="9" fill="#fff" opacity=".26"/>`).join("");
    const screen = `<rect x="360" y="72" width="480" height="132" rx="10" fill="#fff" opacity=".2"/>` +

      `<rect x="384" y="124" width="220" height="12" rx="6" fill="#fff" opacity=".26"/>`;
    const screenDim = screen.replace(/opacity="\.\d+"/g, 'opacity=".14"');
    const player = (op) => `<rect x="470" y="96" width="260" height="170" rx="14" fill="#fff" opacity="${op}"/>` +
      `<circle cx="600" cy="181" r="38" fill="#fff" opacity="${op}"/>` +
      `<path d="M588 163 L624 181 L588 199 Z" fill="${c1}" opacity=".85"/>`;

      `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">` +
      `<stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>` +
      `<rect width="1200" height="400" fill="url(#g)"/>` +
      `<circle cx="90" cy="70" r="150" fill="#fff" opacity=".07"/>` +
      `<circle cx="1130" cy="350" r="190" fill="#fff" opacity=".06"/>` +
      `<path d="M0 400 L1200 250 L1200 400 Z" fill="#fff" opacity=".05"/>` +

  };

     起動時には読まないので、使わない機能のために待たされない。
     globalName が既にあれば何もしない。 */

    if (window[globalName]) return Promise.resolve(window[globalName]);
    if (_loading[src]) return _loading[src];
    _loading[src] = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src; s.async = true;

        : reject(new Error(globalName + " が読み込めませんでした"));
      s.onerror = () => { delete _loading[src]; reject(new Error("CDNに接続できません")); };
      document.head.appendChild(s);

           fmtDateTime, fmtDate, fmtRange, deadlineEnd, dayStart, weekStartMonday, daysBetween,
           csvCell, buildCsv, downloadText, copy, loadScript, markdown, coverSvg };
})();


// ===== [2] DB（IndexedDB / Promise ラップ / onupgradeneeded） =====
const DB = (() => {
  const NAME = "neo_event_tool";
  const VERSION = 5; // v5: ファイル共有 files を追加（v4: manuals / v3: readStates / v2: チケット廃止）
  let _db = null;

  function open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(NAME, VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        // create-if-missing 方式（既存データを保持したままストアを追加できる / 3-5）
        if (!db.objectStoreNames.contains("events")) {
          const s = db.createObjectStore("events", { keyPath: "id" });
          s.createIndex("status", "status");
          s.createIndex("startAt", "startAt");
        }
        // チケット制の廃止: 申込は「申込」に一本化し、定員は events.capacity が持つ（旧 F-61/4-8 を反転）
        if (db.objectStoreNames.contains("ticketTypes")) db.deleteObjectStore("ticketTypes");
        if (!db.objectStoreNames.contains("persons")) {
          const s = db.createObjectStore("persons", { keyPath: "id" });
          s.createIndex("emailKey", "emailKey", { unique: true });
        }
        if (!db.objectStoreNames.contains("applications")) {
          const s = db.createObjectStore("applications", { keyPath: "id" });
          s.createIndex("eventId", "eventId");
          s.createIndex("personId", "personId");
          s.createIndex("token", "token", { unique: true });
          s.createIndex("eventId_status", ["eventId", "status"]);
          // 注意: [eventId, personId] に unique を張らない（キャンセル後の再申込を許可 / 禁止事項）
        }
        if (!db.objectStoreNames.contains("savedTokens")) {
          const s = db.createObjectStore("savedTokens", { keyPath: "token" });
          s.createIndex("savedAt", "savedAt");
        }
        // 運営（社内）向け。同一ブラウザ内で永続。別端末との同期はサーバ導入時まで不可（4-1）
        if (!db.objectStoreNames.contains("messages")) {
          // channel で3用途を兼用する: thread（社内チャット）/ qa（社内Q&A）/ notice（参加者向けお知らせ）
          const s = db.createObjectStore("messages", { keyPath: "id" });
          s.createIndex("eventId", "eventId");
          s.createIndex("eventId_channel", ["eventId", "channel"]);
        }
        if (!db.objectStoreNames.contains("tasks")) {
          const s = db.createObjectStore("tasks", { keyPath: "id" }); // 運営タスク
          s.createIndex("eventId", "eventId");
        }
        // 既読位置（v3）。key は `${eventId}:${channel}`。未読件数はこれと messages から都度算出し、
        // 「未読かどうか」自体は保存しない（時期を保存しないのと同じ考え方 / 4-3）
        if (!db.objectStoreNames.contains("readStates")) {
          const s = db.createObjectStore("readStates", { keyPath: "key" });
          s.createIndex("eventId", "eventId");
        }
        // イベントマニュアル（v4 / F-99）。1イベント1件。本文が長くなるので events とは分ける
        // （イベント一覧は全件読むため、そこに本文を載せると無駄に重くなる）
        if (!db.objectStoreNames.contains("manuals")) {
          db.createObjectStore("manuals", { keyPath: "eventId" });
        }
        // 共有ファイル（v5 / E-3）。実体は Blob をそのまま入れる。File は Blob なので
        // FileReader を通す必要はない——通すと非同期になり、7-1 の罠に近づく
        if (!db.objectStoreNames.contains("files")) {
          const s = db.createObjectStore("files", { keyPath: "id" });
          s.createIndex("eventId", "eventId");
        }
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }

  const db = () => _db;

  // 単一レコード操作（各呼び出しが独立したトランザクション）
  function _tx(store, mode) { return _db.transaction(store, mode).objectStore(store); }
  function _wrap(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  const put    = (store, rec) => _wrap(_tx(store, "readwrite").put(rec));
  const get    = (store, key) => _wrap(_tx(store, "readonly").get(key));
  const getAll = (store)      => _wrap(_tx(store, "readonly").getAll());
  const remove = (store, key) => _wrap(_tx(store, "readwrite").delete(key));
  const getAllByIndex = (store, index, value) =>
    _wrap(_tx(store, "readonly").index(index).getAll(value));

  // 複数ストアを1トランザクションで原子的に投入（3-5 / 7-1）。
  // トランザクション内では IndexedDB 以外の await を挟まない。
  function bulkPut(entries) {
    return new Promise((resolve, reject) => {
      const stores = [...new Set(entries.map(e => e.store))];
      const tx = _db.transaction(stores, "readwrite");
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
      for (const { store, record } of entries) tx.objectStore(store).put(record);
    });
  }

  // DB全削除→再作成（F-32 / A-1 の確認項目4）
  function reset() {
    return new Promise((resolve, reject) => {
      if (_db) { _db.close(); _db = null; }
      const del = indexedDB.deleteDatabase(NAME);
      del.onsuccess = () => open().then(resolve, reject);
      del.onerror = () => reject(del.error);
      del.onblocked = () => reject(new Error("削除がブロックされました（他タブで開いている可能性）"));
    });
  }

  return { open, db, put, get, getAll, remove, getAllByIndex, bulkPut, reset };
})();

// ===== [4] ドメインロジック（時期の都度算出・残席・要対応判定） =====
const Domain = (() => {
  // 明示状態（保存する）
  const STATUS = { draft:"下書き", published:"公開中", cancelled:"中止" };
  // 開催形式（F-93）。オンライン／ハイブリッドの視聴URLは申込者にだけ見せる
  const FORMAT = { onsite:"現地開催", online:"オンライン", hybrid:"ハイブリッド" };
  /* 本システムが扱うのは**社外向けイベントのみ**（F-98）。取引先・同業他社・一般の方が
     申込む。対象範囲を選ばせる項目は持たない——選択肢が1つしかないものを聞かない。
     この前提から、問い合わせ先は常に必須になる（社外の方は社内の連絡経路を使えないため）。 */

  // 時期（保存しない。受付開始・締切日時と現在時刻から都度算出 / F-05）
  // 戻り値: {phase, label} phase ∈ before|open|closed|held|cancelled
  // applyStartAt（受付開始日）が未設定なら「受付前」は発生せず、公開と同時に受付中となる。
  function timing(ev, now = Date.now()) {
    if (ev.status === "cancelled") return { phase:"cancelled", label:"中止" };
    if (ev.endAt && new Date(ev.endAt).getTime() < now) return { phase:"held", label:"開催済" };
    const dl = Util.deadlineEnd(ev.applyDeadline);
    if (dl != null && now > dl) return { phase:"closed", label:"受付終了" };
    const st = Util.dayStart(ev.applyStartAt);
    if (st != null && now < st) return { phase:"before", label:"受付前" };
    return { phase:"open", label:"受付中" };
  }

  // 定員・残席はイベントが持つ（チケット廃止に伴い定員を events.capacity へ集約）
  function capacity(ev) { return ev.capacity || 0; }
  // 有効な申込 = キャンセル済みを除き、チェックイン済みを含む（F-18）
  const isValidApp = a => a.status === "applied" || a.status === "checkedin";
  function usedSeats(apps) { return apps.filter(isValidApp).length; }
  function remaining(ev, apps) { return capacity(ev) - usedSeats(apps); }

  // 申込ボタンの文言（F-08）
  function applyButtonLabel(ev, apps) {
    const t = timing(ev);
    if (t.phase === "cancelled") return { text:"中止されました", disabled:true };
    if (t.phase === "held")      return { text:"終了しました",   disabled:true };
    if (t.phase === "closed")    return { text:"受付終了",       disabled:true };
    if (t.phase === "before")
      return { text:`${Util.fmtDate(ev.applyStartAt)} から受付開始`, disabled:true };
    if (remaining(ev, apps) <= 0) return { text:"満席",     disabled:true };
    return { text:"申込む", disabled:false };
  }

  // 「定員間近」= 残席3以下 または 定員の10%以下（F-58）
  function nearlyFull(ev, apps) {
    const cap = capacity(ev); if (cap <= 0) return false;
    const rem = remaining(ev, apps);
    return rem > 0 && (rem <= 3 || rem <= cap * 0.1);
  }
  // 「下書き放置」= 下書きで7日以上更新なし（F-59）
  function staleDraft(ev, now = Date.now()) {
    return ev.status === "draft" && ev.updatedAt &&
      Util.daysBetween(new Date(ev.updatedAt).getTime(), now) >= 7;
  }

  // ---- 運営タスク（backlog風 / E-2） ----
  // タスクの状態は「進捗そのもの」なので保存する。イベントの時期（都度算出 / 4-3）とは別軸。
  const TASK_STATUS = { todo:"未対応", doing:"処理中", review:"処理済", done:"完了" };
  const TASK_FLOW = ["todo", "doing", "review", "done"];
  const PRIORITY = { high:"高", normal:"中", low:"低" };

  // 期限超過 = 期限日の 23:59:59 を過ぎ、かつ未着手・対応中（申込締切と同じ扱い / F-45）。
  // 「処理済」は作業自体は終わって確認待ちの状態なので、超過としては数えない。
  function taskOverdue(t, now = Date.now()) {
    if (!t.dueDate || t.status === "done" || t.status === "review") return false;
    return Util.deadlineEnd(t.dueDate) < now;
  }
  function taskSummary(tasks, now = Date.now()) {
    const by = { todo:0, doing:0, review:0, done:0 };
    tasks.forEach(t => { if (by[t.status] != null) by[t.status]++; });
    const total = tasks.length;
    return { by, total, done: by.done,
      rate: total ? Math.round(by.done / total * 100) : 0,
      overdue: tasks.filter(t => taskOverdue(t, now)).length };
  }

  return { STATUS, FORMAT, timing, capacity, isValidApp, usedSeats, remaining,
           applyButtonLabel, nearlyFull, staleDraft,
           TASK_STATUS, TASK_FLOW, PRIORITY, taskOverdue, taskSummary };
})();


// ===== [4b] 申込の業務処理（C-2 / C-3。主催者側と参加者側で共通 / F-25） =====
/* 申込・キャンセル・チェックイン・修正はここに集約する。主催者と参加者の両方から
   同じ関数を呼ぶため、処理が二重化しない。 */
const AppSvc = (() => {
  // 名寄せキーの正規化は trim と小文字化のみ。それ以上は別人の誤統合を招く（4-5）
  const emailKeyOf = (email) => String(email ?? "").trim().toLowerCase();
  // 検索用の正規化済み文字列を持たせる（F-47 / 7-5）
  const searchTextOf = (p) => Util.normalize((p.name||"") + (p.nameKana||"") + (p.email||""));

  // 申込の確定（F-16〜F-19）。名寄せ・トークン発行・端末への保存を1トランザクションで行う。
  // 定員判定は直前の読み取りに基づく。単一ブラウザ前提のため競合は考慮しない。
  async function apply(eventId, input) {
    const [ev, apps, found] = await Promise.all([
      Repo.events.get(eventId),
      Repo.applications.byEvent(eventId),
      Repo.persons.byEmailKey(emailKeyOf(input.email)),
    ]);
    if (!ev || ev.status !== "published") throw new Error("このイベントには申込できません");
    const t = Domain.timing(ev);
    if (t.phase !== "open") throw new Error(`${t.label}のため申込できません`);
    if (Domain.remaining(ev, apps) <= 0) throw new Error("定員に達したため申込できません");
    // 1人1件（F-17）。ただしキャンセル後の再申込は許す（F-42）
    if (found && apps.some(a => a.personId === found.id && Domain.isValidApp(a)))
      throw new Error("このイベントには既に申込済みです");

    const now = new Date().toISOString();
    const kana = Util.toKatakana(input.kana);           // 保存時にカタカナへ（F-52）
    const person = found
      ? { ...found, name:input.name, nameKana:kana, email:input.email,
          contactConsent: input.consent || found.contactConsent,
          consentAt: input.consent && !found.contactConsent ? now : (found.consentAt ?? null) }
      : { id:Util.uid(), emailKey:emailKeyOf(input.email), email:input.email,
          name:input.name, nameKana:kana, contactConsent:!!input.consent,
          consentAt: input.consent ? now : null, createdAt:now };
    const app = {
      id:Util.uid(), eventId, personId:person.id, token:Util.newToken(),
      status:"applied", checkinAt:null, cancelledAt:null, appliedAt:now,
      answers: input.answers || {},                      // カスタム質問の回答（F-91）
      searchText: searchTextOf(person),
    };
    // 確認トークンをこの端末に保存する（F-56）
    const saved = { token:app.token, eventId, savedAt:now };
    await Repo.bulkPut([
      { store:"persons",      record:person },
      { store:"applications", record:app },
      { store:"savedTokens",  record:saved },
    ]);
    return { app, person };
  }

  // キャンセル（F-25）。主催者側・参加者側の両方からこれを呼ぶ。記録は消さず状態だけ変える
  async function cancel(appId) {
    const app = await Repo.applications.get(appId);
    if (!app) throw new Error("申込が見つかりません");
    if (app.status === "cancelled") return app;
    const rec = { ...app, status:"cancelled", cancelledAt:new Date().toISOString() };
    await Repo.applications.put(rec);
    return rec;
  }

  // チェックインと取り消し（F-24）。checkinAt は操作時刻であり来場時刻ではない。
  // 開催済みイベントでも制限しない
  async function setCheckin(appId, on) {
    const app = await Repo.applications.get(appId);
    if (!app) throw new Error("申込が見つかりません");
    if (app.status === "cancelled") throw new Error("キャンセル済みの申込はチェックインできません");
    const rec = { ...app, status: on ? "checkedin" : "applied",
      checkinAt: on ? new Date().toISOString() : null };
    await Repo.applications.put(rec);
    return rec;
  }

  // 申込者情報の修正（F-26）。person を書き換えるので、同じ人の全申込の searchText も直す。
  // 既に別人が使っている emailKey へは変更させない（誤統合の分離は困難なため / 4-5）
  async function editApplicant(appId, { name, kana, email }) {
    const app = await Repo.applications.get(appId);
    if (!app) throw new Error("申込が見つかりません");
    const person = await Repo.persons.get(app.personId);
    if (!person) throw new Error("参加者が見つかりません");
    const key = emailKeyOf(email);
    if (key !== person.emailKey) {
      const other = await Repo.persons.byEmailKey(key);
      if (other && other.id !== person.id)
        throw new Error("このメールアドレスは別の参加者に登録されています。名寄せの誤統合を避けるため変更できません");
    }
    const p = { ...person, name, nameKana:Util.toKatakana(kana), email, emailKey:key };
    const mine = await Repo.applications.byPerson(p.id);
    await Repo.bulkPut([
      { store:"persons", record:p },
      ...mine.map(a => ({ store:"applications", record:{ ...a, searchText: searchTextOf(p) } })),
    ]);
    return p;
  }

  // 入力検証（F-16, F-52, F-53, F-54）。申込フォームと主催者の修正欄で共用する
  function validate(d) {
    const e = {};
    if (!String(d.name||"").trim()) e.name = "氏名を入力してください";
    else if (d.name.length > 50) e.name = "50文字以内で入力してください";
    if (!String(d.kana||"").trim()) e.kana = "カナを入力してください";
    else if (!/^[ぁ-んァ-ヶー\s]+$/.test(d.kana)) e.kana = "ひらがな・カタカナで入力してください";
    else if (d.kana.length > 50) e.kana = "50文字以内で入力してください";
    if (!String(d.email||"").trim()) e.email = "メールアドレスを入力してください";
    else {
      const parts = d.email.split("@");
      if (parts.length !== 2 || !parts[0] || !parts[1] || !parts[1].includes("."))
        e.email = "メールアドレスの形式が正しくありません";
      else if (d.email.length > 254) e.email = "254文字以内で入力してください";
    }
    return e;
  }

  return { apply, cancel, setCheckin, editApplicant, validate, emailKeyOf, searchTextOf };
})();


// ===== [5] フィードバック（トースト / エラーバナー） =====
const FB = (() => {
  // 完了はトースト、数秒で自動消滅（F-85）
  function toast(msg) {
    const host = document.getElementById("toastHost");
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }
  // システムエラーは上部バナー、閉じるまで残す（F-86）
  function error(msg) {
    const host = document.getElementById("bannerHost");
    host.innerHTML = `<div class="banner"><span>⚠ ${Util.esc(msg)}</span>
      <button id="bannerClose">閉じる</button></div>`;
    document.getElementById("bannerClose").onclick = () => host.innerHTML = "";
  }
  // 取り消せない操作の確認モーダル（F-87）。呼び出しごとにホストの中身を全置換
  function confirmModal({ title, body, okLabel = "実行", danger = false, onOk }) {
    const host = document.getElementById("modalHost");
    host.innerHTML = `<div class="modal">
      <h3>${Util.esc(title)}</h3>
      <p>${body}</p>
      <div class="modal-actions">
        <button class="btn" id="mCancel">キャンセル</button>
        <button class="btn ${danger ? "" : "primary"}" id="mOk"
          ${danger ? 'style="background:var(--danger);border-color:var(--danger);color:#fff"' : ""}>${Util.esc(okLabel)}</button>
      </div></div>`;
    host.classList.add("on");
    const close = () => { host.classList.remove("on"); host.innerHTML = ""; };
    host.querySelector("#mCancel").onclick = close;
    host.querySelector("#mOk").onclick = () => { close(); onOk && onOk(); };
  }
  return { toast, error, confirmModal };
})();

      mkFile("ev_public", "登壇者一覧.txt", "text/plain",

    ];

    // この端末が保持する自分の申込トークン（F-56）。マイ申込に表示される
    const saved = [apps[0], apps[3], apps[5]].map(a =>
      ({ token:a.token, eventId:a.eventId, savedAt:a.appliedAt }));

    // 1トランザクションで原子的に投入（複数ストア）
    const entries = [

// ===== [7] 主催者：ダッシュボード（S-1 / F-30, F-31） =====
const Dashboard = (() => {
  async function render(el) {
    const now = Date.now();
    const [events, apps] = await Promise.all([
      Repo.events.all(), Repo.applications.all()]);
    const appsByEv = groupBy(apps, "eventId");
    // 要対応リストに「あと何が残っているか」まで出すので、運営データも読む
    const [msgs, tasks] = await Promise.all([Repo.messages.all(), Repo.tasks.all()]);
    const msgsByEv = groupBy(msgs, "eventId");
    const tasksByEv = groupBy(tasks, "eventId");

    // 指標
    const ongoing = events.filter(e => e.status==="published" &&
      (!e.endAt || new Date(e.endAt).getTime() >= now)).length;
    const drafts = events.filter(e => e.status==="draft").length;
    // 今週の申込数（月曜起点 / 中止イベントの申込は除外 F-40）
    const wk = Util.weekStartMonday(now);
    const cancelledIds = new Set(events.filter(e=>e.status==="cancelled").map(e=>e.id));
    const weekApps = apps.filter(a => Domain.isValidApp(a) && !cancelledIds.has(a.eventId) &&
      new Date(a.appliedAt).getTime() >= wk).length;

    /* 要対応リスト（F-31 / F-31b）。**条件だけでなく「次に何をするか」まで書く。**
       「満席」とだけ出ても、増席するのか案内を出すのかが分からず手が止まるため。
       level は緊急度で、danger（今日中）→ warn（近い）→ mute（放置）の順に並べる。 */
    const attn = [];
    for (const e of events) {
      const ap = appsByEv[e.id]||[];
      const cap = Domain.capacity(e), used = Domain.usedSeats(ap), rem = Domain.remaining(e, ap);
      if (e.status==="published" && e.startAt) {
        const d = Util.daysBetween(now, new Date(e.startAt).getTime());
        if (d===0) attn.push({ ev:e, kind:"date", level:"danger", reason:"本日開催",
          action:"当日の運営を最終確認してください。受付の準備とマニュアルの確認を。" });
        else if (d===1) attn.push({ ev:e, kind:"date", level:"warn", reason:"明日開催",
          action:"前日確認のタイミングです。持ち物と担当の割り当てを済ませてください。" });
      }
      if (e.status==="published") {
        if (cap && rem <= 0) attn.push({ ev:e, kind:"full", level:"danger", reason:"満席",
          action:`定員${cap}人に達しました。増席するか、以降はお断りする案内を出してください。` });
        else if (Domain.nearlyFull(e, ap)) attn.push({ ev:e, kind:"full", level:"warn", reason:"定員間近",
          action:`残り${rem}席です。増席の要否を判断してください。` });
      }
      if (Domain.staleDraft(e, now)) {
        const days = Util.daysBetween(new Date(e.updatedAt).getTime(), now);
        attn.push({ ev:e, kind:"draft", level:"mute", reason:"下書きのまま放置",
          action:`${days}日間更新されていません。公開するか、不要なら削除してください。` });
      }
    }
    const rank = { danger:0, warn:1, mute:2 };
    attn.sort((a,b) => rank[a.level] - rank[b.level] ||
      new Date(a.ev.startAt||0) - new Date(b.ev.startAt||0));

    el.innerHTML = `
      <div class="page-head"><h2>ダッシュボード</h2>
        <span class="sub">運営の全体状況</span></div>
      <div class="grid cols-4">
        ${metric("進行中のイベント", ongoing)}
        ${metric("今週の申込数", weekApps)}
        ${metric("要対応", attn.length, "attn")}
        ${metric("下書き", drafts)}
      </div>
      ${heatmapHtml(events, apps)}
      <h3 style="margin:26px 0 10px;font-size:15px">要対応リスト</h3>
      ${attn.length ? `<div class="attn-list">${attn.map(a =>
          attnItem(a, appsByEv[a.ev.id]||[], msgsByEv[a.ev.id]||[], tasksByEv[a.ev.id]||[])).join("")}</div>`
        : `<div class="card"><div class="empty"><div class="big">対応が必要な項目はありません</div>
           すべて順調です。</div></div>`}
      ${calendarHtml(events, now)}`;

    el.querySelectorAll("[data-ev]").forEach(tr =>
      tr.onclick = () => App.openEvent(tr.dataset.ev));
    el.querySelectorAll("[data-cal-ev]").forEach(c =>
      c.onclick = (e) => { e.stopPropagation(); App.openEvent(c.dataset.calEv); });
    const nav = (sel, delta) => {
      const b = el.querySelector(sel);
      if (b) b.onclick = () => {
        const d = viewMonth ? new Date(viewMonth.y, viewMonth.m, 1) : monthOf(Date.now());
        if (delta === 0) viewMonth = null;
        else { d.setMonth(d.getMonth() + delta); viewMonth = { y:d.getFullYear(), m:d.getMonth() }; }
        render(el);
      };
    };
    nav("#calPrev", -1); nav("#calNext", 1); nav("#calToday", 0);
  }

  /* 申込ヒートマップ（F-103）。全イベントを横断して「いつ申込が入っているか」を俯瞰する。
     イベント単位の推移（EventDetail の trendHtml）とは目的が別で、こちらは季節性や
     告知の効き方を見るためのもの。矩形が182個になるので SVG ではなく CSS Grid で組む。 */
  const HM_WEEKS = 26;
  function heatmapHtml(events, apps) {
    // 中止イベントの申込は数えない（F-40。「今週の申込数」と同じ扱いに揃える）
    const cancelledIds = new Set(events.filter(e => e.status === "cancelled").map(e => e.id));
    /* 申込側のキャンセル（application.status === "cancelled"）は**除外しない**。
       ここで見たいのは「申込という行動があった事実」であって、最終的に席が埋まったかではない。
       残席や参加人数を出す箇所（Domain.usedSeats / isValidApp）とは目的が違うので、
       判定を揃えないこと。 */
    const counts = {};
    for (const a of apps) {
      if (!a.appliedAt || cancelledIds.has(a.eventId)) continue;
      const k = dayKey(new Date(a.appliedAt));
      counts[k] = (counts[k] || 0) + 1;
    }

    // 今週の月曜（F-60）から遡って26週。ちょうど 7×26 マスになる
    const start = new Date(Util.weekStartMonday(Date.now()));
    start.setDate(start.getDate() - (HM_WEEKS - 1) * 7);
    const todayK = dayKey(new Date());

    const days = [];
    for (let w = 0; w < HM_WEEKS; w++) {
      for (let r = 0; r < 7; r++) {          // r=0 が月曜、r=6 が日曜
        const d = new Date(start);
        d.setDate(start.getDate() + w * 7 + r);
        const k = dayKey(d);
        // 未来日は件数を持たない。区別する枠線などは付けない
        days.push({ d, k, n: k > todayK ? 0 : (counts[k] || 0) });
      }
    }

    /* 濃淡はパーセンタイルで区切る（F-103b）。最大値基準にすると、1日だけ突出した日が
       あったときに他の日が全部薄くなって読めなくなる。
       **母集団は「2件以上の日」に限る。** 0件と1件は専用の段を持つので、残り3段が
       受け持つのは2件以上の日だけ。0件を含めると期間の大半が0のときに p33=p66=0 に、
       1件を含めると1件の日が大半のときに p33=p66=1 になり、どちらも中間の段が空になる
       （実データで両方とも起きた）。 */
    const nz = days.map(x => x.n).filter(n => n >= 2).sort((a, b) => a - b);
    const pct = (q) => nz.length ? nz[Math.min(nz.length - 1, Math.floor(nz.length * q))] : 0;
    const p33 = pct(0.33), p66 = pct(0.66);
    const level = (n) => !n ? 0 : n === 1 ? 1 : n < p33 ? 2 : n < p66 ? 3 : 4;

    const total = days.reduce((s, x) => s + x.n, 0);
    const top = days.reduce((a, b) => b.n > a.n ? b : a, days[0]);
    const label = total
      ? `直近${HM_WEEKS}週の日別申込数のヒートマップ。合計${total}件、最多は ${Util.fmtDate(top.k)} の${top.n}件`
      : `直近${HM_WEEKS}週の日別申込数のヒートマップ。この期間の申込はありません`;

    // 月ラベル。週の月曜の月が前の週と変わったところに出す
    let prevMonth = -1;
    const months = [];
    for (let w = 0; w < HM_WEEKS; w++) {
      const mon = days[w * 7].d.getMonth();
      months.push(mon !== prevMonth ? `<span>${mon + 1}月</span>` : "<span></span>");
      prevMonth = mon;
    }

    return `
      <div class="card pad hm" style="margin-top:14px">
        <div class="th">申込ヒートマップ
          <span>直近${HM_WEEKS}週・全イベント横断（中止イベントを除く）・合計${total}件</span></div>
        <div class="hm-body">
          <div class="hm-side">${
            [0,1,2,3,4,5,6].map(r => `<div>${r % 2 === 0 && r < 5 ? WD[(r + 1) % 7] : ""}</div>`).join("")}</div>
          <div class="hm-cols">
            <div class="hm-months">${months.join("")}</div>
            <div class="hm-grid" role="img" aria-label="${Util.esc(label)}">${
              days.map(x => `<div class="l${level(x.n)}" data-n="${x.n}"
                title="${x.k}（${WD[x.d.getDay()]}）: ${x.n}件"></div>`).join("")}</div>
          </div>
        </div>
        <div class="hm-legend">少
          ${[0,1,2,3,4].map(l => `<i style="background:var(--hm-${l})"></i>`).join("")}
          多</div>
      </div>`;
  }

  /* 要対応の1件。**やるべきことを本文として出し、状況を下に添える。**
     クリックでそのイベントの詳細へ飛ぶ。 */
  function attnItem(a, apps, msgs, tasks) {
    const e = a.ev;
    const cap = Domain.capacity(e), used = Domain.usedSeats(apps), rem = Domain.remaining(e, apps);
    const ts = Domain.taskSummary(tasks);
    const openQa = msgs.filter(m => m.channel === "qa" && !m.resolved).length;
    const todo = ts.by.todo + ts.by.doing;

    const facts = [];
    facts.push(`🗓 ${Util.fmtRange(e.startAt, e.endAt)}`);
    if (cap) facts.push(`👥 申込 ${used}／${cap}（残${rem > 0 ? rem : 0}）`);
    if (e.venueName) facts.push(`📍 ${Util.esc(e.venueName)}`);

    // 「あと何が残っているか」。ここが無いと、開いてみるまで作業量が読めない
    const rest = [];
    if (ts.overdue) rest.push(`<span class="r danger">期限超過 ${ts.overdue}</span>`);
    if (todo)       rest.push(`<span class="r warn">未対応タスク ${todo}</span>`);
    if (openQa)     rest.push(`<span class="r warn">未解決Q&amp;A ${openQa}</span>`);
    if (ts.total && !todo && !ts.overdue) rest.push(`<span class="r ok">タスクは完了</span>`);
    if (!ts.total) rest.push(`<span class="r mute">タスク未登録</span>`);

    return `<div class="attn-item ${a.level}" data-ev="${e.id}">
      <div class="ai-bar"></div>
      <div class="ai-main">
        <div class="ai-top">
          <span class="badge ${a.level === "danger" ? "cancelled" : a.level === "warn" ? "limited" : "draft"}">${a.reason}</span>
          <span class="ai-title">${Util.esc(e.title)}</span>
        </div>
        <div class="ai-act">${Util.esc(a.action)}</div>
        <div class="ai-facts">${facts.map(f => `<span>${f}</span>`).join("")}</div>
        <div class="ai-rest">${rest.join("")}</div>
      </div>
      <div class="ai-go">開く →</div>
    </div>`;
  }

  /* 月カレンダー（F-100）。要対応リストの下に置き、イベントがいつあるかを俯瞰する。
     開催日が未設定のイベントは置く場所が無いので、件数だけ下に添える。 */
  let viewMonth = null;   // { y, m }。null なら今月（月を送っても再描画で保持する）
  const monthOf = (ts) => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), 1); };
  const pad2 = (n) => String(n).padStart(2, "0");
