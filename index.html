  const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const WD = ["日","月","火","水","木","金","土"];

  function calendarHtml(events, now) {
    const first = viewMonth ? new Date(viewMonth.y, viewMonth.m, 1) : monthOf(now);
    const y = first.getFullYear(), m = first.getMonth();
    const todayKey = dayKey(new Date(now));

    // 開催日から終了日までの各日にイベントを置く（複数日にまたがる場合に対応）
    const byDay = {};
    const undated = [];
    for (const e of events) {
      if (!e.startAt) { undated.push(e); continue; }
      const s = new Date(e.startAt); s.setHours(0,0,0,0);
      const eend = e.endAt ? new Date(e.endAt) : new Date(e.startAt); eend.setHours(0,0,0,0);
      for (const d = new Date(s); d <= eend; d.setDate(d.getDate()+1)) {
        (byDay[dayKey(d)] ||= []).push(e);
        if (Object.keys(byDay).length > 2000) break;   // 異常データでの暴走止め
      }
    }

    // 月の最初の週の日曜から、最後の週の土曜まで
    const start = new Date(y, m, 1 - first.getDay());
    const lastDay = new Date(y, m + 1, 0);
    const cellCount = Math.ceil((first.getDay() + lastDay.getDate()) / 7) * 7;

    const cells = [];
    for (let i = 0; i < cellCount; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = dayKey(d);
      const list = (byDay[k] || []).slice(0, 3);
      const more = (byDay[k] || []).length - list.length;
      cells.push(`<div class="cal-cell ${d.getMonth() !== m ? "out" : ""} ${
        d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : ""} ${k === todayKey ? "today" : ""}">
        <div class="cal-d">${d.getDate()}</div>
        ${list.map(e => calChip(e, now)).join("")}
        ${more > 0 ? `<div class="cal-more">他${more}件</div>` : ""}
      </div>`);
    }

    const label = `${y}年${m + 1}月`;
    const isThisMonth = !viewMonth;
    return `
      <h3 style="margin:26px 0 10px;font-size:15px">開催カレンダー</h3>
      <div class="card cal">
        <div class="cal-head">
          <button class="btn sm" id="calPrev">← 前の月</button>
          <div class="cal-title">${label}</div>
          <button class="btn sm" id="calNext">次の月 →</button>
          <button class="btn sm ${isThisMonth ? "" : "primary"}" id="calToday"
            ${isThisMonth ? "disabled style=opacity:.45" : ""}>今月</button>
        </div>
        <div class="cal-grid">
          ${WD.map((w, i) => `<div class="cal-wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")}
          ${cells.join("")}
        </div>
      </div>
      ${undated.length ? `<div class="cal-undated">日程未定 ${undated.length}件:
        ${undated.map(e => `<span class="chip" data-cal-ev="${e.id}">${Util.esc(e.title)}</span>`).join("")}</div>` : ""}`;
  }

  // 日セルに置くイベントの帯。状態と時期で色を変える
  function calChip(e, now) {
    const t = Domain.timing(e, now);
    const cls = e.status === "cancelled" ? "cancelled"
      : e.status === "draft" ? "draft"
      : t.phase === "held" ? "held" : "open";
    return `<div class="cal-chip ${cls}" data-cal-ev="${e.id}"
      title="${Util.esc(e.title)} / ${Domain.STATUS[e.status]} / ${Domain.FORMAT[e.eventFormat||"onsite"]}">
      ${e.startAt ? `<b>${pad2(new Date(e.startAt).getHours())}:${pad2(new Date(e.startAt).getMinutes())}</b> ` : ""}${Util.esc(e.title)}</div>`;
  }

  const metric = (label, value, cls="") =>
    `<div class="card metric ${cls}"><div class="label">${label}</div>
      <div class="value">${value}<small> 件</small></div></div>`;
  return { render };
})();


// ===== [8] 主催者：イベント一覧（S-2 / F-44, F-79） =====
const EventsList = (() => {
  // 時期トグル。初期は 未定+これから ON、終了・中止 OFF（F-44）
  const state = { undated:true, upcoming:true, past:false };

  async function render(el) {
    const now = Date.now();
    const [events, apps] = await Promise.all([
      Repo.events.all(), Repo.applications.all()]);
    const appsByEv = groupBy(apps, "eventId");
    // 運営状況（未解決Q&A・未対応タスク・準備の進捗）もカードに出すので、まとめて読む
    const [msgs, tasks, readRows] = await Promise.all([
      Repo.messages.all(), Repo.tasks.all(), Repo.readStates.all()]);
    const msgsByEv = groupBy(msgs, "eventId");
    const tasksByEv = groupBy(tasks, "eventId");
    const reads = Ops.readMap(readRows);

    // 区分（F-44 表）
    const groups = { undated:[], upcoming:[], past:[] };
    for (const e of events) {
      const started = e.startAt ? new Date(e.startAt).getTime() : null;
      if (started == null && e.status !== "cancelled") groups.undated.push(e);
      else if (e.status === "cancelled") groups.past.push(e);
      else if (started < now) groups.past.push(e);
      else groups.upcoming.push(e); // 開催日 ≧ 今日（中止を除く）
    }
    groups.undated.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)); // 作成日降順
    groups.upcoming.sort((a,b)=> new Date(a.startAt)-new Date(b.startAt));    // 開催日昇順
    groups.past.sort((a,b)=> new Date(b.startAt||b.createdAt)-new Date(a.startAt||a.createdAt)); // 降順

    const order = [
      ["undated","日程未定"], ["upcoming","これから"], ["past","終了・中止"]
    ].filter(([k]) => state[k]);

    const cardsHtml = order.map(([k,label]) => {
      const arr = groups[k];
      if (!arr.length) return "";
      return `<div class="grouphead">${label}（${arr.length}）</div>
        <div class="evgrid">${arr.map(e => cardFor(e,
          appsByEv[e.id]||[], msgsByEv[e.id]||[], tasksByEv[e.id]||[], reads)).join("")}</div>`;
    }).join("");

    const anyOn = order.length > 0;
    el.innerHTML = `
      <div class="page-head"><h2>イベント</h2>
        <button class="btn primary" id="newEvent">＋ 新規作成</button>
        <div class="toggles">
          ${toggleBtn("undated","日程未定")}
          ${toggleBtn("upcoming","これから")}
          ${toggleBtn("past","終了・中止")}
        </div></div>
      ${anyOn && cardsHtml ? cardsHtml
        : `<div class="card"><div class="empty"><div class="big">表示するイベントがありません</div>
           ${!anyOn?"時期トグルをONにしてください。":"設定画面からシードデータを投入できます。"}</div></div>`}`;

    el.querySelector("#newEvent").onclick = () => App.openCreate();
    el.querySelectorAll(".toggles button").forEach(b =>
      b.onclick = () => { state[b.dataset.k] = !state[b.dataset.k]; render(el); });
    el.querySelectorAll("[data-ev]").forEach(c =>
      c.onclick = () => App.openEvent(c.dataset.ev));
  }

  const toggleBtn = (k,label) =>
    `<button class="${state[k]?'on':''}" data-k="${k}">${label}</button>`;

  /* イベントカード（S-2 / F-79）。1行のテーブルでは運営の状況が見えないため、
     カードにして「申込・残席」と「準備の進み具合」を並べて出す。
     準備の進捗は運営タスク（E-2）の完了率をそのまま使う。 */
  function cardFor(e, apps, msgs, tasks, reads) {
    const cap = Domain.capacity(e), used = Domain.usedSeats(apps);
    const rem = Domain.remaining(e, apps);
    const t = Domain.timing(e);
    const done = e.status === "cancelled" || t.phase === "held";

    const badges = [`<span class="badge ${e.status}">${Domain.STATUS[e.status]}</span>`,
      `<span class="badge phase ${t.phase==="held"?"ended":t.phase==="before"?"before":""}">${t.label}</span>`];
    if (e.visibility === "limited" && e.status !== "cancelled")
      badges.push(`<span class="badge limited">限定公開</span>`);
    if (!done && cap && rem <= 0) badges.push(`<span class="badge phase full">満席</span>`);
    else if (!done && Domain.nearlyFull(e, apps)) badges.push(`<span class="badge limited">定員間近</span>`);

    // 準備の進捗＝運営タスクの完了率（E-2）
    const ts = Domain.taskSummary(tasks);
    const openQa = msgs.filter(m => m.channel === "qa" && !m.resolved).length;
    const todo = ts.by.todo + ts.by.doing;
    const unread = Ops.unreadOf(msgs, "thread", reads, e.id);

    // 要対応の見出し。終了・中止したイベントでは出さない（未読だけは終了後も出す）
    const flags = [];
    if (unread) flags.push(`<span class="fl new">💬 未読のスレッド投稿 ${unread}件</span>`);
    if (!done) {
      if (ts.overdue) flags.push(`<span class="fl danger">⚠ 期限超過 ${ts.overdue}</span>`);
      if (todo)       flags.push(`<span class="fl warn">未対応タスク ${todo}</span>`);
      if (openQa)     flags.push(`<span class="fl warn">未解決Q&amp;A ${openQa}</span>`);
      if (!flags.length && ts.total) flags.push(`<span class="fl ok">準備は順調</span>`);
      if (!ts.total)  flags.push(`<span class="fl mute">タスク未登録</span>`);
    }

    const seatPct = cap ? Math.min(100, Math.round(used / cap * 100)) : 0;
    return `<div class="evcard ${done?"done":""} ${unread?"unread":""}" data-ev="${e.id}">
      <div class="badges">${badges.join(" ")}</div>
      <div class="ttl">${Util.esc(e.title)}</div>
      <div class="meta">
        <span>🗓 ${Util.fmtRange(e.startAt, e.endAt)}</span>
        <span>📍 ${Util.esc(e.venueName) || "—"}</span>
      </div>
      <div class="bars">
        <div class="bar">
          <div class="bl"><span>申込</span><b>${used}${cap?` / ${cap}`:""}</b>${
            cap ? `<span class="sub">残${rem > 0 ? rem : 0}</span>` : `<span class="sub">定員未設定</span>`}</div>
          <div class="track"><span class="fill seats ${cap&&rem<=0?"full":""}" style="width:${seatPct}%"></span></div>
        </div>
        <div class="bar">
          <div class="bl"><span>準備</span><b>${ts.total ? `${ts.done} / ${ts.total}` : "—"}</b>${
            ts.total ? `<span class="sub">${ts.rate}%</span>` : `<span class="sub">タスクなし</span>`}</div>
          <div class="track"><span class="fill prep" style="width:${ts.rate}%"></span></div>
        </div>
      </div>
      ${flags.length ? `<div class="flags">${flags.join("")}</div>` : ""}
    </div>`;
  }
  return { render };
})();


// ===== [9] 主催者：イベント詳細 S-4（固定表示＋サブタブ 申込/告知/概要編集） =====
const EventDetail = (() => {
  const STATUS_LABEL = { applied:"申込済", checkedin:"チェックイン済", cancelled:"キャンセル" };
  const STATUS_CLASS = { applied:"phase", checkedin:"published", cancelled:"draft" };
  let ctx = null;      // { ev, apps, _persons, tasks, el }
  // サブタブは9つ（F-75）。通知から特定のタブを指定して開けるように一覧を持つ
  const TABS = ["apply","thread","qa","tasks","manual","files","notice","promo","edit"];
  let tab = "apply";   // 初期タブは申込（F-75）
  let expandedId = null;
  let query = "";      // 申込一覧の絞り込み語（操作後の再描画でも保持する）

  function paint() {
    const { ev, apps, el } = ctx;
    const t = Domain.timing(ev);
    const cap = Domain.capacity(ev), used = Domain.usedSeats(apps), rem = Domain.remaining(ev, apps);
    el.innerHTML = `
      <div class="page-head"><button class="btn ghost" id="back">← 一覧へ</button></div>
      <div class="card pad statusbar">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
          <h2>${Util.esc(ev.title)}</h2>
          <span class="badge ${ev.status}">${Domain.STATUS[ev.status]}</span>
          <span class="badge phase ${t.phase==='held'?'ended':t.phase==='before'?'before':''}">${t.label}</span>
          ${ev.visibility==="limited"&&ev.status!=="cancelled"?'<span class="badge limited">限定公開</span>':""}
        </div>
        <div class="meta">
          <span>🗓 <b>${Util.fmtRange(ev.startAt, ev.endAt)}</b></span>
          <span>📍 <b>${Util.esc(ev.venueName)||"—"}</b></span>
          <span>👥 申込 <b>${used}</b>／${cap||"—"}</span>
          <span>🪑 残席 <b>${cap?rem:"—"}</b></span>
          <span id="taskChip">${taskChip()}</span>
        </div>
      </div>
      <div class="subtabs" id="subtabs">
        <button data-tab="apply" class="${tab==='apply'?'on':''}">申込</button>
        <button data-tab="thread" class="${tab==='thread'?'on':''}">運営スレッド${
          ctx.unread ? `<span class="tabdot">${ctx.unread}</span>` : ""}</button>
        <button data-tab="qa" class="${tab==='qa'?'on':''}">運営Q&amp;A</button>
        <button data-tab="tasks" class="${tab==='tasks'?'on':''}">運営タスク</button>
        <button data-tab="manual" class="${tab==='manual'?'on':''}">マニュアル</button>
        <button data-tab="files" class="${tab==='files'?'on':''}">ファイル</button>
        <button data-tab="notice" class="${tab==='notice'?'on':''}">お知らせ</button>
        <button data-tab="promo" class="${tab==='promo'?'on':''}">告知</button>
        <button data-tab="edit" class="${tab==='edit'?'on':''}">概要・編集</button>
      </div>
      <div id="subpane"></div>`;

    el.querySelector("#back").onclick = () => App.go("events");
    el.querySelectorAll("#subtabs button").forEach(b =>
      b.onclick = () => { tab = b.dataset.tab; expandedId = null; paint(); });

    const pane = el.querySelector("#subpane");
    if (tab === "apply") renderApply(pane);
    else if (tab === "thread") Ops.renderThread(pane, ev.id, clearUnread);
    else if (tab === "qa") Ops.renderQA(pane, ev.id);
    else if (tab === "tasks") Tasks.render(pane, ev.id, refreshTaskChip);
    else if (tab === "manual") Manual.render(pane, ev.id);
    else if (tab === "files") Files.render(pane, ev.id);
    else if (tab === "notice") Ops.renderNotice(pane, ev.id);
    else if (tab === "promo") renderPromo(pane);
    else renderEdit(pane);
  }

  // タスク進捗は固定表示にも出す（F-76 の状況表示にタスクを1件加える）
  function taskChip() {
    const s = Domain.taskSummary(ctx.tasks || []);
    if (!s.total) return "";
    return `✅ タスク <b>${s.done}/${s.total}</b>` +
      (s.overdue ? ` <span style="color:var(--danger);font-weight:700">超過${s.overdue}</span>` : "");
  }
  // スレッドを開いたらサブタブの未読バッジを消す（ペインは再描画しない）
  function clearUnread() {
    if (!ctx || !ctx.unread) return;
    ctx.unread = 0;
    const b = ctx.el.querySelector('#subtabs [data-tab="thread"] .tabdot');
    if (b) b.remove();
  }

  // Tasks 側の更新後に固定表示だけを差し替える（サブペインは再描画しない）
  async function refreshTaskChip() {
    ctx.tasks = await Repo.tasks.byEvent(ctx.ev.id);
    const chip = ctx.el.querySelector("#taskChip");
    if (chip) chip.innerHTML = taskChip();
  }

  // ---- 申込タブ（一覧・検索・チェックイン・CSV / F-22〜F-28, F-77, F-78） ----
  function renderApply(pane) {
    pane.innerHTML = `
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <input id="searchBox" value="${Util.esc(query)}" placeholder="氏名・カナ・メールで絞り込み" style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit">
        <button class="btn" id="qrBtn">QRで受付</button>
        <button class="btn" id="csvBtn">CSV出力</button>
      </div>
      <div id="scanHost"></div>
      ${trendHtml(ctx.apps)}
      <div class="card"><table class="list">
        <thead><tr><th>氏名</th><th>カナ</th><th>状態</th><th style="width:120px">操作</th></tr></thead>
        <tbody id="appRows"></tbody>
      </table></div>`;

    const box = pane.querySelector("#searchBox");
    box.oninput = () => { query = box.value; paintRows(pane); };
    paintRows(pane);

    pane.querySelector("#csvBtn").onclick = () => exportCsv();
    pane.querySelector("#qrBtn").onclick = () => startScan(pane);
  }

  /* QRでの受付（F-95）。カメラで参加者のトークンを読み、そのままチェックインする。
     読み取りライブラリは CDN から必要時のみ取得する。1台での運用のみ——複数端末での
     同時受付は端末間でチェックイン状態を共有できないため不可能（4-1）。 */
  let scanStop = null;
  async function startScan(pane) {
    const host = pane.querySelector("#scanHost");
    if (scanStop) { scanStop(); return; }
    host.innerHTML = `<div class="scan"><div class="sh">カメラを起動しています…</div></div>`;
    let stream, raf;
    const stop = () => {
      scanStop = null;
      if (raf) cancelAnimationFrame(raf);
      if (stream) stream.getTracks().forEach(t => t.stop());
      host.innerHTML = "";
    };
    scanStop = stop;
    try {
      const jsQR = await Util.loadScript(QR_READ_LIB, "jsQR");
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      host.innerHTML = `<div class="scan">
        <div class="sh">QRをかざしてください</div>
        <video id="scanVideo" playsinline muted></video>
        <div class="row-actions"><button class="btn sm" id="scanStop">停止</button></div>
        <div class="sr" id="scanResult"></div></div>`;
      host.querySelector("#scanStop").onclick = stop;
      const video = host.querySelector("#scanVideo");
      video.srcObject = stream;
      await video.play();
      const canvas = document.createElement("canvas");
      const cx = canvas.getContext("2d", { willReadFrequently: true });
      const seen = new Set();
      const tick = () => {
        if (!scanStop) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          cx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = cx.getImageData(0, 0, canvas.width, canvas.height);
          const hit = jsQR(img.data, img.width, img.height);
          if (hit && hit.data && !seen.has(hit.data)) {
            seen.add(hit.data);
            handleScan(hit.data, host.querySelector("#scanResult"), pane);
          }
        }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    } catch (e) {
      stop();
      FB.error("カメラを起動できません: " + e.message + "（氏名検索での受付をご利用ください）");
    }
  }

  async function handleScan(token, out, pane) {
    const app = ctx.apps.find(a => a.token === token);
    if (!app) { out.innerHTML = `<span class="ng">このイベントの申込ではありません</span>`; return; }
    const p = ctx._persons[app.personId] || {};
    if (app.status === "cancelled") {
      out.innerHTML = `<span class="ng">${Util.esc(p.name)} さんはキャンセル済みです</span>`; return;
    }
    if (app.status === "checkedin") {
      out.innerHTML = `<span class="ng">${Util.esc(p.name)} さんは受付済みです（${Util.fmtDateTime(app.checkinAt)}）</span>`; return;
    }
    try {
      await AppSvc.setCheckin(app.id, true);
      ctx.apps = await Repo.applications.byEvent(ctx.ev.id);
      out.innerHTML = `<span class="ok">✅ ${Util.esc(p.name)} さんを受付しました</span>`;
      paintRows(pane);
    } catch (e) { out.innerHTML = `<span class="ng">${Util.esc(e.message)}</span>`; }
  }

  /* 申込推移（F-96）。appliedAt を日別に積み上げる。サーバ無しでも描けるので、
     「閲覧数の計測（サーバが必要）」とは区別される。 */
  function trendHtml(apps) {
    const valid = apps.filter(a => a.appliedAt);
    if (valid.length < 2) return "";
    const key = (iso) => { const d = new Date(iso);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
    const counts = {};
    valid.forEach(a => { counts[key(a.appliedAt)] = (counts[key(a.appliedAt)] || 0) + 1; });
    const days = Object.keys(counts).sort();
    const first = new Date(days[0] + "T00:00:00"), last = new Date(days[days.length-1] + "T00:00:00");
    const series = [];
    let cum = 0;
    for (const d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const n = counts[k] || 0; cum += n;
      series.push({ k, n, cum });
    }
    const max = Math.max(...series.map(s => s.n), 1);
    const W = 4, GAP = 2, H = 46;
    const width = series.length * (W + GAP);
    return `<div class="card pad trend">
      <div class="th">申込の推移 <span>${series.length}日間・累計 ${cum}件</span></div>
      <svg width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="申込推移">
        ${series.map((s, i) => {
          const h = s.n ? Math.max(2, Math.round(s.n / max * (H - 12))) : 1;
          return `<rect x="${i*(W+GAP)}" y="${H-h}" width="${W}" height="${h}"
            fill="${s.n ? "var(--blue)" : "#dde3ee"}"><title>${s.k}: ${s.n}件（累計${s.cum}）</title></rect>`;
        }).join("")}
      </svg>
      <div class="tl2"><span>${Util.fmtDate(series[0].k)}</span><span>${Util.fmtDate(series[series.length-1].k)}</span></div>
    </div>`;
  }

  function paintRows(pane) {
    const { apps } = ctx;
    const q = Util.normalize(query);
    const rows = apps.filter(a => !q || a.searchText.includes(q));
    const persons = ctx._persons || {};
    const tbody = pane.querySelector("#appRows");
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty">${apps.length ? "一致する申込がありません" : "申込がありません"}</div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(a => {
      const p = persons[a.personId] || {};
      const checkedin = a.status === "checkedin";
      const opBtn = a.status === "cancelled" ? "—"
        : `<button class="btn sm ${checkedin?'':'primary'}" data-checkin="${a.id}">${checkedin?"受付取消":"チェックイン"}</button>`;
      const main = `<tr class="clickable" data-row="${a.id}">
        <td>${Util.esc(p.name||"—")}</td>
        <td>${Util.esc(p.nameKana||"—")}</td>
        <td><span class="badge ${STATUS_CLASS[a.status]}">${STATUS_LABEL[a.status]}</span></td>
        <td>${opBtn}</td></tr>`;
      const exp = expandedId === a.id ? `<tr class="expand-row"><td colspan="4"><div class="expand-inner">
        <div class="kv2">
          <div><div class="k">メールアドレス</div>${Util.esc(p.email||"—")}</div>
          <div><div class="k">申込日時</div>${Util.fmtDateTime(a.appliedAt)}</div>
          <div><div class="k">チェックイン時刻</div>${a.checkinAt?Util.fmtDateTime(a.checkinAt):"—"}</div>
          ${a.cancelledAt?`<div><div class="k">キャンセル日時</div>${Util.fmtDateTime(a.cancelledAt)}</div>`:""}
        </div>
        ${answersHtml(a)}
        <div class="row-actions">
          <button class="btn sm" data-edit="${a.id}">内容を修正</button>
          ${a.status==="cancelled" ? ""
            : `<button class="btn sm" data-cancel="${a.id}" style="color:var(--danger)">申込をキャンセル</button>`}
        </div></div></td></tr>` : "";
      return main + exp;
    }).join("");

    // 行クリックで展開（操作ボタンのクリックは伝播させない）
    tbody.querySelectorAll("tr[data-row]").forEach(tr =>
      tr.onclick = () => { expandedId = expandedId === tr.dataset.row ? null : tr.dataset.row; paintRows(pane); });

    const after = async (fn, msg) => {
      try { await fn(); ctx.apps = await Repo.applications.byEvent(ctx.ev.id); FB.toast(msg); paint(); }
      catch (e) { FB.error(e.message); }
    };
    tbody.querySelectorAll("[data-checkin]").forEach(b =>
      b.onclick = (e) => {
        e.stopPropagation();
        const a = ctx.apps.find(x => x.id === b.dataset.checkin);
        const on = a.status !== "checkedin";
        after(() => AppSvc.setCheckin(a.id, on), on ? "チェックインしました" : "受付を取り消しました");
      });
    tbody.querySelectorAll("[data-cancel]").forEach(b =>
      b.onclick = (e) => {
        e.stopPropagation();
        FB.confirmModal({ title:"この申込をキャンセルしますか？", okLabel:"キャンセルする", danger:true,
          body:"記録は残りますが、状態がキャンセルになり定員から外れます。",
          onOk:() => after(() => AppSvc.cancel(b.dataset.cancel), "申込をキャンセルしました") });
      });
    tbody.querySelectorAll("[data-edit]").forEach(b =>
      b.onclick = (e) => { e.stopPropagation(); openApplicantEditor(b.dataset.edit); });
  }

  // カスタム質問の回答（F-91）。イベントに質問が定義されているときだけ出す
  function answersHtml(a) {
    const qs = ctx.ev.questions || [];
    if (!qs.length) return "";
    return `<div class="kv2" style="margin-bottom:12px">${qs.map(q => {
      const v = (a.answers || {})[q.id];
      const shown = q.type === "checkbox" ? (v ? "はい" : "いいえ") : (v || "—");
      return `<div><div class="k">${Util.esc(q.label)}</div>${Util.esc(shown)}</div>`;
    }).join("")}</div>`;
  }

  // 申込内容の修正（F-26）。person を書き換えるため、同じ人の他の申込にも反映される
  async function openApplicantEditor(appId) {
    const a = ctx.apps.find(x => x.id === appId);
    const p = ctx._persons[a.personId] || {};
    const host = document.getElementById("modalHost");
    host.innerHTML = `<div class="modal wide">
      <h3>申込内容を修正</h3>
      <div class="field" style="margin-top:14px"><label>氏名</label>
        <input id="edName" value="${Util.esc(p.name||"")}"></div>
      <div class="field"><label>氏名（カナ）</label>
        <input id="edKana" value="${Util.esc(p.nameKana||"")}"></div>
      <div class="field"><label>メールアドレス</label>
        <input id="edEmail" value="${Util.esc(p.email||"")}"></div>
      <div class="hint">参加者の情報を修正します。同じ方の他のイベントの申込にも反映されます。</div>
      <div class="err" id="edErr" style="color:var(--danger);font-size:12px;min-height:18px;margin-top:8px"></div>
      <div class="modal-actions">
        <button class="btn" id="edCancel">キャンセル</button>
        <button class="btn primary" id="edSave">保存</button>
      </div></div>`;
    host.classList.add("on");
    const q = (s) => host.querySelector(s);
    const close = () => { host.classList.remove("on"); host.innerHTML = ""; };
    q("#edCancel").onclick = close;
    q("#edSave").onclick = async () => {
      const d = { name:q("#edName").value.trim(), kana:q("#edKana").value.trim(),
        email:q("#edEmail").value.trim() };
      const errs = AppSvc.validate(d);
      const first = Object.values(errs)[0];
      if (first) { q("#edErr").textContent = first; return; }
      try {
        await AppSvc.editApplicant(appId, d);
        close();
        FB.toast("申込内容を修正しました");
        await render(ctx.el, ctx.ev.id);
      } catch (e) { q("#edErr").textContent = e.message; }
    };
  }

  function exportCsv() {
    const { ev, apps } = ctx;
    const persons = ctx._persons || {};
    const qs = ev.questions || [];
    const header = ["申込番号","氏名","氏名（カナ）","メールアドレス","状態","申込日時","チェックイン時刻",
      ...qs.map(q => q.label)];   // カスタム質問を列として出す（F-91 / Peatix のフォーム取得相当）
    const body = apps.map(a => {
      const p = persons[a.personId] || {};
      return [a.id, p.name||"", p.nameKana||"", p.email||"",
        STATUS_LABEL[a.status], Util.fmtDateTime(a.appliedAt), a.checkinAt?Util.fmtDateTime(a.checkinAt):"",
        ...qs.map(q => {
          const v = (a.answers || {})[q.id];
          return q.type === "checkbox" ? (v ? "はい" : "いいえ") : (v ?? "");
        })];
    });
    Util.downloadText(`applications_${ev.id}.csv`, Util.buildCsv([header, ...body]));
    FB.toast("CSVを出力しました");
  }

  // ---- 告知タブ（共有URL・投稿文・X/LINE / F-10〜F-15） ----
  function renderPromo(pane) {
    const { ev } = ctx;
    const url = shareUrl(ev);
    const text = postText(ev, url);
    pane.innerHTML = `
      <div class="card pad">
        <h3 style="font-size:15px;margin-bottom:8px">共有URL</h3>
        <div class="copybox"><input id="urlBox" readonly value="${Util.esc(url)}">
          <button class="btn" id="copyUrl">コピー</button></div>
      </div>
      <div class="card pad" style="margin-top:14px">
        <h3 style="font-size:15px;margin-bottom:8px">投稿文</h3>
        <div class="field"><textarea id="postBox" style="min-height:120px">${Util.esc(text)}</textarea></div>
        <div class="row-actions">
          <button class="btn primary" id="copyPost">投稿文をコピー</button>
          <a class="btn" id="xShare" target="_blank" rel="noopener">Xで共有</a>
          <a class="btn" id="lineShare" target="_blank" rel="noopener">LINEで共有</a>
        </div>
      </div>`;
    pane.querySelector("#copyUrl").onclick = async () =>
      FB.toast(await Util.copy(url) ? "URLをコピーしました" : "コピーできませんでした");
    pane.querySelector("#copyPost").onclick = async () =>
      FB.toast(await Util.copy(pane.querySelector("#postBox").value) ? "投稿文をコピーしました" : "コピーできませんでした");
    const setLinks = () => {
      const body = pane.querySelector("#postBox").value;
      pane.querySelector("#xShare").href =
        `https://twitter.com/intent/tweet?text=${encodeURIComponent(body)}&url=${encodeURIComponent(url)}&hashtags=${encodeURIComponent("イベント")}`;
      pane.querySelector("#lineShare").href =
        `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}`; // URLのみ（F-15）
    };
    pane.querySelector("#postBox").oninput = setLinks;
    setLinks();
  }
  const shareUrl = (ev) => `${location.origin}${location.pathname}?event=${ev.id}`;
  const postText = (ev, url) =>
`【${ev.title}】を開催します！
🗓 ${ev.startAt ? Util.fmtDateTime(ev.startAt) : "日程調整中"}
📍 ${ev.venueName || "会場調整中"}
参加申込はこちら👇
${url}`;

  // ---- 概要・編集タブ（編集導線＋状態遷移 / F-04, F-37, F-38, F-87） ----
  function renderEdit(pane) {
    const { ev } = ctx;
    const canPublish = ev.status === "draft";
    const canCancel = ev.status === "published";
    const canDelete = ev.status === "draft"; // 削除は下書きのみ（F-01）
    pane.innerHTML = `
      <div class="card pad">
        <div class="summary">
          <div class="row"><span class="k">開催日時</span><span>${Util.fmtRange(ev.startAt, ev.endAt)}</span></div>
          <div class="row"><span class="k">開催形式</span><span>${Domain.FORMAT[ev.eventFormat||"onsite"]}${
            ev.onlineUrl ? `<span class="hint" style="display:inline;margin-left:8px">視聴URLあり（申込者のみに表示）</span>` : ""}</span></div>
          <div class="row"><span class="k">会場</span><span>${Util.esc(ev.venueName)||"—"}</span></div>
          <div class="row"><span class="k">説明</span><span style="white-space:pre-wrap">${Util.esc(ev.description)||"—"}</span></div>
          <div class="row"><span class="k">対象者</span><span>${Util.esc(ev.targetAudience)||"—"}</span></div>
          <div class="row"><span class="k">住所</span><span>${Util.esc(ev.venueAddress)||"—"}</span></div>
          <div class="row"><span class="k">受付期間</span><span>${
            ev.applyStartAt ? Util.fmtDate(ev.applyStartAt) : "公開と同時"} 〜 ${
            ev.applyDeadline ? Util.fmtDate(ev.applyDeadline) : "—"}</span></div>
          <div class="row"><span class="k">公開範囲</span><span>${ev.visibility==="limited"?"限定公開":"一般公開"}</span></div>
          <div class="row"><span class="k">問い合わせ先</span><span>${Util.esc(ev.contactInfo)||"—"}</span></div>
        </div>
        <div class="row-actions" style="margin-top:16px;flex-wrap:wrap">
          <button class="btn" id="editBtn">✎ 編集する</button>
          <button class="btn" id="previewBtn">👁 参加者ビューで確認</button>
          <button class="btn" id="dupBtn">⧉ 複製</button>
          ${canPublish?'<button class="btn primary" id="publishBtn">公開する</button>':""}
          ${canCancel?'<button class="btn" id="cancelBtn" style="color:var(--danger)">中止する</button>':""}
          ${canDelete?'<button class="btn" id="deleteBtn" style="color:var(--danger)">削除</button>':""}
        </div>
      </div>`;
    pane.querySelector("#editBtn").onclick = () => App.openCreate(ev.id);
    // 下書きのままでも参加者ビューでの見え方を確認できる（F-07）
    pane.querySelector("#previewBtn").onclick = () => App.openPreview(ev.id);
    // 複製（F-94）。申込は複製せず、下書きとして作る。copiedFromId で元を辿れる
    pane.querySelector("#dupBtn").onclick = () => FB.confirmModal({
      title:"このイベントを複製しますか？", okLabel:"複製する",
      body:"内容をコピーした<b>下書き</b>を作ります。申込・お知らせ・運営タスクは複製されません。",
      onOk: async () => {
        try {
          const now = new Date().toISOString();
          const copy = { ...ev, id:Util.uid(), title:`${ev.title}（コピー）`,
            status:"draft", copiedFromId:ev.id, groupId:ev.groupId || ev.id,
            createdAt:now, updatedAt:now };
          await Repo.events.put(copy);
          FB.toast("複製しました。下書きとして作成されています");
          App.openEvent(copy.id);
        } catch (e) { FB.error("複製に失敗: " + e.message); }
      } });

    // 状態を1つ書き換えて詳細を再読込する。遷移は一方向（F-37）で、ここでしか変えない
    const transition = async (status, msg) => {
      try {
        await Repo.events.put({ ...ev, status, updatedAt:new Date().toISOString() });
        FB.toast(msg);
        await render(ctx.el, ev.id);
      } catch (e) { FB.error("状態の変更に失敗: " + e.message); }
    };

    const pub = pane.querySelector("#publishBtn");
    if (pub) pub.onclick = () => FB.confirmModal({
      title:"イベントを公開しますか？", okLabel:"公開する",
      body:"公開すると下書きには戻せません。この操作は取り消せません。",
      onOk:() => transition("published", "公開しました") });
    const can = pane.querySelector("#cancelBtn");
    if (can) can.onclick = () => FB.confirmModal({
      title:"イベントを中止しますか？", okLabel:"中止する", danger:true,
      body:"中止すると元に戻せません。既存の申込は変更されません（F-39）。",
      onOk:() => transition("cancelled", "中止しました") });
    const del = pane.querySelector("#deleteBtn");
    if (del) del.onclick = () => FB.confirmModal({
      title:"下書きを削除しますか？", okLabel:"削除する", danger:true,
      body:"この下書きを削除します。",
      onOk: async () => {
        try {
          await Repo.events.remove(ev.id);
          FB.toast("下書きを削除しました");
          App.go("events");
        } catch (e) { FB.error("削除に失敗: " + e.message); }
      } });
  }

  // persons をまとめて読んでおく（申込一覧の氏名・メール表示に必要）
  // initialTab は通知から該当タブを開くときに渡る（F-108）。無指定なら申込タブ（F-75）
  async function render(el, eventId, initialTab = null) {
    const [ev, apps, personsArr, tasks, msgs, readRows] = await Promise.all([
      Repo.events.get(eventId),
      Repo.applications.byEvent(eventId),
      Repo.persons.all(),
      Repo.tasks.byEvent(eventId),
      Repo.messages.byEvent(eventId),
      Repo.readStates.all()]);
    if (!ev) { el.innerHTML = `<div class="empty"><div class="big">イベントが見つかりません</div></div>`; return; }
    const _persons = {}; personsArr.forEach(p => _persons[p.id] = p);
    const unread = Ops.unreadOf(msgs, "thread", Ops.readMap(readRows), eventId);
    ctx = { ev, apps, _persons, tasks, unread, el };
    // 別のイベントを開いたら絞り込みは解除する（操作後の再描画では保持する）
    expandedId = null; query = "";
    tab = TABS.includes(initialTab) ? initialTab : "apply";
    paint();
  }

  return { render };
})();


// ===== [9b] 主催者：運営スレッド／運営Q&A（社内・実データで永続 / messages ストア） =====
/* 設計は複数人での共有管理を想定するが、サーバなし＝単一ブラウザのため実態は一人（同一
   ブラウザ）で管理する。別端末との同期はサーバ導入時まで不可。 */
const Ops = (() => {
  let lastAuthor = "運営"; // 直近の投稿者名を保持（セッション内）

  /* 既読位置（v3 の readStates）。「未読かどうか」は保存せず、既読時刻と投稿時刻から
     都度算出する。時期を保存しないのと同じ考え方（4-3）。
     既読位置が無いイベントは「全部未読」になる——まだ一度も開いていない、が正しい。 */
  const readKey = (eventId, channel) => `${eventId}:${channel}`;
  const unreadOf = (msgs, channel, readStates, eventId) => {
    const r = readStates[readKey(eventId, channel)];
    const since = r ? new Date(r.lastReadAt).getTime() : 0;
    return msgs.filter(m => m.channel === channel && new Date(m.createdAt).getTime() > since).length;
  };
  async function markRead(eventId, channel) {
    await Repo.readStates.put({ key:readKey(eventId, channel), eventId, channel,
      lastReadAt:new Date().toISOString() });
  }
  // 一覧など、複数イベントぶんをまとめて扱うとき用
  const readMap = (rows) => { const m = {}; rows.forEach(r => m[r.key] = r); return m; };

  // ---- 運営スレッド（チャット） ----
  async function renderThread(pane, eventId, onRead) {
    const all = await Repo.messages.byEvent(eventId);
    const msgs = all.filter(m => m.channel === "thread")
      .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    // 開いた時点で既読にする。以降の投稿だけが未読になる
    await markRead(eventId, "thread");
    onRead && onRead();
    pane.innerHTML = `
      <div class="chat" id="chatList">
        ${msgs.length ? msgs.map(bubble).join("")
          : `<div class="empty">まだ投稿がありません。最初のメッセージを送ってみましょう。</div>`}
      </div>
      <div class="composer">
        <div class="crow"><input class="author" id="opAuthor" value="${Util.esc(lastAuthor)}" placeholder="名前"></div>
        <textarea id="opBody" placeholder="メッセージを入力"></textarea>
        <div><button class="btn primary" id="opSend">送信</button></div>
      </div>`;
    const list = pane.querySelector("#chatList");
    list.scrollTop = list.scrollHeight;
    pane.querySelector("#opSend").onclick = async () => {
      const author = pane.querySelector("#opAuthor").value.trim() || "運営";
      const body = pane.querySelector("#opBody").value.trim();
      if (!body) { FB.toast("メッセージを入力してください"); return; }
      lastAuthor = author;
      await Repo.messages.put({ id:Util.uid(), eventId, channel:"thread",
        author, body, createdAt:new Date().toISOString() });
      renderThread(pane, eventId, onRead);
    };
    pane.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
      await Repo.messages.remove(b.dataset.del); renderThread(pane, eventId, onRead);
    });
  }
  const bubble = (m) => `<div class="bubble">
    <button class="del" data-del="${m.id}" title="削除">✕</button>
    <span class="who">${Util.esc(m.author||"運営")}</span><span class="when">${Util.fmtDateTime(m.createdAt)}</span>
    <div class="body">${Util.esc(m.body)}</div></div>`;

  // ---- 運営Q&A（疑問の登録・解消。例:「この荷物は地下か1階か」） ----
  async function renderQA(pane, eventId) {
    const all = await Repo.messages.byEvent(eventId);
    const qas = all.filter(m => m.channel === "qa")
      .sort((a,b) => (a.resolved?1:0)-(b.resolved?1:0) || new Date(b.createdAt)-new Date(a.createdAt));
    pane.innerHTML = `
      <div class="card pad" style="margin-bottom:14px">
        <div class="field"><label>新しい疑問</label>
          <textarea id="qaBody" placeholder="例: 受付の荷物は地下と1階のどちらに運ぶ？"></textarea></div>
        <div class="crow" style="display:flex;gap:8px;align-items:center">
          <input class="qa-author" id="qaAuthor" value="${Util.esc(lastAuthor)}" placeholder="名前">
          <button class="btn primary" id="qaAdd">登録</button></div>
      </div>
      <div id="qaList">${qas.length ? qas.map(qaCard).join("")
        : `<div class="empty">登録された疑問はありません。</div>`}</div>`;

    pane.querySelector("#qaAdd").onclick = async () => {
      const author = pane.querySelector("#qaAuthor").value.trim() || "運営";
      const body = pane.querySelector("#qaBody").value.trim();
      if (!body) { FB.toast("疑問の内容を入力してください"); return; }
      lastAuthor = author;
      await Repo.messages.put({ id:Util.uid(), eventId, channel:"qa", author, body,
        answer:"", resolved:false, createdAt:new Date().toISOString(), resolvedAt:null });
      renderQA(pane, eventId);
    };
    qas.forEach(q => {
      const bodyOf = () => { const ta = pane.querySelector(`[data-ansbody="${q.id}"]`); return ta ? ta.value : q.answer; };
      const ans = pane.querySelector(`[data-ans="${q.id}"]`);
      if (ans) ans.onclick = async () => { q.answer = bodyOf(); await Repo.messages.put(q); FB.toast("回答を保存しました"); renderQA(pane, eventId); };
      const tog = pane.querySelector(`[data-toggle="${q.id}"]`);
      if (tog) tog.onclick = async () => {
        q.answer = bodyOf();
        q.resolved = !q.resolved; q.resolvedAt = q.resolved ? new Date().toISOString() : null;
        await Repo.messages.put(q); renderQA(pane, eventId);
      };
      const del = pane.querySelector(`[data-qadel="${q.id}"]`);
      if (del) del.onclick = () => FB.confirmModal({ title:"この疑問を削除しますか？",
        okLabel:"削除する", danger:true, body:"登録された疑問と回答を削除します。",
        onOk: async () => { await Repo.messages.remove(q.id); renderQA(pane, eventId); } });
    });
  }
  const qaCard = (q) => `<div class="qa-item ${q.resolved?'resolved':''}">
    <div class="qa-q"><span class="badge ${q.resolved?'resolved':'open'}">${q.resolved?'解決済み':'未解決'}</span>
      <span>${Util.esc(q.body)}</span></div>
    <div class="qa-meta">${Util.esc(q.author||"運営")}・${Util.fmtDateTime(q.createdAt)}</div>
    <textarea data-ansbody="${q.id}" placeholder="回答・対応内容を入力">${Util.esc(q.answer||"")}</textarea>
    <div class="row-actions" style="margin-top:8px">
      <button class="btn sm primary" data-ans="${q.id}">回答を保存</button>
      <button class="btn sm" data-toggle="${q.id}">${q.resolved?'未解決に戻す':'解決にする'}</button>
      <button class="btn sm" data-qadel="${q.id}" style="color:var(--danger)">削除</button>
    </div></div>`;

  // ---- お知らせ（主催者→参加者への一方向の連絡。messages の channel:'notice'） ----
  /* メール送信はサーバが無いため不可能だが（4-1）、Peatix のメッセージがメール通知と
     受信箱の2層である以上、後者に相当する層はサーバ無しでも成立する。公開ページと
     マイ申込に出すことで、主催者→参加者の連絡手段を確保する。 */
  async function renderNotice(pane, eventId) {
    const all = await Repo.messages.byEvent(eventId);
    const list = noticesOf(all);
    pane.innerHTML = `
      <div class="card pad" style="margin-bottom:14px">
        <div class="field"><label>件名<span class="req">必須</span></label>
          <input id="ntTitle" placeholder="例: 開催場所を4階から6階に変更しました"></div>
        <div class="field"><label>本文</label>
          <textarea id="ntBody" placeholder="変更の理由や補足があれば記入"></textarea></div>
        <div class="crow" style="display:flex;gap:8px;align-items:center">
          <input class="qa-author" id="ntAuthor" value="${Util.esc(lastAuthor)}" placeholder="差出人">
          <button class="btn primary" id="ntAdd">お知らせを出す</button></div>
      </div>
      <div id="ntList">${list.length ? list.map(noticeCard).join("")
        : `<div class="empty">お知らせはまだありません。</div>`}</div>`;

    pane.querySelector("#ntAdd").onclick = async () => {
      const title = pane.querySelector("#ntTitle").value.trim();
      const body = pane.querySelector("#ntBody").value.trim();
      if (!title) { FB.toast("件名を入力してください"); return; }
      const author = pane.querySelector("#ntAuthor").value.trim() || "運営";
      lastAuthor = author;
      try {
        await Repo.messages.put({ id:Util.uid(), eventId, channel:"notice", author,
          title, body, createdAt:new Date().toISOString() });
        FB.toast("お知らせを公開しました");
        renderNotice(pane, eventId);
      } catch (e) { FB.error("お知らせの保存に失敗: " + e.message); }
    };
    pane.querySelectorAll("[data-ntdel]").forEach(b => b.onclick = () =>
      FB.confirmModal({ title:"このお知らせを取り下げますか？", okLabel:"取り下げる", danger:true,
        body:"参加者からも見えなくなります。",
        onOk: async () => {
          try { await Repo.messages.remove(b.dataset.ntdel); renderNotice(pane, eventId); }
          catch (e) { FB.error("取り下げに失敗: " + e.message); }
        } }));
  }
  const noticeCard = (n) => `<div class="qa-item">
    <div class="qa-q"><span class="badge phase">お知らせ</span><span>${Util.esc(n.title)}</span></div>
    <div class="qa-meta">${Util.esc(n.author||"運営")}・${Util.fmtDateTime(n.createdAt)}</div>
    ${n.body ? `<div style="white-space:pre-wrap">${Util.esc(n.body)}</div>` : ""}
    <div class="row-actions" style="margin-top:8px">
      <button class="btn sm" data-ntdel="${n.id}" style="color:var(--danger)">取り下げる</button>
    </div></div>`;

  // 参加者側に出す用（新しい順）。公開ページ・マイ申込の両方から使う
  const noticesOf = (msgs) => msgs.filter(m => m.channel === "notice")
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  return { renderThread, renderQA, renderNotice, noticesOf,
           unreadOf, markRead, readMap, readKey };
})();


// ===== [9c] 主催者：運営タスク（backlog風ボード＋タイムライン / E-2。tasks ストア） =====
/* 状態は 未対応／処理中／処理済／完了 の4段（Backlog に倣う）。ドラッグで状態と並び順が
   変わり、そのまま IndexedDB に保存される。並び順は order（10刻み）で保持。 */
const Tasks = (() => {
  let ctx = null;            // { pane, eventId, tasks, onChange }
  let view = "board";        // board | timeline（サブタブを離れても保持）
  let lastAssignee = "";     // 直近の担当者名（セッション内）

  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) ||
    new Date(a.createdAt) - new Date(b.createdAt);
  const pad2 = n => String(n).padStart(2, "0");
  // 日付は "YYYY-MM-DD" の文字列のまま扱う（Date 化による時差ずれを避ける）
  const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const fmtDay = (s) => s ? s.slice(5).replace("-", "/") : "";
  const todayKey = () => dayKey(new Date());

  async function render(pane, eventId, onChange) {
    const tasks = await Repo.tasks.byEvent(eventId);
    ctx = { pane, eventId, tasks: tasks.sort(byOrder), onChange };
    paint();
  }
  async function reload() {
    const tasks = await Repo.tasks.byEvent(ctx.eventId);
    ctx.tasks = tasks.sort(byOrder);
    paint();
    ctx.onChange && ctx.onChange();   // S-4 の固定表示（タスク進捗）を追随させる
  }

  function paint() {
    const { pane, tasks } = ctx;
    const s = Domain.taskSummary(tasks);
    pane.innerHTML = `
      <div class="tk-head">
        <div class="tk-progress">
          <div class="tk-stat">進捗 <b>${s.done}/${s.total}</b>（${s.rate}%）${
            s.overdue ? ` ・ <span class="over">期限超過 ${s.overdue}件</span>` : ""}</div>
          <div class="tk-bar"><span style="width:${s.rate}%"></span></div>
        </div>
        <div class="toggles">
          <button data-view="board" class="${view==="board"?"on":""}">ボード</button>
          <button data-view="timeline" class="${view==="timeline"?"on":""}">タイムライン</button>
        </div>
        <button class="btn primary" id="tkAdd">＋ タスクを追加</button>
      </div>
      <div id="tkBody"></div>`;

    pane.querySelectorAll(".tk-head [data-view]").forEach(b =>
      b.onclick = () => { view = b.dataset.view; paint(); });
    pane.querySelector("#tkAdd").onclick = () => openEditor(null);

    const body = pane.querySelector("#tkBody");
    if (!tasks.length) {
      body.innerHTML = `<div class="empty"><div class="big">タスクがありません</div>
        「＋ タスクを追加」から、備品手配・会場設営などの準備タスクを登録できます。</div>`;
      return;
    }
    if (view === "board") renderBoard(body); else renderTimeline(body);
  }

  // ---- ボード（カンバン。ドラッグで状態変更・並べ替え） ----
  function renderBoard(host) {
    const { tasks } = ctx;
    host.innerHTML = `
      <div class="board">${Domain.TASK_FLOW.map(st => {
        const list = tasks.filter(t => t.status === st);
        return `<div class="col" data-col="${st}">
          <div class="ch"><span class="dot ${st}"></span>${Domain.TASK_STATUS[st]}
            <span class="cnt">${list.length}</span></div>
          <div class="drop" data-drop="${st}">${list.map(card).join("")}</div>
        </div>`;
      }).join("")}</div>`;
    wireBoard(host);
  }

  const card = (t) => {
    const over = Domain.taskOverdue(t);
    return `<div class="tcard p-${t.priority || "normal"}" draggable="true" data-id="${t.id}">
      <div class="t">${Util.esc(t.title)}</div>
      <div class="m">
        ${t.assignee ? `<span class="who">${Util.esc(t.assignee)}</span>` : ""}
        ${t.dueDate ? `<span class="due ${over?"over":""}">${over?"⚠":"🗓"} ${fmtDay(t.dueDate)}</span>` : ""}
        ${t.priority === "high" ? `<span class="pri">優先度 高</span>` : ""}
      </div></div>`;
  };

  function wireBoard(host) {
    host.querySelectorAll(".tcard").forEach(c => {
      c.ondragstart = (e) => {
        c.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", c.dataset.id);
      };
      c.ondragend = () => {
        c.classList.remove("dragging");
        host.querySelectorAll(".col").forEach(x => x.classList.remove("over"));
      };
      c.onclick = () => openEditor(ctx.tasks.find(t => t.id === c.dataset.id));
    });
    host.querySelectorAll("[data-drop]").forEach(zone => {
      zone.ondragover = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        zone.closest(".col").classList.add("over");
        // ドラッグ中は「掴んでいる要素そのもの」を移動する。innerHTML の全置換は行わない
        // （置換すると掴んだ参照が親を失い、以後の操作が画面に反映されなくなる）
        const dragging = host.querySelector(".tcard.dragging");
        if (!dragging) return;
        const after = afterElement(zone, e.clientY);
        if (after == null) zone.appendChild(dragging);
        else if (after !== dragging) zone.insertBefore(dragging, after);
      };
      zone.ondragleave = (e) => {
        if (!zone.contains(e.relatedTarget)) zone.closest(".col").classList.remove("over");
      };
      zone.ondrop = (e) => { e.preventDefault(); commit(host); };
    });
  }

  // カーソル位置より下にある最初のカード（そこへ挿入する）
  const afterElement = (zone, y) =>
    [...zone.querySelectorAll(".tcard:not(.dragging)")].find(el => {
      const r = el.getBoundingClientRect();
      return y < r.top + r.height / 2;
    }) || null;

  // DOM の並びを読み取り、変化したレコードだけを1トランザクションで保存（7-1）
  async function commit(host) {
    const map = {}; ctx.tasks.forEach(t => map[t.id] = t);
    const now = new Date().toISOString();
    const entries = [];
    let statusChanged = false;
    host.querySelectorAll("[data-drop]").forEach(zone => {
      const status = zone.dataset.drop;
      [...zone.querySelectorAll(".tcard")].forEach((el, i) => {
        const t = map[el.dataset.id];
        if (!t) return;
        const order = i * 10;
        if (t.status === status && t.order === order) return;
        if (t.status !== status) statusChanged = true;
        entries.push({ store:"tasks", record: { ...t, status, order, updatedAt: now,
          doneAt: status === "done" ? (t.doneAt || now) : null } });
      });
    });
    if (!entries.length) return;
    try {
      await Repo.bulkPut(entries);
      await reload();
      if (statusChanged) FB.toast("タスクの状態を更新しました");
    } catch (e) { FB.error("タスクの保存に失敗: " + e.message); }
  }

  // ---- タイムライン（ガント風。今日線・週末シェード） ----
  function renderTimeline(host) {
    const { tasks } = ctx;
    const dated = tasks.filter(t => t.startDate || t.dueDate);
    const undated = tasks.filter(t => !t.startDate && !t.dueDate);
    if (!dated.length) {
      host.innerHTML = `<div class="empty"><div class="big">日付が設定されたタスクがありません</div>
        タスクに開始日・期限日を設定すると、ここに表示されます。</div>` + undatedHtml(undated);
      wireRows(host);
      return;
    }
    // 範囲は「全タスクの最小開始日〜最大期限日」に今日を含め、前後1日の余白を付ける
    const spans = dated.map(t => {
      const a = t.startDate || t.dueDate, b = t.dueDate || t.startDate;
      return { t, s: a <= b ? a : b, e: a <= b ? b : a };
    });
    const tk = todayKey();
    const minKey = spans.map(x => x.s).concat(tk).sort()[0];
    const maxKey = spans.map(x => x.e).concat(tk).sort().pop();
    const first = shiftDay(minKey, -1);
    const total = Math.min(diffDays(first, maxKey) + 2, 180);  // 上限180日

    const cells = [];
    const index = {};
    for (let i = 0, k = first; i < total; i++, k = shiftDay(k, 1)) {
      const d = new Date(k + "T00:00:00");
      cells.push({ key:k, d, we: d.getDay() === 0 || d.getDay() === 6, now: k === tk });
      index[k] = i;
    }
    // 範囲外（180日超）に落ちたぶんは端に寄せる
    const at = (k) => index[k] != null ? index[k] : (k < first ? 0 : total - 1);

    const WD = ["日","月","火","水","木","金","土"];
    const months = [];
    cells.forEach(c => {
      const label = `${c.d.getFullYear()}年${c.d.getMonth()+1}月`;
      const last = months[months.length-1];
      if (last && last.label === label) last.n++; else months.push({ label, n:1 });
    });
    const nowLeft = index[tk] != null
      ? `<div class="tl-today" style="left:calc(var(--dw) * ${index[tk] + 0.5})"></div>` : "";
    const dayCells = cells.map(c =>
      `<div class="tl-c ${c.we?"we":""} ${c.now?"now":""}"></div>`).join("");

    host.innerHTML = `
      <div class="tl"><div class="tl-inner">
        <div class="tl-month">
          <div class="mlabel" style="width:var(--nw)">期間</div>
          ${months.map(m => `<div class="mlabel" style="width:calc(var(--dw) * ${m.n})">${m.label}</div>`).join("")}
        </div>
        <div class="tl-row head">
          <div class="tl-name">タスク（${dated.length}件）</div>
          <div class="tl-track">${cells.map(c =>
            `<div class="tl-d ${c.we?"we":""} ${c.now?"now":""}"><b>${c.d.getDate()}</b>${WD[c.d.getDay()]}</div>`).join("")}</div>
        </div>
        ${spans.map(({ t, s, e }) => {
          const i0 = at(s), i1 = at(e), over = Domain.taskOverdue(t);
          const len = Math.max(i1 - i0 + 1, 1);
          const label = len >= 3 ? `${fmtDay(s)}〜${fmtDay(e)}` : "";
          return `<div class="tl-row clickable" data-id="${t.id}">
            <div class="tl-name"><span class="dot ${t.status}"></span>
              <span class="nm" title="${Util.esc(t.title)}">${Util.esc(t.title)}</span>
              ${t.assignee ? `<span class="who">${Util.esc(t.assignee)}</span>` : ""}</div>
            <div class="tl-track">${dayCells}${nowLeft}
              <div class="tl-bar s-${t.status} ${over?"over":""}"
                style="left:calc(var(--dw) * ${i0});width:calc(var(--dw) * ${len} - 3px)"
                title="${Util.esc(t.title)} / ${Domain.TASK_STATUS[t.status]} / ${s}〜${e}">${label}</div>
            </div></div>`;
        }).join("")}
      </div></div>
      ${undatedHtml(undated)}`;
    wireRows(host);
  }

  const undatedHtml = (list) => !list.length ? "" :
    `<div class="tl-undated">日付未設定（${list.length}件）:
      ${list.map(t => `<span class="chip" data-id="${t.id}">
        <span class="dot ${t.status}"></span>${Util.esc(t.title)}</span>`).join("")}</div>`;

  function wireRows(host) {
    host.querySelectorAll("[data-id]").forEach(el =>
      el.onclick = () => openEditor(ctx.tasks.find(t => t.id === el.dataset.id)));
  }

  // 日付文字列の加減算（Date のローカル日付で行い、時差・夏時間の影響を受けない）
  function shiftDay(key, n) {
    const d = new Date(key + "T00:00:00");
    d.setDate(d.getDate() + n);
    return dayKey(d);
  }
  const diffDays = (a, b) =>
    Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);

  // ---- 追加・編集モーダル ----
  function openEditor(task) {
    const isNew = !task;
    const t = task || { title:"", detail:"", assignee:lastAssignee, status:"todo",
      priority:"normal", startDate:"", dueDate:"" };
    const opts = (obj, cur) => Object.entries(obj).map(([k, v]) =>
      `<option value="${k}"${cur === k ? " selected" : ""}>${v}</option>`).join("");

    const host = document.getElementById("modalHost");
    host.innerHTML = `<div class="modal wide">
      <h3>${isNew ? "タスクを追加" : "タスクを編集"}</h3>
      <div class="field" style="margin-top:14px"><label>タイトル<span class="req">必須</span></label>
        <input id="tkTitle" value="${Util.esc(t.title)}" placeholder="例: 会場の備品を手配する"></div>
      <div class="form-2col">
        <div class="field"><label>状態</label>
          <select id="tkStatus">${opts(Domain.TASK_STATUS, t.status)}</select></div>
        <div class="field"><label>優先度</label>
          <select id="tkPriority">${opts(Domain.PRIORITY, t.priority || "normal")}</select></div>
        <div class="field"><label>開始日</label>
          <input type="date" id="tkStart" value="${t.startDate || ""}"></div>
        <div class="field"><label>期限日</label>
          <input type="date" id="tkDue" value="${t.dueDate || ""}"></div>
      </div>
      <div class="field"><label>担当者</label>
        <input id="tkAssignee" value="${Util.esc(t.assignee || "")}" placeholder="例: 運営A"></div>
      <div class="field"><label>メモ</label>
        <textarea id="tkDetail" placeholder="補足・手順など">${Util.esc(t.detail || "")}</textarea></div>
      <div class="err" id="tkErr" style="color:var(--danger);font-size:12px;min-height:18px"></div>
      <div class="modal-actions">
        ${isNew ? "" : '<button class="btn" id="tkDel" style="color:var(--danger)">削除</button>'}
        <div class="spacer"></div>
        <button class="btn" id="tkCancel">キャンセル</button>
        <button class="btn primary" id="tkSave">保存</button>
      </div></div>`;
    host.classList.add("on");

    const q = (sel) => host.querySelector(sel);
    const close = () => { host.classList.remove("on"); host.innerHTML = ""; };
    q("#tkCancel").onclick = close;
    q("#tkTitle").focus();

    q("#tkSave").onclick = async () => {
      const title = q("#tkTitle").value.trim();
      const start = q("#tkStart").value, due = q("#tkDue").value;
      if (!title) { q("#tkErr").textContent = "タイトルを入力してください"; return; }
      if (start && due && start > due) {
        q("#tkErr").textContent = "開始日は期限日より後にできません"; return;
      }
      const status = q("#tkStatus").value;
      const assignee = q("#tkAssignee").value.trim();
      const now = new Date().toISOString();
      const fields = { title, detail:q("#tkDetail").value.trim(), assignee, status,
        priority:q("#tkPriority").value, startDate:start || null, dueDate:due || null,
        updatedAt:now, doneAt: status === "done" ? (t.doneAt || now) : null };
      const rec = isNew
        ? { id:Util.uid(), eventId:ctx.eventId, order:nextOrder(status), createdAt:now, ...fields }
        : { ...t, ...fields };
      lastAssignee = assignee;
      try {
        await Repo.tasks.put(rec);
        close();
        await reload();
        FB.toast(isNew ? "タスクを追加しました" : "タスクを保存しました");
      } catch (e) { FB.error("タスクの保存に失敗: " + e.message); }
    };

    const del = q("#tkDel");
    if (del) del.onclick = () => {
      close();   // confirmModal がホストを全置換するため、先に閉じる
      FB.confirmModal({ title:"このタスクを削除しますか？", okLabel:"削除する", danger:true,
        body:`「${Util.esc(t.title)}」を削除します。`,
        onOk: async () => {
          try { await Repo.tasks.remove(t.id); await reload(); FB.toast("タスクを削除しました"); }
          catch (e) { FB.error("タスクの削除に失敗: " + e.message); }
        } });
    };
  }

  // 追加先の列の末尾に置く
  const nextOrder = (status) => {
    const inCol = ctx.tasks.filter(t => t.status === status);
    return inCol.length ? Math.max(...inCol.map(t => t.order ?? 0)) + 10 : 0;
  };

  return { render };
})();


// ===== [9d] 主催者：参加者名簿 S-10（横断 / F-92） =====
/* 「データ蓄積が価値」の証明にあたる画面。persons を横断で一覧し、同一人物の参加履歴を
   まとめて見る。Peatix はイベント終了30日後にフォームデータを削除するため、ここが差になる。
   persons を後から足すと全 applications の付け替えが要る（4-5）ので当初から持っていた。 */
const Roster = (() => {
  let query = "";
  let openId = null;

  /* 参加者名簿はイベントを横断した個人情報の集積なので、開く前にパスワードを求める。
     **これは秘匿ではなく操作の抑止である。** 単一HTML・サーバなしという構成上、
     パスワードはソースに書かれており、DevTools から IndexedDB を直接見ることもできる。
     したがって守れるのは「肩越しの覗き見」と「誤って開く」ところまで。
     実効的な保護にはサーバ側の認証が要る（F-101）。
     解除はセッション内のみ保持する。再読込で再びロックされる。 */
  const PASSWORD = "admin";
  let unlocked = false;

  function lockHtml(err) {
    return `
      <div class="page-head"><h2>参加者</h2></div>
      <div class="card pad lock">
        <div class="lk-icon">🔒</div>
        <h3>参加者名簿はパスワードで保護されています</h3>
        <div class="lk-form">
          <input type="password" id="lkPw" placeholder="パスワード" autocomplete="off">
          <button class="btn primary" id="lkGo">解除</button>
        </div>
        ${err ? `<div class="lk-err">${Util.esc(err)}</div>` : ""}
      </div>`;
  }

  function renderLock(el, err) {
    el.innerHTML = lockHtml(err);
    const go = () => {
      const v = el.querySelector("#lkPw").value;
      if (v === PASSWORD) { unlocked = true; render(el); }
      else renderLock(el, "パスワードが違います");
    };
    el.querySelector("#lkGo").onclick = go;
    const pw = el.querySelector("#lkPw");
    pw.onkeydown = (e) => { if (e.key === "Enter") go(); };
    pw.focus();
  }

  const lock = () => { unlocked = false; };   // 明示的に再ロックする

  async function render(el) {
    if (!unlocked) { renderLock(el, null); return; }
    const [persons, apps, events] = await Promise.all([
      Repo.persons.all(), Repo.applications.all(), Repo.events.all()]);
    const evById = {}; events.forEach(e => evById[e.id] = e);
    const byPerson = groupBy(apps, "personId");

    const rows = persons.map(p => {
      const mine = (byPerson[p.id] || [])
        .sort((a,b) => new Date(b.appliedAt) - new Date(a.appliedAt));
      const valid = mine.filter(Domain.isValidApp);
      return { p, mine,
        total: valid.length,
        attended: mine.filter(a => a.status === "checkedin").length,
        cancelled: mine.filter(a => a.status === "cancelled").length,
        last: mine[0] ? mine[0].appliedAt : null,
        text: Util.normalize(p.name + p.nameKana + p.email) };
    }).sort((a,b) => b.total - a.total || new Date(b.last||0) - new Date(a.last||0));

    const q = Util.normalize(query);
    const shown = rows.filter(r => !q || r.text.includes(q));

    el.innerHTML = `
      <div class="page-head"><h2>参加者</h2>
        <span class="sub">${persons.length}人・のべ${apps.length}件の申込</span>
        <button class="btn sm" id="rLock" style="margin-left:auto">🔒 ロックする</button></div>
      <div style="display:flex;gap:10px;margin:12px 0">
        <input id="rSearch" value="${Util.esc(query)}" placeholder="氏名・カナ・メールで絞り込み"
          style="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit">
        <button class="btn" id="rCsv">CSV出力</button>
      </div>
      <div class="card">${shown.length ? `<table class="list">
        <thead><tr><th>氏名</th><th>カナ</th><th>メールアドレス</th>
          <th style="width:80px">参加</th><th style="width:90px">来場</th><th style="width:140px">最終申込</th></tr></thead>
        <tbody>${shown.map(r => rowHtml(r, evById)).join("")}</tbody></table>`
        : `<div class="empty"><div class="big">${persons.length ? "一致する参加者がいません" : "参加者がいません"}</div>
           ${persons.length ? "" : "申込が入ると、ここに蓄積されます。"}</div>`}</div>`;

    const box = el.querySelector("#rSearch");
    box.oninput = () => { query = box.value; render(el); };
    el.querySelector("#rCsv").onclick = () => exportCsv(shown);
    el.querySelector("#rLock").onclick = () => { unlocked = false; query = ""; openId = null; render(el); };
    el.querySelectorAll("tr[data-p]").forEach(tr =>
      tr.onclick = () => { openId = openId === tr.dataset.p ? null : tr.dataset.p; render(el); });
    el.querySelectorAll("[data-goev]").forEach(a =>
      a.onclick = (e) => { e.stopPropagation(); App.openEvent(a.dataset.goev); });
  }

  function rowHtml(r, evById) {
    const { p } = r;
    const main = `<tr class="clickable" data-p="${p.id}">
      <td>${Util.esc(p.name)}</td><td>${Util.esc(p.nameKana)}</td><td>${Util.esc(p.email)}</td>
      <td><b>${r.total}</b></td><td>${r.attended}</td>
      <td>${r.last ? Util.fmtDate(r.last) : "—"}</td></tr>`;
    if (openId !== p.id) return main;
    const label = { applied:"申込済", checkedin:"来場", cancelled:"キャンセル" };
    return main + `<tr class="expand-row"><td colspan="6"><div class="expand-inner">
      <div class="k" style="color:var(--muted);font-size:12px;margin-bottom:8px">参加履歴（${r.mine.length}件）</div>
      ${r.mine.map(a => {
        const ev = evById[a.eventId];
        return `<div class="hist">
          <span class="badge ${a.status==='cancelled'?'draft':a.status==='checkedin'?'published':'phase'}">${label[a.status]}</span>
          <a data-goev="${a.eventId}">${Util.esc(ev ? ev.title : "（削除されたイベント）")}</a>
          <span class="d">${ev && ev.startAt ? Util.fmtDate(ev.startAt) : "日程未定"}</span>
          <span class="d">申込 ${Util.fmtDate(a.appliedAt)}</span></div>`;
      }).join("")}
      ${p.contactConsent ? `<div class="hint" style="margin-top:8px">案内の受け取りに同意済み（${
        p.consentAt ? Util.fmtDate(p.consentAt) : "日時不明"}）</div>` : ""}
    </div></td></tr>`;
  }

  function exportCsv(rows) {
    const header = ["氏名","氏名（カナ）","メールアドレス","有効な申込数","来場回数","キャンセル数","最終申込日","案内の受取同意"];
    const body = rows.map(r => [r.p.name, r.p.nameKana, r.p.email,
      r.total, r.attended, r.cancelled, r.last ? Util.fmtDate(r.last) : "",
      r.p.contactConsent ? "同意" : "未同意"]);
    Util.downloadText("participants.csv", Util.buildCsv([header, ...body]));
    FB.toast("参加者名簿を出力しました");
  }

  return { render, lock };
})();


// ===== [9e] 主催者：イベントマニュアル（Markdown / F-99。manuals ストア） =====
/* 当日の進行・搬入・受付手順など、運営が見る手順書をイベントごとに持つ。
   ビューは 編集 / 分割 / プレビュー の3つ。**書き終えた後は読む回数の方が圧倒的に多い**ので、
   本文があるときはプレビューで開き、「編集」で書き換えに入る。初回（空）だけ編集で開く。 */
const Manual = (() => {
  let ctx = null;   // { pane, eventId, body, saved, mode }

  const TEMPLATE = `# 当日マニュアル

## タイムテーブル

| 時刻 | 内容 | 担当 |
|---|---|---|
| 17:00 | 会場設営・受付準備 | 運営A |
| 18:00 | 受付開始 | 運営B |
| 18:30 | 開会 | 運営A |

## 受付の手順

1. 参加者に氏名を伺う
2. 申込タブで検索、または **QRで受付** から読み取り
3. 名札をお渡しする

> 名簿に無い方は、その場で申込を作らず運営リーダーへ連絡すること。

## 持ち物チェック

- [ ] 名札・名簿の印刷
- [ ] 延長コード・電源タップ
- [ ] 受付用のノートPC

## 連絡先

- 運営リーダー: 内線 1234
- 会場管理: 内線 5678
`;

  async function render(pane, eventId) {
    const rec = await Repo.manuals.get(eventId);
    const body = rec ? rec.body : "";
    // 初回（本文が空）は編集から。以降はプレビューで開く
    ctx = { pane, eventId, body, saved: body, mode: body.trim() ? "preview" : "edit",
            updatedAt: rec ? rec.updatedAt : null };
    paint();
  }

  const dirty = () => ctx.body !== ctx.saved;

  function paint() {
    const { pane, mode } = ctx;
    const empty = !ctx.body.trim();
    pane.innerHTML = `
      <div class="mn-bar">
        <div class="toggles" style="margin-left:0">
          <button data-mode="edit" class="${mode==="edit"?"on":""}">編集</button>
          <button data-mode="split" class="${mode==="split"?"on":""}">分割</button>
          <button data-mode="preview" class="${mode==="preview"?"on":""}">プレビュー</button>
        </div>
        <span class="mn-state">${dirty() ? '<span class="dirty">未保存の変更があります</span>'
          : ctx.updatedAt ? `最終更新 ${Util.fmtDateTime(ctx.updatedAt)}` : ""}</span>
        ${empty ? `<button class="btn" id="mnTmpl">ひな形を挿入</button>` : ""}
        <button class="btn ${dirty()?"primary":""}" id="mnSave" ${dirty()?"":"disabled style=opacity:.5"}>保存</button>
      </div>
      <div class="mn-body ${mode}">
        ${mode !== "preview" ? `<textarea id="mnEdit" spellcheck="false"
          placeholder="# 当日マニュアル&#10;&#10;Markdown で書けます。">${Util.esc(ctx.body)}</textarea>` : ""}
        ${mode !== "edit" ? `<div class="mn-prev md" id="mnPrev">${
          empty ? `<div class="empty"><div class="big">マニュアルがありません</div>
            「編集」タブから書けます。「ひな形を挿入」で雛形から始められます。</div>`
          : Util.markdown(ctx.body)}</div>` : ""}
      </div>`;

    pane.querySelectorAll(".mn-bar [data-mode]").forEach(b =>
      b.onclick = () => { ctx.mode = b.dataset.mode; paint(); });

    const ta = pane.querySelector("#mnEdit");
    if (ta) {
      ta.oninput = () => {
        ctx.body = ta.value;
        // 分割ビューは打つそばから反映する。textarea は作り直さない（カーソルが飛ぶため）
        const prev = pane.querySelector("#mnPrev");
        if (prev) prev.innerHTML = Util.markdown(ctx.body);
        refreshBar();
      };
      ta.onkeydown = (e) => continueList(e, ta, pane);
      if (ctx.mode === "edit") ta.focus();
    }
    const tmpl = pane.querySelector("#mnTmpl");
    if (tmpl) tmpl.onclick = () => {
      ctx.body = TEMPLATE; ctx.mode = "split"; paint();
    };
    pane.querySelector("#mnSave").onclick = save;
  }

  /* リストの自動継続。`- ` の行で Enter を押したら次の行の行頭にも `- ` を入れる。
     箇条書き（`- ` `* ` `+ `）・チェックボックス（`- [ ] `）・番号付き（`1. `）に対応し、
     番号は1つ増やす。インデントは引き継ぐ。
     **中身が空の項目で Enter を押したら記号を消して抜ける**（リストの終わり方が無いと困る）。
     `paint()` は呼ばず値と選択位置を直接いじる。作り直すとカーソルが飛ぶ（11-2 と同じ理由）。 */
  const LIST_RE = /^(\s*)(?:([-*+])\s+(\[[ xX]\]\s+)?|(\d+)([.)])\s+)/;
  function continueList(e, ta, pane) {
    if (e.key !== "Enter" || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    if (start !== end) return;                       // 選択中は通常の改行にする
    const line = ta.value.slice(ta.value.lastIndexOf("\n", start - 1) + 1, start);
    const m = line.match(LIST_RE);
    if (!m) return;
    const [prefix, indent, bullet, box, num, dot] = m;

    e.preventDefault();
    // 記号だけの行（中身が空）は記号を消して抜ける
    if (line.trim() === prefix.trim()) {
      const from = start - line.length;
      ta.setRangeText(indent, from, start, "end");
    } else {
      const next = bullet
        ? `${indent}${bullet} ${box ? "[ ] " : ""}`
        : `${indent}${Number(num) + 1}${dot} `;
      ta.setRangeText("\n" + next, start, start, "end");
    }
    ctx.body = ta.value;
    const prev = pane.querySelector("#mnPrev");
    if (prev) prev.innerHTML = Util.markdown(ctx.body);
    refreshBar();
  }

  // 保存ボタンと状態表示だけ差し替える（入力中に全体を描き直さない）
  function refreshBar() {
    const btn = ctx.pane.querySelector("#mnSave");
    const st = ctx.pane.querySelector(".mn-state");
    if (btn) {
      btn.disabled = !dirty();
      btn.style.opacity = dirty() ? "" : ".5";
      btn.classList.toggle("primary", dirty());
    }
    if (st) st.innerHTML = dirty() ? '<span class="dirty">未保存の変更があります</span>'
      : ctx.updatedAt ? `最終更新 ${Util.fmtDateTime(ctx.updatedAt)}` : "";
  }

  async function save() {
    if (!dirty()) return;
    const now = new Date().toISOString();
    try {
      await Repo.manuals.put({ eventId: ctx.eventId, body: ctx.body, updatedAt: now });
      ctx.saved = ctx.body; ctx.updatedAt = now;
      FB.toast("マニュアルを保存しました");
      // 保存したら読む状態に戻す（書き終えた後は読む方が多い）
      ctx.mode = ctx.body.trim() ? "preview" : "edit";
      paint();
    } catch (e) { FB.error("マニュアルの保存に失敗: " + e.message); }
  }

  return { render };
})();


// ===== [9f] 主催者：ファイル共有（E-3 / F-102。files ストア） =====
/* 会場図・進行台本・配布資料など、運営が持ち回るファイルをイベント単位で置く。
   **File は Blob なので、そのまま IndexedDB に入れられる。** FileReader で読み直すと
   非同期処理が挟まり、トランザクションの罠（7-1）に近づくので通さない。
   運営が使うものなので参加者ビューには出さない（4-3）。 */
const Files = (() => {
  let ctx = null;   // { pane, eventId, files }

  const MAX = 20 * 1024 * 1024;   // 1ファイル20MBまで。ブラウザ内に平文で載るため上限を設ける
  const fmtSize = (n) => n < 1024 ? `${n} B`
    : n < 1024 * 1024 ? `${(n / 1024).toFixed(1)} KB`
    : `${(n / 1024 / 1024).toFixed(1)} MB`;
  const iconOf = (t, name) => {
    if ((t || "").startsWith("image/")) return "🖼";
    if ((t || "").startsWith("video/")) return "🎬";
    if (/\.pdf$/i.test(name)) return "📕";
    if (/\.(xlsx?|csv)$/i.test(name)) return "📊";
    if (/\.(docx?|txt|md)$/i.test(name)) return "📄";
    if (/\.(zip|7z|tar|gz)$/i.test(name)) return "🗜";
    return "📎";
  };

  async function render(pane, eventId) {
    const files = (await Repo.files.byEvent(eventId))
      .sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
    ctx = { pane, eventId, files };
    paint();
  }
  const reload = () => render(ctx.pane, ctx.eventId);

  function paint() {
    const { pane, files } = ctx;
    const total = files.reduce((n, f) => n + (f.size || 0), 0);
    pane.innerHTML = `
      <div class="fl-bar">
        <label class="btn primary" for="flInput">＋ ファイルを追加</label>
        <input type="file" id="flInput" multiple style="display:none">
        <span class="fl-sum">${files.length}件${total ? `・合計 ${fmtSize(total)}` : ""}</span>
      </div>
      ${files.length ? `<div class="fl-list">${files.map(row).join("")}</div>`
        : `<div class="card"><div class="empty"><div class="big">共有ファイルはありません</div>
           会場図・進行台本・配布資料などを置けます。1ファイル20MBまで。</div></div>`}`;

    pane.querySelector("#flInput").onchange = (e) => add(e.target.files);
    pane.querySelectorAll("[data-dl]").forEach(b =>
      b.onclick = () => download(b.dataset.dl));
    pane.querySelectorAll("[data-fdel]").forEach(b =>
      b.onclick = () => FB.confirmModal({ title:"このファイルを削除しますか？",
        okLabel:"削除する", danger:true, body:`「${Util.esc(b.dataset.fname)}」を削除します。`,
        onOk: async () => {
          try { await Repo.files.remove(b.dataset.fdel); FB.toast("削除しました"); await reload(); }
          catch (e) { FB.error("削除に失敗: " + e.message); }
        } }));
  }

  const row = (f) => `<div class="fl-item">
    <span class="fi">${iconOf(f.type, f.name)}</span>
    <div class="fm">
      <div class="fn">${Util.esc(f.name)}</div>
      <div class="fd">${fmtSize(f.size)}・${Util.fmtDateTime(f.uploadedAt)}
        ${f.uploadedBy ? `・${Util.esc(f.uploadedBy)}` : ""}</div>
    </div>
    <div class="row-actions">
      <button class="btn sm" data-dl="${f.id}">ダウンロード</button>
      <button class="btn sm" data-fdel="${f.id}" data-fname="${Util.esc(f.name)}"
        style="color:var(--danger)">削除</button>
    </div></div>`;

  // 選択されたぶんをまとめて1トランザクションで投入する。File は Blob なので読み直さない（7-1）
  async function add(fileList) {
    const picked = [...(fileList || [])];
    if (!picked.length) return;
    const tooBig = picked.filter(f => f.size > MAX);
    if (tooBig.length) {
      FB.error(`20MBを超えるファイルは追加できません: ${tooBig.map(f => f.name).join(", ")}`);
      return;
    }
    const now = new Date().toISOString();
    const entries = picked.map(f => ({ store:"files", record:{
      id:Util.uid(), eventId:ctx.eventId, name:f.name, type:f.type || "",
      size:f.size, blob:f, uploadedAt:now, uploadedBy:"運営" } }));
    try {
      await Repo.bulkPut(entries);
      FB.toast(`${picked.length}件を追加しました`);
      await reload();
    } catch (e) { FB.error("ファイルの保存に失敗: " + e.message); }
  }

  async function download(id) {
    try {
      const f = await Repo.files.get(id);
      if (!f) { FB.error("ファイルが見つかりません"); return; }
      // Blob として往復していない場合（構造化複製に対応しない環境）を明示的に弾く
      if (!f.blob || typeof f.blob.size !== "number") {
        FB.error("ファイルの実体を取り出せませんでした（この環境では Blob の保存に対応していない可能性があります）");
        return;
      }
      const url = URL.createObjectURL(f.blob);
      const a = document.createElement("a");
      a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    } catch (e) { FB.error("ダウンロードに失敗: " + e.message); }
  }

  return { render };
})();


// ===== [9g] 通知（S-11 / F-108。既存データの時刻から都度算出する） =====
/* **通知そのものを保存しない。** 各ストアが既に「いつ起きたか」を持っているので、
   それを集めて時刻で並べるだけで通知一覧になる（時期を保存しないのと同じ考え方 / 4-3）。
   保存する方式にすると、書き込み箇所すべてに通知の追記が必要になり、
   取りこぼしと二重登録が起きる。集約はここ1か所に閉じる。

   既読位置は `readStates` を再利用する（**スキーマは v5 のまま**）。通知はイベント横断なので
   キーは `__notify:organizer` / `__notify:participant:<personId>`。参加者ぶんに personId を
   入れるのは、同じブラウザを別の人が使ったときに既読を共有しないため（F-107 と同じ理由）。 */
const Notify = (() => {
  const LIMIT = 100;                       // 一覧に出す上限（古いものは切る）
  const DAYS = 90;                         // さかのぼる日数
  const keyOf = (view, personId) =>
    view === "organizer" ? "__notify:organizer" : `__notify:participant:${personId || "-"}`;

  const at = (iso) => iso ? new Date(iso).getTime() : 0;
  // 主催者：9つのタブのうち、変更が記録として残るものを集める。
  // 「告知」タブは共有URLと投稿文を読むだけで保存を伴わないため、通知の対象にならない。
  const ORG_KIND = {
    apply:   { label:"申込",         tab:"apply",  cls:"phase" },
    checkin: { label:"受付",         tab:"apply",  cls:"published" },
    cancel:  { label:"キャンセル",   tab:"apply",  cls:"draft" },
    thread:  { label:"運営スレッド", tab:"thread", cls:"phase" },
    qa:      { label:"運営Q&A",      tab:"qa",     cls:"limited" },
    task:    { label:"運営タスク",   tab:"tasks",  cls:"phase" },
    manual:  { label:"マニュアル",   tab:"manual", cls:"phase" },
    file:    { label:"ファイル",     tab:"files",  cls:"phase" },
    notice:  { label:"お知らせ",     tab:"notice", cls:"published" },
    event:   { label:"イベント",     tab:"edit",   cls:"phase" },
  };

  /* 主催者向けの通知を組み立てる。全ストアを読むが、件数が数百件規模なので
     並列取得＋切り詰めで足りる（イベントが100を超えたら 10章の方針に従い絞り込みに変える）。 */
  async function forOrganizer(now = Date.now()) {
    const [events, apps, personsArr, msgs, tasks, manuals, files] = await Promise.all([
      Repo.events.all(), Repo.applications.all(), Repo.persons.all(),
      Repo.messages.all(), Repo.tasks.all(), DB.getAll("manuals"), DB.getAll("files")]);
    const evById = {}; events.forEach(e => evById[e.id] = e);
    const pById = {}; personsArr.forEach(p => pById[p.id] = p);
    const since = now - DAYS * 86400000;
    const out = [];
    const add = (kind, iso, eventId, text) => {
      const t = at(iso);
      if (!t || t < since || t > now || !evById[eventId]) return;
      out.push({ kind, at:iso, ts:t, eventId, title:evById[eventId].title, text });
    };

    for (const a of apps) {
      const nm = (pById[a.personId] || {}).name || "参加者";
      add("apply", a.appliedAt, a.eventId, `${nm} さんが申込みました`);
      add("checkin", a.checkinAt, a.eventId, `${nm} さんを受付しました`);
      add("cancel", a.cancelledAt, a.eventId, `${nm} さんの申込がキャンセルされました`);
    }
    for (const m of msgs) {
      if (m.channel === "thread") add("thread", m.createdAt, m.eventId, `${m.author || "運営"}：${m.body || ""}`);
      else if (m.channel === "qa") {
        add("qa", m.createdAt, m.eventId, `疑問が登録されました：${m.body || ""}`);
        add("qa", m.resolvedAt, m.eventId, `疑問が解決しました：${m.body || ""}`);
      } else if (m.channel === "notice") add("notice", m.createdAt, m.eventId, `お知らせを掲示しました：${m.title || ""}`);
    }
    for (const t of tasks) {
      add("task", t.createdAt, t.eventId, `タスクを追加しました：${t.title || ""}`);
      // 追加と同時刻の更新は追加だけを出す（同じ操作で2件並ばないように）
      if (at(t.updatedAt) > at(t.createdAt))
        add("task", t.updatedAt, t.eventId,
          `タスクを${t.status === "done" ? "完了に" : "更新"}しました：${t.title || ""}`);
    }
    for (const m of manuals) add("manual", m.updatedAt, m.eventId, "マニュアルを更新しました");
    for (const f of files) add("file", f.uploadedAt, f.eventId, `ファイルを追加しました：${f.name || ""}`);
    for (const e of events) {
      if (at(e.updatedAt) > at(e.createdAt))
        add("event", e.updatedAt, e.id,
          e.status === "cancelled" ? "イベントを中止にしました"
          : e.status === "published" ? "イベントの内容を更新しました（公開中）"
          : "下書きを更新しました");
      else add("event", e.createdAt, e.id, "イベントを作成しました");
    }
    return out.sort((a, b) => b.ts - a.ts).slice(0, LIMIT);
  }

  /* 参加者向け。**自分が申込んだイベントに関するものだけ**を出す。
     運営スレッド・Q&A・タスク・マニュアル・ファイルは参加者に見せない（4-3）ので含めない。 */
  const PART_KIND = {
    notice:  { label:"お知らせ",   cls:"published" },
    cancelled:{ label:"中止",      cls:"cancelled" },
    updated: { label:"内容の変更", cls:"limited" },
    checkin: { label:"受付完了",   cls:"published" },
    cancel:  { label:"キャンセル", cls:"draft" },
    applied: { label:"申込完了",   cls:"phase" },
  };
  async function forParticipant(personId, now = Date.now()) {
    if (!personId) return [];
    const apps = await Repo.applications.byPerson(personId);
    if (!apps.length) return [];
    const ids = [...new Set(apps.map(a => a.eventId))];
    const [evs, msgLists] = await Promise.all([
      Promise.all(ids.map(id => Repo.events.get(id))),
      Promise.all(ids.map(id => Repo.messages.byEvent(id))),
    ]);
    const evById = {}; evs.forEach(e => { if (e) evById[e.id] = e; });
    /* **イベントの動向（お知らせ・中止・内容の変更）は、有効な申込があるイベントに限る**（F-108c）。
       キャンセルしたイベントの動向はもう関係が無いため。判定は Domain.isValidApp に任せる
       （申込済・受付済が有効。キャンセル済みは除く / F-18 と同じ扱い）。
       **自分の申込の記録（申込完了・受付完了・キャンセル）は、キャンセル済みも残す**——
       自分が何をしたかの記録なので、消すと履歴が追えなくなる。 */
    const activeIds = new Set(apps.filter(Domain.isValidApp).map(a => a.eventId));
    const since = now - DAYS * 86400000;
    const out = [];
    const add = (kind, iso, eventId, text) => {
      const t = at(iso);
      if (!t || t < since || t > now || !evById[eventId]) return;
      out.push({ kind, at:iso, ts:t, eventId, title:evById[eventId].title, text });
    };
    msgLists.flat().forEach(m => {
      if (m.channel === "notice" && activeIds.has(m.eventId))
        add("notice", m.createdAt, m.eventId, m.title || "");
    });
    for (const id of ids) {
      const e = evById[id];
      if (!e || !activeIds.has(id)) continue;
      if (e.status === "cancelled") add("cancelled", e.updatedAt, id, "このイベントは中止になりました");
      else if (at(e.updatedAt) > at(e.createdAt)) add("updated", e.updatedAt, id, "イベントの内容が変更されました");
    }
    for (const a of apps) {
      add("applied", a.appliedAt, a.eventId, "申込を受け付けました");
      add("checkin", a.checkinAt, a.eventId, "当日の受付が完了しました");
      add("cancel", a.cancelledAt, a.eventId, "申込がキャンセルされました");
    }
    return out.sort((a, b) => b.ts - a.ts).slice(0, LIMIT);
  }

  const listFor = (view, personId) =>
    view === "organizer" ? forOrganizer() : forParticipant(personId);

  // 未読件数（タブのバッジ用）。最終閲覧時刻より後のものを数える——保存しないのは未読と同じ
  async function unreadCount(view, personId) {
    const [list, rec] = await Promise.all([
      listFor(view, personId), Repo.readStates.get(keyOf(view, personId))]);
    const since = rec ? at(rec.lastReadAt) : 0;
    return list.filter(n => n.ts > since).length;
  }
  async function markRead(view, personId) {
    await Repo.readStates.put({ key:keyOf(view, personId), eventId:"__notify",
      channel:"notify", lastReadAt:new Date().toISOString() });
  }

  // ---- 画面（S-11）----
  async function render(el) {
    const view = App.currentView();
    const me = view === "organizer" ? null : Auth.person();
    if (view !== "organizer" && !me) {           // 参加者はログインが要る（F-107 と同じ扱い）
      el.innerHTML = `
        <div class="page-head"><h2>通知</h2></div>
        <div class="lock">
          <div class="lk-icon">🔔</div>
          <h3>ログインしてください</h3>
          <div class="lk-form col"><button class="btn primary" id="ntLogin">マイ申込からログイン</button></div>
        </div>`;
      el.querySelector("#ntLogin").onclick = () => App.go("myticket");
      return;
    }
    const rec = await Repo.readStates.get(keyOf(view, me && me.id));
    const since = rec ? at(rec.lastReadAt) : 0;
    const list = await listFor(view, me && me.id);
    const KIND = view === "organizer" ? ORG_KIND : PART_KIND;

    el.innerHTML = `
      <div class="page-head"><h2>通知</h2>
        <span class="sub">${list.length ? `直近${DAYS}日・${list.length}件` : ""}</span></div>
      ${list.length ? `<div class="nt-list">${list.map(n => {
        const k = KIND[n.kind] || { label:n.kind, cls:"phase" };
        return `<div class="nt-item ${n.ts > since ? "new" : ""}" data-ev="${n.eventId}"
          ${view === "organizer" ? `data-tab="${k.tab}"` : ""}>
          <div class="nt-when">${Util.fmtDateTime(n.at)}</div>
          <div class="nt-main">
            <div class="nt-top"><span class="badge ${k.cls}">${Util.esc(k.label)}</span>
              <span class="nt-ev">${Util.esc(n.title)}</span></div>
            <div class="nt-text">${Util.esc(n.text)}</div>
          </div>
          <div class="nt-go">開く →</div>
        </div>`;
      }).join("")}</div>`
      : `<div class="card"><div class="empty"><div class="big">通知はありません</div>
         ${view === "organizer" ? "イベントの更新や申込があると、ここに新しい順で並びます。"
           : "申込んだイベントに更新があると、ここに並びます。"}</div></div>`}`;

    el.querySelectorAll("[data-ev]").forEach(row => row.onclick = () => {
